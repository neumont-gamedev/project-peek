<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Peek</title>
<link rel="icon" type="image/png" sizes="512x512" href="./project-peek-favicon.png?v=5">
<link rel="apple-touch-icon" href="./project-peek-favicon.png?v=5">
<style>
  :root {
    /* Canonical school palette: use these brand tokens for future design work. */
    --brand-yellow:#ffdd00; --brand-gray-light:#dbdddf; --brand-gray:#3f4444;
    --brand-gray-dark:#222223; --brand-black:#000000; --brand-white:#ffffff;
    --ground:var(--brand-gray-light); --surface:var(--brand-white); --surface-2:rgba(219,221,223,.38);
    --ink:var(--brand-gray-dark); --ink-soft:var(--brand-gray); --ink-faint:rgba(63,68,68,.68);
    --line:var(--brand-gray-light); --line-soft:rgba(63,68,68,.14);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-gray); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.22);
    --healthy:#2f8f4e; --healthy-bg:rgba(47,143,78,.12);
    --watch:#b5720a;  --watch-bg:rgba(181,114,10,.13);
    --risk:#c8402f;   --risk-bg:rgba(200,64,47,.12);
    --noaccess:#6b7688; --noaccess-bg:rgba(107,118,136,.12);
    --carried:#2f6fb5; --carried-bg:rgba(47,111,181,.12);
    --unrated:#8b93a3; --unrated-bg:rgba(139,147,163,.10);
    --shadow:0 1px 2px rgba(20,28,45,.04), 0 4px 16px rgba(20,28,45,.06);
    --ground-grad:linear-gradient(155deg, #eef3fa 0%, #e6edf8 48%, #dde7f5 100%);
    --field:var(--surface-2);   /* data-entry fields */
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.07) 0%, transparent 55%),
      linear-gradient(160deg, #ffffff 0%, #f7f9fc 60%, #eef2f8 100%);
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    /* Type scale: every font size in the app comes from these. Weights are 600 or 700. */
    --fs-xs:11px;      /* uppercase mono tags: eyebrows, badges, pills, table heads */
    --fs-sm:12.5px;    /* secondary text: notes, meta, legends */
    --fs-md:14px;      /* body, labels, inputs, buttons, nav */
    --fs-lead:15px;    /* intro paragraphs */
    --fs-h2:17px;      /* card and section headings */
    --fs-num:22px;     /* stat numbers */
    --fs-num-lg:30px;  /* headline stat numbers */
    --fs-h1:clamp(22px,2.4vw,26px);   /* page titles */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#000; --surface:#141416; --surface-2:#1e1e21;
      --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
      --line:#2a2a2e; --line-soft:rgba(219,221,223,.10);
      --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
      --accent-soft:rgba(255,221,0,.16);
      --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
      --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
      --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
      --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
      --carried:#6ea8ec; --carried-bg:rgba(110,168,236,.15);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --ground-grad:none;
    --field:#000;
    color-scheme:dark;
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.06) 0%, transparent 55%),
      linear-gradient(160deg, #222226 0%, #161618 55%, #0f0f11 100%);
    }
  }
  :root[data-theme="dark"] {
    --ground:#000; --surface:#141416; --surface-2:#1e1e21;
    --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
    --line:#2a2a2e; --line-soft:rgba(219,221,223,.10);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.16);
    --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
    --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
    --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
    --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
    --carried:#6ea8ec; --carried-bg:rgba(110,168,236,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --ground-grad:none;
    --field:#000;
    color-scheme:dark;
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.06) 0%, transparent 55%),
      linear-gradient(160deg, #222226 0%, #161618 55%, #0f0f11 100%);
  }
  :root[data-theme="dark"] input[type="date"],
  :root[data-theme="dark"] input[type="time"] { color-scheme:dark; background-color:var(--field)!important; color:var(--ink)!important; }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,
  :root[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="date"],
    :root:not([data-theme="light"]) input[type="time"] { color-scheme:dark; background-color:var(--field)!important; color:var(--ink)!important; }
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  }
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-fields-wrapper,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-hour-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-minute-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-ampm-field {
    background:transparent; color:var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-fields-wrapper,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-hour-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-minute-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-ampm-field {
      background:transparent; color:var(--ink);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display: none !important; }   /* ensure the hidden attribute wins over .app/.signin display rules */
  body { margin:0; background:var(--ground); background-image:var(--ground-grad); background-attachment:fixed;
    min-height:100vh; color:var(--ink); font-family:var(--font-sans);
    line-height:1.55; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent-ink); text-underline-offset:2px; }

  /* sign-in */
  .signin { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .signin .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:40px 36px; max-width:400px; text-align:center; }
  .signin .logo { font-family:var(--font-mono); font-size:var(--fs-xs); letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; }
  .signin h1 { margin:8px 0 6px; }
  .signin p { color:var(--ink-soft); font-size:var(--fs-md); margin:0 0 24px; }
  .signin-or{ display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--ink-faint); font-size:var(--fs-sm); }
  .signin-or::before, .signin-or::after{ content:""; flex:1; border-top:1px solid var(--line); }
  .link-form .add-group{ max-width:none; }
  .link-form input{ text-align:left; }
  .signin .link-msg{ margin:14px 0 0; padding:10px 12px; border-radius:8px; background:var(--surface-2);
    color:var(--ink); font-size:var(--fs-md); text-align:left; }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent); color:var(--accent-contrast); font-weight:600; font-size:var(--fs-md); padding:11px 20px; border-radius:10px; }
  .btn:hover { filter:brightness(.92); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--ink-faint); font-size:var(--fs-sm); }
  .muted.err { color:var(--risk); margin-top:10px; }

  .app { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100vh; }
  /* Left column: the logo pill, then the sidebar as its own rounded panel filling the rest. */
  .side-col { position:sticky; top:16px; align-self:start; height:calc(100vh - 32px); margin:16px 0 16px 16px;
    display:flex; flex-direction:column; gap:20px; min-height:0; }
  .side { flex:1 1 auto; min-height:0; overflow-y:auto;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:16px 14px 18px; display:flex; flex-direction:column; }
  .brand { display:flex; flex-direction:column; gap:6px; }
  /* Logo + name in a pill. */
  .brand-title{ display:flex; align-self:stretch; align-items:center; justify-content:center; gap:10px; min-width:0;
    height:54px; padding:0 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); }
  .brand-mark{ width:38px; height:auto; flex:0 0 38px; display:block; }
  .brand .code{ min-width:0; color:var(--ink); font-family:"Arial Rounded MT Bold","Trebuchet MS",var(--font-sans);
    font-size:20px; font-weight:900; line-height:1; letter-spacing:0; white-space:nowrap; }
  .brand .code .peek{ color:var(--brand-yellow); -webkit-text-stroke:.45px var(--brand-gray); text-shadow:0 1px 0 rgba(0,0,0,.18); }
  .brand .name { margin-left:16px; font-size:var(--fs-sm); font-weight:600; letter-spacing:0; color:var(--ink-soft); }
  /* Course / project / sprint pickers, with a rule under the group. */
  .switchers { display:flex; flex-direction:column; gap:8px; padding-bottom:16px; margin-bottom:6px;
    border-bottom:1px solid var(--line-soft); }
  .switcher select { width:100%; appearance:none; -webkit-appearance:none; cursor:pointer;
    font-family:var(--font-sans); font-size:15px; color:var(--ink);
    background-color:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:13px 38px 13px 16px;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
  .switcher select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .switcher select:disabled { cursor:default; color:var(--ink-soft); }
  .nav { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .nav-label { font-family:var(--font-mono); font-size:var(--fs-xs); letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 8px 6px; }
  .nav button { all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:12px; font-size:var(--fs-md); color:var(--ink-soft); }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  /* Selected item: solid brand yellow with a chevron on the right. */
  .nav button.active { background:var(--accent); color:var(--accent-contrast); font-weight:600; }
  .nav button.active::after { content:""; margin-left:auto; width:7px; height:7px; flex:0 0 auto;
    border-right:2px solid currentColor; border-top:2px solid currentColor; transform:rotate(45deg); margin-right:4px; }
  .nav button.active .nav-ic { color:var(--accent-contrast); }
  .nav button.active .dot { box-shadow:0 0 0 2px rgba(0,0,0,.25); }
  .nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .nav .nav-ic { width:8px; display:inline-flex; justify-content:center; font-size:var(--fs-sm); color:var(--ink-faint); }
  .nav .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nav .tname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot.healthy{background:var(--healthy);} .dot.watch{background:var(--watch);}
  .dot.risk{background:var(--risk);} .dot.noaccess{background:var(--noaccess);}
  .dot.unrated{background:var(--unrated);}

  .side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft); font-size:var(--fs-sm);
    color:var(--ink-soft); display:flex; flex-direction:column; gap:8px; }
  .side-foot .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-foot button { all:unset; cursor:pointer; color:var(--accent-ink); font-size:var(--fs-sm); }
  .side-foot button:hover { text-decoration:underline; }
  .sprint-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:18px; }
  .sprint-panel{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:19px 20px 18px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .12s, border-color .12s; }
  /* Status bar across the top, flush with the card edges (cancels the card padding). */
  .sp-bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:-19px -20px 2px; padding:11px 20px;
    background:var(--surface-2); color:var(--ink-soft); border-bottom:1px solid var(--line); }
  .sp-bar b{ font-family:var(--font-mono); font-size:var(--fs-sm); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .sp-bar-st{ display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-md); font-weight:600; }
  .sp-bar-st .d{ width:8px; height:8px; border-radius:50%; background:currentColor; }
  .sprint-panel.healthy .sp-bar, .sprint-panel.watch .sp-bar, .sprint-panel.risk .sp-bar, .sprint-panel.noaccess .sp-bar{
    color:var(--brand-black); border-bottom-color:transparent; }
  .sprint-panel.healthy .sp-bar{ background:var(--healthy); } .sprint-panel.watch .sp-bar{ background:var(--watch); }
  .sprint-panel.risk .sp-bar{ background:var(--risk); } .sprint-panel.noaccess .sp-bar{ background:var(--noaccess); }
  .sprint-panel:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .sprint-panel:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sprint-panel .pill{ align-self:flex-start; }
  .sp-tag{ font-family:var(--font-mono); font-size:var(--fs-xs); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .sp-badge{ padding:2px 9px; border-radius:999px; background:var(--accent); color:var(--accent-contrast);
    font-family:var(--font-mono); font-size:var(--fs-xs); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .sp-dates{ display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:28px;
    font-size:var(--fs-md); color:var(--ink-soft); }
  .sp-body{ display:flex; align-items:center; gap:20px; margin:5px 0; }
  .sp-stats{ display:flex; flex-direction:column; gap:10px; font-size:var(--fs-md); color:var(--ink-soft); white-space:nowrap; }
  .hours-ring{ width:120px; height:120px; flex:0 0 120px; }
  .hours-ring circle{ fill:none; stroke-width:12; }
  .hours-ring .track{ stroke:var(--surface-2); }
  .hours-ring .arc{ stroke:var(--ink-faint); stroke-linecap:round; transition:stroke-dasharray .4s ease; }
  .hours-ring.low .arc{ stroke:var(--risk); }
  .hours-ring.ok .arc{ stroke:var(--healthy); }
  .hours-ring text{ text-anchor:middle; fill:var(--ink-soft); }
  .hours-ring .ring-n{ font-family:var(--font-mono); font-size:var(--fs-num); font-weight:600; fill:var(--ink); dominant-baseline:middle; }
  .hours-ring .ring-l{ font-size:9.5px; }
  .hours-ring.low .ring-n{ fill:var(--risk); }
  .hours-ring.ok .ring-n{ fill:var(--healthy); }
  .sp-stats b{ font-family:var(--font-mono); font-size:var(--fs-h2); color:var(--ink); margin-right:5px; font-variant-numeric:tabular-nums; }
  .chip-btn{ cursor:pointer; font:inherit; }
  .sp-foot{ display:flex; justify-content:space-between; align-items:center; }
  .sp-mood{ font-size:28px; line-height:1; }
  .sp-nudge{ font-size:var(--fs-md); font-weight:600; color:var(--accent-ink); }
  .callout{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:9px; padding:11px 13px;
    font-size:var(--fs-md); color:var(--ink); margin-bottom:12px; }
  /* Mirrors the left column (16px from the top, 54px logo box, 20px gap) so the first
     panel on each side starts at the same height. .main has 34px top padding. */
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; height:54px; margin:-18px 0 20px; }
  .icon-bar{ display:inline-flex; gap:8px; padding:6px; border-radius:12px; background:var(--surface);
    border:1px solid var(--line); box-shadow:var(--shadow); }
  .icon-circle{ all:unset; box-sizing:border-box; cursor:pointer; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; background:var(--surface-2); color:var(--ink-soft);
    transition:transform .12s, box-shadow .12s; }
  .icon-circle svg{ width:22px; height:22px; display:block; }
  .icon-circle:hover{ transform:translateY(-1px); box-shadow:0 0 0 2px var(--accent); color:var(--ink); }
  .icon-circle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .icon-circle.pen, .icon-circle.sync, .icon-circle.mode{ color:var(--ink); }
  .icon-circle.mode.on{ box-shadow:0 0 0 2px var(--accent); color:var(--accent-ink); }
  .icon-circle.sync{ position:relative; }
  .icon-circle.sync.warn::after{ content:""; position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%;
    background:var(--watch); box-shadow:0 0 0 2px var(--surface-2); }
  .icon-circle.sync.bad::after{ background:var(--risk); }
  .syncbar.bad{ border-color:var(--risk); background:var(--risk-bg); }
  .syncbar.bad .ico{ color:var(--risk); }
  .syncbar code{ font-family:var(--font-mono); font-size:var(--fs-sm); background:var(--field); padding:1px 6px; border-radius:5px; }
  /* Automatic sync summary: one row of label-over-value items. */
  .sched-sum{ display:flex; flex-wrap:wrap; gap:14px 40px; margin:14px 0 0; }
  .sched-sum dt{ font-size:var(--fs-sm); color:var(--ink-faint); margin-bottom:3px; }
  .sched-sum dd{ margin:0; font-size:var(--fs-md); font-weight:600; color:var(--ink); display:flex; align-items:center; gap:7px; }
  .sched-sum dd .d{ width:8px; height:8px; border-radius:50%; background:currentColor; }
  .sched-sum dd.on{ color:var(--healthy); } .sched-sum dd.off{ color:var(--risk); }
  .sched-warn{ color:var(--watch) !important; }
  .icon-circle.sync.spinning svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .icon-circle.sync.spinning svg{ animation:none; } .icon-circle.sync.spinning{ opacity:.6; } }
  .icon-circle.pen.on{ box-shadow:0 0 0 2px var(--accent); color:var(--accent-ink); }
  .icon-circle.off{ cursor:default; opacity:.35; filter:grayscale(1); }
  .icon-circle.off:hover{ transform:none; box-shadow:none; }
  .icon-circle .i-sun{ display:none; }
  :root[data-theme="dark"] .icon-circle .i-sun{ display:block; }
  :root[data-theme="dark"] .icon-circle .i-moon{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .icon-circle .i-sun{ display:block; }
    :root:not([data-theme="light"]) .icon-circle .i-moon{ display:none; }
  }
  .card.project-head{ margin-top:0; margin-bottom:8px; }
  .project-name{ margin:6px 0 0; }
  .view-flush > .top-row + .card{ margin-top:0; }   /* first panel lines up with the sidebar */   /* the top row supplies the gap above */
  .project-overview{ color:var(--ink-soft); font-size:var(--fs-lead); line-height:1.6; max-width:72ch; margin:12px 0 0; }
  .top-right{ display:inline-flex; align-items:center; gap:12px; }
  .account{ position:relative; }
  .account-btn{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:14px;
    height:54px; padding:0 16px 0 22px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); max-width:280px; }
  .account-btn:hover{ border-color:var(--accent); }
  .account-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .acct-text{ display:flex; flex-direction:column; min-width:0; line-height:1.25; }
  .acct-name{ font-size:var(--fs-md); font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-email{ font-size:var(--fs-sm); color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-chev{ width:18px; height:18px; flex:0 0 18px; color:var(--ink-soft); transition:transform .15s; }

function fmtWhen(d){
  if(!d) return "";
  const now = new Date(), sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (sameDay) return "today " + time;
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (d.toDateString() === yest.toDateString()) return "yesterday " + time;
  return d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + time;
}

/* GitHub token health, from the check saved by the last sync (manual or scheduled).
   A dead token turns every repo's fetch into a 401 and the sync keeps old numbers,
   so it gets its own banner on every visit rather than hiding in per-project lines. */
const TOKEN_WARN_DAYS=14;
function tokenProblem(){
  if(!GH_TOKEN) return null;
  if(GH_TOKEN.ok===false) return { level:"bad", text:GH_TOKEN.reason||"GitHub token expired or invalid" };
  const exp=GH_TOKEN.expires ? new Date(String(GH_TOKEN.expires).replace(" UTC","Z").replace(" ","T")) : null;
  if(exp && !isNaN(exp)){
    const days=Math.ceil((exp-Date.now())/86400000);
    if(days<=0) return { level:"bad", text:"The GitHub token has expired" };
    if(days<=TOKEN_WARN_DAYS) return { level:"warn", text:`The GitHub token expires in ${days} day${days===1?"":"s"} (${exp.toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"})})` };
  }
  return null;
}
function tokenBannerHTML(){
  const p=tokenProblem(); if(!p) return "";
  return `<div class="syncbar ${p.level==="bad"?"bad":"warn"}"><span class="ico">${p.level==="bad"?"✕":"⚠"}</span><div class="body">
    <h3>${esc(p.text)}</h3>
    <p class="muted">${p.level==="bad" ? "Commit numbers can't update until it's renewed. They show the last good values." : "Renew it before then so syncing keeps working."}
      Create a new classic token with the <b>repo</b> scope on GitHub, then run <code>firebase functions:secrets:set GITHUB_TOKEN</code>
      in the project folder and answer <b>Yes</b> to redeploy.</p>
  </div></div>`;
}
// Banner on the dashboard listing exactly what did not sync cleanly.
function syncBannerHTML(){
  if(!SYNC_REPORT) return "";
  const iss = SYNC_REPORT.issues || [];
  if(!iss.length){
    return `<div class="syncbar"><span class="ico">✓</span><div class="body">
      <h3>Last sync completed cleanly</h3>
      <p class="muted">All ${SYNC_REPORT.teams} ${L().units} refreshed from GitHub and Trello.</p>
    </div><button class="dismiss" data-mact="sync-dismiss" title="Dismiss">×</button></div>`;
  }
  const tokenDead=iss.length && iss.every(i=>/GitHub token expired or invalid/.test(i.github||""));
  if(tokenDead) return "";   // tokenBannerHTML already explains it, once
  return `<div class="syncbar warn"><span class="ico">⚠</span><div class="body">
    <h3>${iss.length} of ${SYNC_REPORT.teams} did not sync cleanly</h3>
    <p class="muted">Their numbers below are the last good values, not fresh ones.</p>
    <ul>${iss.map(i=>{
      const parts=[];
      if(i.github!=="ok") parts.push("GitHub: "+esc(i.github));
      if(i.trello!=="ok" && i.trello!=="no board link") parts.push("Trello: "+esc(i.trello));
      return `<li><b>${esc(i.team)}</b> — ${parts.join(" · ")}${i.stale?" <i>(kept previous data)</i>":""}</li>`;
    }).join("")}</ul>
  </div><button class="dismiss" data-mact="sync-dismiss" title="Dismiss">×</button></div>`;
}

/* ---------- sprints ----------
   A sprint is a course-level cadence: every team is on Sprint N together. Each team's
   window inside that sprint can differ, because they're reviewed on different weekdays,
   so an entry may override the sprint's start/end. Per-sprint activity is DERIVED by
   slicing act.commits_by_day (which the sync stores as full history) — nothing extra is
   collected, and a sprint added after the fact still gets a correct chart. */
function cpath(){ return `users/${OWNER_UID}/courses/${COURSE.id}`; }
function sprintKey(){ return "peek:sprint:" + UID + ":" + (COURSE ? COURSE.id : ""); }
function lastSprintId(){ try { return localStorage.getItem(sprintKey()); } catch(e){ return null; } }
/* Sprint phase comes from the calendar. Every project shares the sprint's dates; a
   sprint stays open for students through one grace day after it ends (to log the
   last hours and submit the retrospective), then closes. The rules enforce the same
   cut-off. Sprints without dates fall back to "newest is current". */
const GRACE_DAYS=1;
function addDays(iso,n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function lastSprint(){ return SPRINTS.length ? SPRINTS[SPRINTS.length-1] : null; }
function sprintPhase(sp){
  if(!sp) return "closed";
  if(!sp.start || !sp.end) return sp===lastSprint() ? "current" : "closed";
  if(TODAY < sp.start) return "upcoming";
  if(TODAY <= sp.end) return "current";
  if(TODAY <= addDays(sp.end, GRACE_DAYS)) return "grace";
  return "closed";
}
function activeSprint(){
  return SPRINTS.find(sp=>sprintPhase(sp)==="current")
    || [...SPRINTS].reverse().find(sp=>sp.start && sp.start<=TODAY) || lastSprint();
}
function isPast(sp){ const ph=sprintPhase(sp); return ph==="grace" || ph==="closed"; }   // the sprint has ended
function isClosed(sp){ return sprintPhase(sp)==="closed"; }                             // grace day over too
function frozen(){ return isClosed(SPRINT) && !(instructorView() && UNLOCKED); }
function entryOf(tid){ return ENTRIES[tid] || {}; }
function winOf(tid){ return { start:(SPRINT&&SPRINT.start)||"", end:(SPRINT&&SPRINT.end)||"" }; }
function statusOf(t){ const e=ENTRIES[t.id]; return (e && e.status) || t.status || "unrated"; }
function sliceCbd(cbd,start,end){ const o={};
  Object.keys(cbd||{}).forEach(d=>{ if((!start||d>=start)&&(!end||d<=end)) o[d]=cbd[d]; }); return o; }
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "Mon" for a YYYY-MM-DD date (read as UTC so the weekday never shifts by timezone).
function dowOf(iso){ const d=new Date(String(iso)+"T00:00:00Z");
  return isNaN(d) ? "" : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]; }
function fmtD(iso){ if(!iso) return ""; const p=String(iso).split("-");
  return p.length===3 ? `${MONS[+p[1]-1]} ${+p[2]}` : String(iso); }
function winLabel(tid){ const w=winOf(tid); return w.start&&w.end ? `${fmtD(w.start)} – ${fmtD(w.end)}` : ""; }
function nextDay(iso){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }

// A team's activity restricted to its window in the selected sprint. Same shape as
// `act`, so every card that renders activity keeps working unchanged.
function sprintAct(t){
  const a = t.act || {ok:false, obs:"No data."};
  if (!SPRINT || !a.ok) return a;
  const w=winOf(t.id), cbd=sliceCbd(a.commits_by_day, w.start, w.end), days=Object.keys(cbd).sort();
  const total=days.reduce((n,d)=>n+cbd[d],0);
  let contribs=a.contribs||[], allTime=true;
  const bda=a.by_day_author;
  if (bda){
    const c={};
    days.forEach(d=>{ const m=bda[d]||{}; Object.keys(m).forEach(n=>c[n]=(c[n]||0)+m[n]); });
    contribs=Object.keys(c).sort((x,y)=>c[y]-c[x]).map(n=>({ n, c:c[n],
      p: total ? Math.round(100*c[n]/total) : 0,
      note: ((a.contribs||[]).find(z=>z.n===n)||{}).note || "" }));
    allTime=false;
  }
  return { ...a, ok:true, total, days:days.length, commits_by_day:cbd, contribs, contribs_all_time:allTime,
    first: days[0]||"", last: days[days.length-1]||"",
    last_fmt: days.length ? fmtD(days[days.length-1]) : "—",
    span: days.length ? `${fmtD(days[0])} – ${fmtD(days[days.length-1])}` : "no commits in window" };
}

async function loadSprints(){
  SPRINTS=[];
  const snap = await getDocs(collection(db, `${cpath()}/sprints`));
  snap.forEach(d => SPRINTS.push({ id:d.id, ...d.data() }));
  SPRINTS.sort((a,b)=>(a.n||0)-(b.n||0));
  if(IS_ADMIN) await rollSprints().catch(e=>console.error("sprint rollover failed:", e));
  const want = lastSprintId();
  SPRINT = SPRINTS.find(sp=>sp.id===want) || activeSprint();
  UNLOCKED = false;
  renderSprintSel();
  await loadEntries();
}
// When the newest sprint has ended, add the next one(s) with the same length so
// students always have a current sprint. A course whose last sprint ended more than
// one sprint-length ago is treated as finished and left alone (no backfilling last
// term). Mirrors roll_sprints in functions/main.py.
async function rollSprints(){
  let cur=lastSprint();
  if(!cur || !cur.start || !cur.end || cur.end>=TODAY) return;
  const len=Math.round((new Date(cur.end+"T00:00:00Z")-new Date(cur.start+"T00:00:00Z"))/86400000)+1;
  if(addDays(cur.end, len) < TODAY) return;
  for(let guard=0; cur.end<TODAY && guard<52; guard++){
    const n=(cur.n||SPRINTS.length)+1, start=nextDay(cur.end);
    let sid="s"+n; while(SPRINTS.some(x=>x.id===sid)) sid+="b";
    const data={ n, name:"Sprint "+n, start, end:addDays(start,len-1), targetHours:targetOf(cur), auto:true };
    await setDoc(doc(db, `${cpath()}/sprints/${sid}`), { ...data, createdAt:serverTimestamp() });
    cur={ id:sid, ...data }; SPRINTS.push(cur);
  }
}
async function loadEntries(){
  ENTRIES={}; GOALS={}; TIME_ENTRIES={}; RETROS={}; PREV_ACTIONS={}; PREV_CARRIED={}; PREV_TEAM_ACTIONS={}; GRADES={}; EDITING_TIME="";
  if(!SPRINT) return;
  if(IS_ADMIN){
    const gs=await getDocs(query(collection(db,`${cpath()}/grades`), where("sprintId","==",SPRINT.id))).catch(e=>{ console.error("grades:", e); return null; });
    if(gs) gs.forEach(d=>{ const x=d.data(); GRADES[`${x.teamId}|${x.email}`]=x; });
  }
  const prev=prevSprint();
  if(prev && IS_ADMIN) await Promise.all(TEAMS.map(async t=>{
    const snap=await getDocs(collection(db,`${cpath()}/sprints/${prev.id}/entries/${t.id}/retro`)).catch(()=>null);
    const rows=snap ? snap.docs.map(d=>d.data()).map(r=>({ email:r.studentEmail||"",
      actions:(Array.isArray(r.actions)?r.actions:[]).filter(x=>typeof x==="string" && x) })).filter(r=>r.actions.length) : [];
    if(rows.length) PREV_TEAM_ACTIONS[t.id]=rows;
  }));
  if(prev && studentView()) await Promise.all(TEAMS.map(async t=>{
    const s=await getDoc(doc(db,`${cpath()}/sprints/${prev.id}/entries/${t.id}/retro/${USER_EMAIL}`)).catch(()=>null);
    const a=s&&s.exists() ? s.data().actions : null;
    if(Array.isArray(a)) PREV_ACTIONS[t.id]=a.filter(x=>typeof x==="string" && x);
    const gs=await getDocs(collection(db,`${cpath()}/sprints/${prev.id}/entries/${t.id}/goals`)).catch(()=>null);
    const carried=gs ? gs.docs.map(d=>({id:d.id,...d.data()})).filter(g=>g.studentEmail===USER_EMAIL && g.result==="carried")
      .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)) : [];
    if(carried.length) PREV_CARRIED[t.id]=carried;
  }));
  if(IS_ADMIN){
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${SPRINT.id}/entries`));
    snap.forEach(d => ENTRIES[d.id] = d.data());
  }else{
    await Promise.all(TEAMS.map(async t=>{
      const snap=await getDoc(doc(db,`${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`));
      if(snap.exists()) ENTRIES[t.id]=snap.data();
    }));
  }
  await Promise.all(TEAMS.map(async t => {
    const base = `${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`;
    const [goals, time, retro] = await Promise.all([
      getDocs(collection(db, `${base}/goals`)),
      getDocs(collection(db, `${base}/time`)),
      getDocs(collection(db, `${base}/retro`))
    ]);
    RETROS[t.id] = retro.docs.map(d=>({id:d.id,...d.data()}));
    GOALS[t.id] = goals.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    TIME_ENTRIES[t.id] = time.docs.map(d=>({id:d.id,...d.data()}))   // oldest first; same day by entry order
      .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  }));
}
function renderSprintSel(){
  const sel=$("sprintSel");
  if(!SPRINTS.length){ sel.innerHTML=`<option>No sprints yet</option>`; sel.disabled=true; return; }
  sel.disabled=false;
  sel.innerHTML = [...SPRINTS].reverse().map(sp=>{
    const tag = {current:" (current)", grace:" (last day)", upcoming:" (upcoming)", closed:" (past)"}[sprintPhase(sp)];
    return `<option value="${esc(sp.id)}">${esc(sp.name||("Sprint "+sp.n))}${tag}</option>`;
  }).join("");

async function setSprint(sid){

/* ---------- charts ---------- */
function computeRange(){
  let min=null,max=null;
  TEAMS.forEach(t=>{ const cbd=(t.act&&t.act.commits_by_day)||{};
    Object.keys(cbd).forEach(d=>{ if(!min||d<min)min=d; if(!max||d>max)max=d; }); });
  if(!max||TODAY>max) max=TODAY;
  RANGE=[min,max]; ALLDAYS=eachDay(min,max);
}
function eachDay(min,max){ const out=[]; if(!min) return out;
  let d=new Date(min+"T00:00:00Z"); const end=new Date(max+"T00:00:00Z"); let g=0;
  while(d<=end && g<400){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); g++; } return out; }
function chartSVG(cbd,{spark=false,band=null}={}){
  if(!ALLDAYS.length) return "";
  const w=spark?132:680,h=spark?26:96,padX=spark?1:10,padTop=spark?2:8,padBot=spark?2:16;
  const innerW=w-padX*2,innerH=h-padTop-padBot,n=ALLDAYS.length,bw=innerW/n;
  const vals=ALLDAYS.map(d=>cbd[d]||0),maxV=Math.max(1,...vals),baseY=h-padBot;
  let bars="";
  ALLDAYS.forEach((d,i)=>{ const v=cbd[d]||0; if(!v)return;
    const bh=Math.max(spark?1.5:2, v/maxV*innerH), x=padX+i*bw+bw*0.16, y=baseY-bh;
    bars+=`<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="1">`+
          (spark?"":`<title>${d}: ${v} commit${v==1?"":"s"}</title>`)+`</rect>`; });
  let extra="";
  if(!spark && band && band[0] && band[1]){
    const i0=ALLDAYS.findIndex(d=>d>=band[0]);
    let i1=-1; for(let i=ALLDAYS.length-1;i>=0;i--){ if(ALLDAYS[i]<=band[1]){ i1=i; break; } }
    if(i0>=0 && i1>=i0)
      extra+=`<rect class="band" x="${(padX+i0*bw).toFixed(1)}" y="${padTop}" width="${((i1-i0+1)*bw).toFixed(1)}" height="${(baseY-padTop).toFixed(1)}"/>`;
  }
  if(!spark){ const ti=ALLDAYS.indexOf(TODAY), tx=ti>=0?padX+ti*bw+bw*0.5:padX+innerW;
    extra+=`<line class="axis-base" x1="${padX}" y1="${baseY+0.5}" x2="${padX+innerW}" y2="${baseY+0.5}"/>`;
    extra+=`<line class="today-line" x1="${tx.toFixed(1)}" y1="${padTop}" x2="${tx.toFixed(1)}" y2="${baseY}"/>`;
    extra+=`<text class="axis-label" x="${padX}" y="${h-4}">${ALLDAYS[0]}</text>`;
    extra+=`<text class="axis-label" x="${padX+innerW}" y="${h-4}" text-anchor="end">${ALLDAYS[ALLDAYS.length-1]}</text>`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="commits per day">${extra}${bars}</svg>`;
}
/* One bar per day of the sprint window, styled like the Retrospectives hours bars. Every
   day gets a column whether or not anything was committed; days still ahead are faded. */
const DC_BAR=130;   // px height of the tallest bar
function dayBarsHTML(cbd,start,end){
  const days=eachDay(start,end), max=Math.max(1,...days.map(d=>cbd[d]||0));
  const cols=days.map(d=>{ const v=cbd[d]||0, ahead=d>TODAY;
    return `<div class="dc-col${d===TODAY?" today":""}${ahead?" ahead":""}" title="${esc(dowOf(d)+" "+fmtD(d))}: ${v} commit${v===1?"":"s"}">
      ${ahead?"":`<span class="dc-val">${v||""}</span>`}<span class="dc-bar${v?"":" stub"}"${v?` style="height:${Math.max(Math.round(v/max*DC_BAR),4)}px"`:""}></span></div>`; }).join("");
  const labels=days.map(d=>`<div class="dc-day${d===TODAY?" today":""}"><b>${dowOf(d)}</b><span>${fmtD(d)}</span></div>`).join("");
  return `<div class="dc-wrap"><div class="dchart" style="--n:${days.length}">${cols}${labels}</div></div>`;
}
function peak(cbd){ return Math.max(0, ...Object.values(cbd||{})); }
function rateStats(cbd){
  const days = Object.keys(cbd||{}).sort(); if (!days.length) return null;
  const total = Object.values(cbd).reduce((a,b)=>a+b,0);
  const first = new Date(days[0]+"T00:00:00Z"), last = new Date(days[days.length-1]+"T00:00:00Z");
  const spanDays = Math.max(1, Math.round((last-first)/86400000) + 1);
  const perWeek = Math.round(total / (spanDays/7) * 10) / 10;
  const cutoff = new Date(Date.now() - 14*86400000).toISOString().slice(0,10);
  const last14 = days.filter(d=>d>=cutoff).reduce((s,d)=>s+cbd[d],0);
  return { perWeek, last14, spanDays };
}

/* ---------- course overview (instructor) ----------
   One row per project, one column per sprint (oldest → newest). Each cell: hours
   against the sprint's target, goals done, the student's mood, and whether the
   retrospective is in; the cell is tinted by the instructor's rating. Loaded on
   demand (4 small reads per project per sprint) and cached until Refresh or a
   course change. */
function overviewViewHTML(){
  return `<div class="view" id="view-overview">
    <div id="overview-body">${overviewBodyHTML()}</div></div>`;

async function ensureOverview(){
  if(!COURSE || (OVERVIEW && OVERVIEW.course===COURSE.id)) return;
  const course=COURSE.id, cells={};
  const body=$("overview-body"); if(body) body.innerHTML=`<p class="muted">Loading the course overview…</p>`;
  try{
    await Promise.all(SPRINTS.map(async sp=>{
      const entries={};
      (await getDocs(collection(db,`${cpath()}/sprints/${sp.id}/entries`))).forEach(d=>entries[d.id]=d.data());
      await Promise.all(TEAMS.map(async t=>{
        const base=`${cpath()}/sprints/${sp.id}/entries/${t.id}`;
        const [goals,time,retro]=await Promise.all([getDocs(collection(db,`${base}/goals`)),
          getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/retro`))]);
        const rs=retro.docs.map(d=>d.data()), e=entries[t.id]||{};
        (cells[t.id] ||= {})[sp.id]={
          hours: time.docs.reduce((n,d)=>n+(Number(d.data().hours)||0),0),
          ...mainGoalsOf(goals.docs.map(d=>d.data()), t.studentEmails||[]),
          goals: goals.size, done: goals.docs.filter(d=>d.data().result==="done"||d.data().completed).length,
          partial: goals.docs.filter(d=>d.data().result==="partial").length,
          notdone: goals.docs.filter(d=>d.data().result==="notdone").length,
          carried: goals.docs.filter(d=>d.data().result==="carried").length,
          dropped: goals.docs.filter(d=>d.data().result==="dropped").length,
          submitted: rs.length>0, mood: rs.length ? rs[0].mood : null, moods: rs.map(r=>Number(r.mood)).filter(Boolean),
          wentWell: rs.length ? rs[0].wentWell||"" : "", improve: rs.length ? rs[0].improve||"" : "",
          actions: rs.length ? rs[0].actions||[] : [], followUp: rs.length ? rs[0].followUp||[] : [],
          status: e.status||"unrated", review: e.review||"", reviewDate: e.reviewDate||"" };
      }));
    }));
    if(!COURSE || COURSE.id!==course) return;   // switched course while loading
    OVERVIEW={ course, loadedAt:new Date(), cells };
  }catch(err){ console.error("overview load failed:", err); if(body) body.innerHTML=`<p class="muted">Couldn't load the overview: ${esc(err.message||err)}</p>`; return; }
  const el=$("overview-body"); if(el) el.innerHTML=overviewBodyHTML();
}

// CSV of the overview for grading: one row per project per sprint (upcoming sprints
// left out). UTF-8 with a BOM so Excel keeps emoji and accented names intact.
async function exportOverviewCSV(){
  await ensureOverview();
  if(!OVERVIEW || OVERVIEW.course!==COURSE.id){ alert("The overview hasn't loaded yet. Try again in a moment."); return; }
  const cols=["Course","Student","Email","Project","Sprint","Start","End","Target hours","Hours logged","Met target",
    "Goals","Goals done","Goals partly done","Goals not done","Retrospective submitted","Mood (1-5)","Mood",
    "What went well","Could be improved","Actions for next sprint","Follow-up on last sprint's actions","Rating","Review","Review date","Commits in sprint","Commits after sprint end"];
  const cell=v=>{ const t=v==null?"":String(v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const lines=[cols.map(cell).join(",")];
  const teams=[...TEAMS].sort((a,b)=>(a.team||"").localeCompare(b.team||""));
  for(const t of teams){
    const cbd=(usesRepo(t)&&t.act&&t.act.ok&&t.act.commits_by_day)||null;
    for(const sp of SPRINTS){
      if(sprintPhase(sp)==="upcoming") continue;
      const c=(OVERVIEW.cells[t.id]||{})[sp.id]; if(!c) continue;
      const target=targetOf(sp), m=moodOf(c.mood);
      const inSprint=cbd&&sp.start&&sp.end ? Object.values(sliceCbd(cbd,sp.start,sp.end)).reduce((a,b)=>a+b,0) : "";
      const after=cbd&&sp.end ? Object.keys(cbd).filter(d=>d>sp.end).reduce((a,d)=>a+cbd[d],0) : "";
      lines.push([COURSE.code||COURSE.id, t.team||"", (t.studentEmails||[]).join("; "), t.project||"",
        sp.name||("Sprint "+sp.n), sp.start||"", sp.end||"", target, Math.round(c.hours*100)/100, c.hours>=target?"Yes":"No",
        c.goals, c.done, c.partial, c.notdone, c.submitted?"Yes":"No", c.mood||"", m?m.l:"",
        c.wentWell, c.improve, (c.actions||[]).join("; "),
        (c.followUp||[]).map(f=>`${FOLLOW[f.r]||f.r}: ${f.a}`).join("; "), c.status==="unrated"?"":STATUS_LABEL[c.status], c.review, c.reviewDate,
        inSprint, after].map(cell).join(","));
    }
  }
  saveCSV(lines, "sprints");
}
// Rows of cells → a CSV download. UTF-8 with a BOM so Excel keeps emoji and accented names.
function csvCell(v){ const t=v==null?"":String(v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; }
function downloadCSV(rows, kind){ saveCSV(rows.map(r=>r.map(csvCell).join(",")), kind); }
function saveCSV(lines, kind){
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${(COURSE.code||COURSE.id).replace(/[^\w-]+/g,"_")}-${kind}-${TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function hoursOf(t){ return (TIME_ENTRIES[t.id]||[]).reduce((n,x)=>n+(Number(x.hours)||0),0); }

// Retrospectives submitted for the selected sprint; a team project averages its students.
function moodsOf(t){ return (RETROS[t.id]||[]).map(r=>({r, m:moodOf(r.mood)})).filter(x=>x.m); }

  return `<span class="dash-mood">${ms.map(x=>`<span class="dm-e" title="${esc(x.r.studentEmail||"")}: ${esc(x.m.l)}">${x.m.e}</span>`).join("")}</span>`;

function sortDashRows(rows){
  const {key,dir}=DASH_SORT, name=t=>(t.team||"").toLowerCase();
  const val={ name, project:t=>(t.project||"").toLowerCase(), hours:hoursOf, commits:commitsOf,
    status:t=>STATUS_ORDER.indexOf(statusOf(t)), mood:moodAvg }[key];
  return rows.sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x==null || y==null){ if(x!=y) return x==null ? 1 : -1; }
    else if(x<y) return -dir; else if(x>y) return dir;
    return name(a).localeCompare(name(b));
  });
}
function setDashSort(key){

/* ---------- sprint flow (student) ----------
   Not started → (add a goal) → In progress → (submit wrap-up) → Submitted.
   Time logging unlocks with the first goal; submitting locks the sprint for the
   student until the instructor reopens it. A past sprint is closed either way. */
// Rough (1) is retired: no longer offered, but kept so past retrospectives still show it.
const MOODS=[{v:1,e:"😞",l:"Rough",retired:true},{v:2,e:"😕",l:"Not great"},{v:3,e:"😐",l:"Okay"},{v:4,e:"🙂",l:"Good"},{v:5,e:"😄",l:"Great"}];
/* Goal results. Carry over: still the right goal, continued next sprint (the student adds it
   again from "Carried over" at planning). Dropped: no longer needed, e.g. after a pivot, with

const RESULTS={done:"Done",partial:"Partly done",carried:"Carry over",dropped:"Dropped",notdone:"Not done"};

function carriedGoals(tid){
  const mine=GOALS[tid]||[];

}
/* Retrospective actions: each wrap-up lists 1-3 things to do differently next sprint, and the

// Instructor sprint panel: what each student committed to at the end of last sprint,

function moodOf(v){ return MOODS.find(m=>m.v===Number(v)); }

function askDropReason(text, current=""){
  const r=prompt(`Why is this goal no longer needed? (one line)\n\n${text}`, current);
  return r==null ? null : r.trim().slice(0, MAX_DROP_REASON);

async function addCarried(tid,gid){
  const g=(PREV_CARRIED[tid]||[]).find(x=>x.id===gid), prev=prevSprint(); if(!g || !prev) return;
  const id="g-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6);
  await setDoc(doc(db, `${sprintEntryPath(tid)}/goals/${id}`), {text:g.text, completed:false, studentEmail:USER_EMAIL,
    carriedFrom:{sprintId:prev.id, goalId:g.id, n:((g.carriedFrom&&g.carriedFrom.n)||0)+1},
    createdAt:serverTimestamp(), updatedAt:serverTimestamp()});
  await loadEntries(); render(); stay(tid);
}
// Dropping a carried goal later records it on last sprint's goal (the rules allow only
// carried → dropped there once that sprint is closed).
async function dropCarried(tid,gid){
  const g=(PREV_CARRIED[tid]||[]).find(x=>x.id===gid), prev=prevSprint(); if(!g || !prev) return;
  const why=askDropReason(g.text); if(!why) return;
  await setDoc(doc(db, `${cpath()}/sprints/${prev.id}/entries/${tid}/goals/${gid}`), {result:"dropped", dropReason:why, updatedAt:serverTimestamp()}, {merge:true});
  await loadEntries(); render(); stay(tid);
}

// Reads the retrospective form; miss lists what's still needed in each section.
function readRetroForm(tid){
  const picked=n=>(document.querySelector(`input[name="${n}"]:checked`)||{}).value;
  const results=myGoals(tid).map(g=>({g, v:picked("res-"+g.id), why:fval("drop-"+g.id).slice(0,MAX_DROP_REASON)}));
  const followUp=prevActions(tid).slice(0,MAX_ACTIONS).map((a,i)=>({a:a.slice(0,300), r:picked(`fu-${tid}-${i}`)}));
  const f={ results, followUp, mood:Number(picked("mood-"+tid)||0), wentWell:fval("well-"+tid), improve:fval("improve-"+tid),
    actions:Array.from({length:MAX_ACTIONS},(_,i)=>fval(`act-${tid}-${i}`)).filter(Boolean),
    miss:{look:[], reflect:[], feel:[], plan:[]} };
  if(results.some(x=>!x.v)) f.miss.look.push("a result for every goal");
  if(results.some(x=>x.v==="dropped" && !x.why)) f.miss.look.push("why each dropped goal no longer applies");
  if(followUp.some(x=>!x.r)) f.miss.look.push("how each of last sprint's actions went");
  if(!f.wentWell) f.miss.reflect.push("what went well");
  if(!f.improve) f.miss.reflect.push("what could be improved");
  if(!f.mood) f.miss.feel.push("how the sprint felt");
  if(!f.actions.length) f.miss.plan.push("at least one action for next sprint");
  return f;
}
// Ticks finished sections; on a submit attempt (flag) also outlines the unfinished ones.
function markRetroSteps(tid, flag=false){
  const f=readRetroForm(tid);
  document.querySelectorAll(`#wrap-form-${tid} .rf-step`).forEach(sec=>{
    const open=f.miss[sec.dataset.step].length>0;
    sec.classList.toggle("done", !open);
    if(flag || !open) sec.classList.toggle("missing", open);
  });
  return f;
}
async function submitSprint(tid){
  const err=$("wrapErr-"+tid), f=markRetroSteps(tid, true);
  const {results, followUp, mood, wentWell, improve, actions}=f, miss=Object.values(f.miss).flat();
  if(miss.length){
    if(err) err.textContent="Still needed: "+miss.join(", ")+".";
    const first=document.querySelector(`#wrap-form-${tid} .rf-step.missing`); if(first) first.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(err) err.textContent="";
  try{
    // Goal results first: once the wrap-up exists the rules lock the goals.
    await Promise.all(results.filter(x=>x.g.result!==x.v || (x.v==="dropped" && x.g.dropReason!==x.why)).map(x=>
      setDoc(doc(db,`${sprintEntryPath(tid)}/goals/${x.g.id}`), {result:x.v, ...(x.v==="dropped"?{dropReason:x.why}:{}), updatedAt:serverTimestamp()}, {merge:true})));
    await setDoc(doc(db,`${sprintEntryPath(tid)}/retro/${USER_EMAIL}`),
      {studentEmail:USER_EMAIL, mood, wentWell, improve, actions, followUp, submittedAt:serverTimestamp()});
    await loadEntries(); render(); stay(tid);
  }catch(e){ console.error(e); if(err) err.textContent=e.code+" — "+e.message; }
}

async function setGoalResult(tid,gid,result){

  if(result==="dropped"){ const why=askDropReason(goal?goal.text:"", goal&&goal.dropReason||""); if(!why){ render(); stay(tid); return; } extra.dropReason=why; }
  await setDoc(doc(db,`${sprintEntryPath(tid)}/goals/${gid}`), {result, ...extra, updatedAt:serverTimestamp()}, {merge:true});

/* ---------- grading (instructor) ----------
   Scores the Sprint Review (rubrics/sprint-review.md, 20 pts) and the Retrospective
   (rubrics/retrospective.md, 10 pts) per student. Hours are calculated from logged time;
   demo follows the instructor's sprint rating (goals until it's rated) and board follows the
   Trello sync, both as suggestions until the instructor picks a score; meeting preparedness and the written retrospective answers are never guessed.
   Picks are saved in courses/{c}/grades, which only the instructor can read. */
const REVIEW_CRIT=[
  {k:"demo", l:"Demo", max:8, opts:[[8,"Exceeds"],[5,"Satisfactory"],[2,"Needs improvement"],[0,"No evidence"]]},
  {k:"hours", l:"Hours", max:6},
  {k:"board", l:"Board", max:3, opts:[[3,"Meets"],[0,"Does not meet"]]},
  {k:"meeting", l:"Meeting", max:3, opts:[[3,"On time & prepared"],[0,"Late / unprepared"]]}];
function gradeId(sid,tid,email){ return `${sid}__${tid}__${email}`; }
const fmtHrs=v=>String(Math.round(v*10)/10);
// Rubric tiers as a share of the sprint's target: 100% → 6, 50% → 4, 25% → 2.
function hoursPoints(h,target){ const p=target?h/target:0; return p>=1?6:p>=.5?4:p>=.25?2:0; }
// Each suggestion is {v: points, or null when the app can't tell, why: the evidence}.
function suggestHours(hours,sp){
  const t=targetOf(sp), why=hours?`${fmtHrs(hours)} / ${t} h (${t?Math.round(100*hours/t):0}%)`:"no hours documented";
  return { v:hoursPoints(hours,t), why:isPast(sp)?why:why+" · sprint still open" };
}
// The sprint rating is made after seeing the demo, so it maps straight to the rubric's levels.
const DEMO_BY_STATUS={healthy:8, watch:5, risk:2, noaccess:0};
function suggestDemo(goals,status){
  if(status in DEMO_BY_STATUS) return {v:DEMO_BY_STATUS[status], why:`sprint rated ${STATUS_LABEL[status]}`};
  const g=suggestGoalDemo(goals); return {...g, why:g.why+(g.v!=null?" · not rated yet":"")};
}
function suggestGoalDemo(goals){
  if(!goals.length) return {v:0, why:"no sprint goals"};
  const r=g=>g.result||(g.completed?"done":""), n=goals.length, main=r(goals[0]);
  if(!goals.some(r)) return {v:null, why:"goals not marked yet"};
  const done=goals.filter(g=>r(g)==="done").length, part=goals.filter(g=>r(g)==="partial").length;
  const v = main==="done" && done/n>=2/3 ? 8 : main==="done" || main==="partial" || (done+part)/n>=.5 ? 5 : 2;
  return {v, why:`main goal ${main?RESULT_PILL[main].toLowerCase():"not marked"} · ${done}/${n} done${part?` · ${part} partly`:""}`};
}
// The sync keeps the board's last 14 days of activity, so older sprints go to the instructor.
function suggestBoard(t,sp){
  if(!t.trello) return {v:null, why:"no Trello board linked"};
  const tr=t.act&&t.act.trello, ac=tr&&tr.activity, days=(ac&&ac.window_days)||14;
  if(!ac || !tr.date) return {v:null, why:"board couldn't be read"};
  if(sp.end && sp.end < addDays(tr.date,-days)) return {v:null, why:"board history doesn't reach this sprint"};
  const moves=ac.moves||0, made=ac.created||0, to=`in the ${days} days to ${fmtD(tr.date)}`;
  return moves+made ? {v:3, why:`${moves} card moves, ${made} created ${to}`} : {v:0, why:`no board activity ${to}`};
}
// One student's review. Each criterion: {v, why, src: confirmed | suggested | calculated | needs review}.
function reviewGrade(t,sp,goals,hours,saved,status){
  const sug={ demo:suggestDemo(goals,status), hours:suggestHours(hours,sp), board:suggestBoard(t,sp), meeting:{v:null, why:"set by instructor"} };
  const out={};
  REVIEW_CRIT.forEach(c=>{ const s=sug[c.k], pick=c.opts && saved && typeof saved[c.k]==="number" ? saved[c.k] : null;
    out[c.k] = pick!=null ? {v:pick, why:s.why, src:"confirmed"}
      : s.v!=null ? {v:s.v, why:s.why, src:c.opts?"suggested":"calculated"} : {v:null, why:s.why, src:"needs review"}; });
  out.total=REVIEW_CRIT.reduce((n,c)=>n+(out[c.k].v||0),0);
  out.open=REVIEW_CRIT.filter(c=>out[c.k].v==null).map(c=>c.l);
  return out;
}
// Retrospective: the rating point is automatic once submitted; the three written answers are
// scored 3 or 0 by the instructor (binary, per the rubric) and are never suggested.
const RETRO_CRIT=[{k:"retroWell", l:"What went well"}, {k:"retroImprove", l:"What could be improved"}, {k:"retroActions", l:"Action items"}];
function retroGrade(r, saved){
  if(!r) return {submitted:false, rating:0, total:0, open:[], picks:{}};
  const rating=moodOf(r.mood)?1:0, picks={};
  RETRO_CRIT.forEach(c=>{ if(saved && typeof saved[c.k]==="number") picks[c.k]=saved[c.k]; });
  return {submitted:true, rating, picks, total:rating+Object.values(picks).reduce((a,b)=>a+b,0),
    open:RETRO_CRIT.filter(c=>!(c.k in picks)).map(c=>c.l)};
}
function retroGradeHTML(t,r){
  const em=r.studentEmail, g=retroGrade(r, GRADES[`${t.id}|${em}`]);

      <option value="">Choose…</option>${[[3,"Full marks"],[0,"No marks"]].map(([v,l])=>
        `<option value="${v}"${g.picks[c.k]===v?" selected":""}>${v} · ${l}</option>`).join("")}</select></label>`).join("")}
    <span class="rt-auto">Rating <b>${g.rating}</b> / 1</span>

function studentHours(tid,em){ return (TIME_ENTRIES[tid]||[]).filter(x=>x.studentEmail===em).reduce((n,x)=>n+(Number(x.hours)||0),0); }

      <td class="gr-total"><b>${g.total}</b> / 20${g.open.length?`<small>to set: ${esc(g.open.join(", "))}</small>`:""}</td></tr>`; }).join("");
  return `<div class="card" id="grade-${t.id}"><div class="notes-head"><h2>Sprint review grade</h2><span class="muted">20 points · per student · only you see this</span></div>

    <tbody>${rows||`<tr><td colspan="6" class="muted">No students assigned yet.</td></tr>`}</tbody></table></div>

async function saveGrade(key,val){
  const [tid,email,k]=key.split("|"), v=val==="" ? null : Number(val);

// CSV for grading: one row per student per started sprint, both rubrics, with the evidence
// behind each score and what's still left for the instructor.
async function exportGradesCSV(){
  const sprints=SPRINTS.filter(sp=>sprintPhase(sp)!=="upcoming");
  if(!sprints.length){ alert("No sprints have started yet."); return; }
  const saved={}; (await getDocs(collection(db,`${cpath()}/grades`))).forEach(d=>saved[d.id]=d.data());
  const teams=[...TEAMS].sort((a,b)=>(a.team||"").localeCompare(b.team||""));
  const cols=["Course","Student","Email","Project","Sprint","Start","End",
    "Demo (8)","Demo basis","Hours (6)","Hours basis","Board (3)","Board basis","Meeting (3)","Meeting basis",
    "Review points (20)","Review still to set",
    "Retrospective submitted","Rating (1)","What went well (3)","What could be improved (3)","Action items (3)",
    "Retrospective points (10)","Retrospective still to grade",
    "What went well (answer)","What could be improved (answer)","Actions for next sprint (answer)"];
  const blocks=await Promise.all(teams.map(async (t,ti)=>Promise.all(sprints.map(async (sp,si)=>{
    const students=t.studentEmails||[]; if(!students.length) return [];
    const base=`${cpath()}/sprints/${sp.id}/entries/${t.id}`;
    const [entry,goals,time,retro]=await Promise.all([getDoc(doc(db,base)), getDocs(collection(db,`${base}/goals`)),
      getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/retro`))]);
    const gs=goals.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    const ts=time.docs.map(d=>d.data()), rs=retro.docs.map(d=>d.data()), status=(entry.exists()&&entry.data().status)||"unrated";
    return students.map(em=>{
      const hours=ts.filter(x=>x.studentEmail===em).reduce((n,x)=>n+(Number(x.hours)||0),0);
      const g=reviewGrade(t,sp,gs.filter(x=>x.studentEmail===em),hours,saved[gradeId(sp.id,t.id,em)],status);
      const r=rs.find(x=>x.studentEmail===em)||null, rg=retroGrade(r, saved[gradeId(sp.id,t.id,em)]);
      const pick=k=>!r ? 0 : k in rg.picks ? rg.picks[k] : "";
      const crit=k=>[g[k].v==null?"":g[k].v, `${g[k].src}: ${g[k].why}`];
      return [COURSE.code||COURSE.id, students.length>1?em:(t.team||em), em, t.project||"",
        sp.name||("Sprint "+sp.n), sp.start||"", sp.end||"",
        ...crit("demo"), ...crit("hours"), ...crit("board"), ...crit("meeting"),
        g.total, g.open.join("; "),
        rg.submitted?"Yes":"No", rg.rating, pick("retroWell"), pick("retroImprove"), pick("retroActions"),
        rg.total, rg.open.join("; "),

    });
  }))));
  downloadCSV([cols, ...blocks.flat(2)], "grades");
}

// Hours ring on a sprint panel: fills toward the sprint's target hours (set when the

const DEFAULT_TARGET_HOURS=20;
function targetOf(sp){ const n=Number(sp&&sp.targetHours); return n>0 ? n : DEFAULT_TARGET_HOURS; }
function hoursRingSVG(hours, target){
  const HOURS_TARGET=target||DEFAULT_TARGET_HOURS;
  const r=36, c=2*Math.PI*r, known=hours!=null, f=known?Math.min(hours/HOURS_TARGET,1):0;
  const cls=!known?"":hours>=HOURS_TARGET?"ok":"low";
  const label=known?String(Math.round(hours*10)/10):"…";
  return `<svg class="hours-ring ${cls}" viewBox="0 0 96 96" role="img" aria-label="${known?`${label} of ${HOURS_TARGET} hours`:"Loading hours"}">
    <circle class="track" cx="48" cy="48" r="${r}"/>
    ${f>0?`<circle class="arc" cx="48" cy="48" r="${r}" stroke-dasharray="${(c*f).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 48 48)"/>`:""}
    <text class="ring-n" x="48" y="45">${label}</text>
    <text class="ring-l" x="48" y="64">of ${HOURS_TARGET} hrs</text></svg>`;
}
/* Each student's main sprint goal (their oldest) in one sprint, and the rest as "other" goals.
   main: [{email, result, why}], result "done" / "partial" / "carried" / "dropped" / "notdone",
   "" (not marked yet) or "none" (no goal set); why is a drop's reason. others: {total, done,
   marked}, leaving dropped goals out. */
function mainGoalsOf(gs, emails){
  const res=g=>g.result || (g.completed?"done":""), sorted=[...gs].sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  const firsts=emails.map(em=>sorted.find(g=>g.studentEmail===em)||null);
  const rest=sorted.filter(g=>!firsts.includes(g) && res(g)!=="dropped");
  return { main: emails.map((em,i)=>({email:em, result: firsts[i] ? res(firsts[i]) : "none", why: firsts[i] && firsts[i].dropReason || ""})),
    others: {total:rest.length, done:rest.filter(g=>res(g)==="done").length, marked:rest.filter(g=>res(g)).length} };
}

   instructor's status, hours logged against the target, and the student's mood.

async function loadRetroHistory(tid){
  const rows=await Promise.all(SPRINTS.map(async sp=>{
    const base=`${cpath()}/sprints/${sp.id}/entries/${tid}`;
    const [e, retro, time, goals]=await Promise.all([getDoc(doc(db,base)),
      getDocs(collection(db,`${base}/retro`)), getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/goals`))]);
    const rs=retro.docs.map(d=>d.data());
    const gs=goals.docs.map(d=>d.data()).filter(g=>IS_ADMIN || g.studentEmail===USER_EMAIL);
    const res=g=>g.result || (g.completed?"done":"");
    const team=TEAMS.find(x=>x.id===tid), emails=IS_ADMIN ? (team&&team.studentEmails)||[] : [USER_EMAIL];
    return { sprint:sp, entry:e.exists()?e.data():{},
      goals:{ total:gs.length, done:gs.filter(g=>res(g)==="done").length,
        partial:gs.filter(g=>res(g)==="partial").length, notdone:gs.filter(g=>res(g)==="notdone").length,
        carried:gs.filter(g=>res(g)==="carried").length, dropped:gs.filter(g=>res(g)==="dropped").length,
        ...mainGoalsOf(gs, emails) },
      hours: time.docs.map(d=>d.data()).filter(x=>IS_ADMIN || x.studentEmail===USER_EMAIL)
        .reduce((n,x)=>n+(Number(x.hours)||0),0),
      retro: rs.find(r=>r.studentEmail===USER_EMAIL) || (IS_ADMIN ? rs[0] : null) || null };
  })).catch(err=>{ console.error("retro history:", err); return null; });
  if(!rows) return;
  RETRO_HISTORY[tid]=rows;
  const el=$("retros-"+tid); if(el) el.innerHTML=retroHistoryHTML(tid);
}

function summaryStats(items){
  const done=items.filter(x=>isPast(x.sp)), sc={};
  items.forEach(x=>{ sc[x.status]=(sc[x.status]||0)+1; });
  let gd=0, gp=0, gn=0, gu=0, counted=0;
  items.forEach(x=>{ const g=x.g, dropped=g.dropped||0, marked=g.done+g.partial+g.notdone+(g.carried||0)+dropped;
    const open=["current","grace"].includes(sprintPhase(x.sp));
    gd+=g.done; gp+=g.partial; gn+=g.notdone; gu+=g.total-marked; counted+=(open ? marked : g.total)-dropped; });
  const entered=done.reduce((n,x)=>n+x.hours,0), required=done.reduce((n,x)=>n+targetOf(x.sp),0);
  const rated=items.filter(x=>x.status in ATTENTION), marks=items.map(mainMark);
  let od=0, ot=0;
  items.forEach(x=>{ const o=x.g.others; if(!o) return; od+=o.done;
    ot+=["current","grace"].includes(sprintPhase(x.sp)) ? o.marked : o.total; });
  return { items, done, entered, required, avg: done.length ? entered/done.length : null,
    marks, othersDone:od, othersTotal:ot,
    sc, ranks:["healthy","watch","risk","noaccess"].filter(k=>sc[k]), unrated:sc.unrated||0,
    latest: rated.length ? rated[rated.length-1].status : null,
    gd, gp, gn, gu, counted, rate: counted ? Math.round(100*gd/counted) : 0,
    moods: items.map(x=>x.mood), names: items.map(x=>sprintName(x.sp)) };
}
/* One main-goal mark per sprint. Solo: the student's result. Team: the shared result when
   every student's is the same; otherwise partly when any were done or partly done, not done
   when any were missed or never set, else carried. Goals not marked yet are left out; a
   sprint where nothing is marked yet is "open". No goal set counts as not done. */
const MAIN_WORD={done:"Done", partial:"Partly done", carried:"Carried over", dropped:"Dropped", notdone:"Not done", "":"Not marked yet", none:"No goal set"};
function mainMark(x){
  const main=(x.g.main||[]), scored=main.filter(m=>m.result).map(m=>m.result==="none" ? "notdone" : m.result);
  const word=m=>MAIN_WORD[m.result]+(m.result==="dropped" && m.why ? ` (${m.why})` : "");
  const tip=main.map(m=>main.length>1 ? `${m.email.split("@")[0]}: ${word(m)}` : word(m)).join(" · ");
  if(!scored.length) return {mark:"open", tip: tip||"No students"};
  const has=r=>scored.includes(r);
  const mark=scored.every(r=>r===scored[0]) ? scored[0] : has("done")||has("partial") ? "partial" : has("notdone") ? "notdone" : "carried";
  return {mark, tip};
}
function retroItems(rows){
  return rows.filter(r=>sprintPhase(r.sprint)!=="upcoming").map(r=>({sp:r.sprint, hours:r.hours||0,
    status:r.entry.status||"unrated", g:r.goals||{total:0, done:0, partial:0, notdone:0},
    mood: r.retro ? chartMood(r.retro.mood) : null}));
}
// Status, goals and hours boxes: the Retrospectives summary column and the summary view's tiles.
function summaryBoxes(s, wide=false){
  const none=t=>`<span class="muted">${t}</span>`;
  const fmtH=v=>String(Math.round(v*10)/10);
  // Status: each sprint's rating in order, then how many got each.
  const status=s.items.length ? `<div class="rs-box">${wide ? statusStripHTML(s.items) : statusStripSVG(s.items)}
      <span class="rs-counts">${s.ranks.map(k=>`<span><i class="rg-key ${k}"></i><b>${s.sc[k]}</b> ${esc(STATUS_LABEL[k])}</span>`).join("")}</span>
      ${s.unrated?`<small>${s.unrated} not rated yet</small>`:""}</div>` : none("No sprints yet");
  // Goals: the main goal per sprint, then the other goals (and, in the summary view, the overall rate).
  const goals=s.items.length ? `<div class="rs-box">${wide && s.counted ? `<span class="rs-big">${s.rate}%</span><small>of all goals done</small>` : ""}
      ${wide ? goalStripHTML(s) : goalStripSVG(s)}
      <small>${esc(mainGoalLine(s))}</small>${otherGoalsLine(s)?`<small>${esc(otherGoalsLine(s))}</small>`:""}</div>` : none("No sprints yet");
  // Hours: average per finished sprint, then hours entered over hours required.
  const hours=`<span class="rs-big">${s.done.length?fmtH(s.avg)+" h":"—"}</span><small>avg per sprint</small>
      ${s.done.length ? `<span class="rs-big rs-gap ${s.entered>=s.required?"ok":"low"}">${fmtH(s.entered)} / ${fmtH(s.required)} h</span>
      <small>Total project hours</small>
      <small>required through ${esc(sprintName(s.done[s.done.length-1].sp))}</small>`
        : `<span class="rs-big rs-gap muted">—</span><small>no finished sprints yet</small>`}`;
  return { status, goals, hours };
}
/* Status per sprint as a strip of squares in sprint order: compact (on the same columns as
   the small hours and mood charts) or, for the summary view, bigger squares with the
   sprint number underneath. An outlined square is a sprint not rated yet. */
function ssClass(x){ return "ss-"+(x.status in ATTENTION ? x.status : "unrated"); }
function ssTitle(x){ return `${sprintName(x.sp)}: ${STATUS_LABEL[x.status]||"Not rated yet"}`; }
function statusStripSVG(items, {w=190}={}){
  const n=items.length, left=26, right=8, h=16, x=chartCols(n, left, w-right, false);
  const sz=Math.max(6, Math.min(14, n===1 ? 14 : (w-left-right)/(n-1)*.7));
  return `<svg class="rs-mood" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Status by sprint">${items.map((it,i)=>
    `<rect x="${(x(i)-sz/2).toFixed(1)}" y="${((h-sz)/2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" rx="3" class="${ssClass(it)}"><title>${esc(ssTitle(it))}</title></rect>`).join("")}</svg>`;
}
function statusStripHTML(items){
  return `<div class="ss-row">${items.map(it=>`<span class="ss-cell" title="${esc(ssTitle(it))}"><i class="ss-sq ${ssClass(it)}"></i>
    <small>S${esc(String(it.sp.n||""))}</small></span>`).join("")}</div>`;
}
// Main goal per sprint, on the same columns as the status strip; ✓ done, ~ partly, → carried
// over, ⤫ dropped, ✗ not done or no goal set.
const MARK_GLYPH={done:"✓", partial:"~", carried:"→", dropped:"⤫", notdone:"✗", open:""};
function goalStripSVG(s, {w=190}={}){
  const n=s.items.length, left=26, right=8, h=16, x=chartCols(n, left, w-right, false);
  const sz=Math.max(6, Math.min(14, n===1 ? 14 : (w-left-right)/(n-1)*.7));
  return `<svg class="rs-mood" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Main goal by sprint">${s.marks.map((m,i)=>
    `<g><title>${esc(sprintName(s.items[i].sp))} main goal: ${esc(m.tip)}</title>
      <rect x="${(x(i)-sz/2).toFixed(1)}" y="${((h-sz)/2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" rx="3" class="mg-${m.mark}"/>
      ${sz>=10&&MARK_GLYPH[m.mark]?`<text x="${x(i).toFixed(1)}" y="${(h/2+3.5).toFixed(1)}" text-anchor="middle" class="mg-glyph">${MARK_GLYPH[m.mark]}</text>`:""}</g>`).join("")}</svg>`;
}
function goalStripHTML(s){
  return `<div class="ss-row">${s.marks.map((m,i)=>`<span class="ss-cell" title="${esc(sprintName(s.items[i].sp))} main goal: ${esc(m.tip)}">
    <i class="ss-sq mg-${m.mark}">${MARK_GLYPH[m.mark]}</i><small>S${esc(String(s.items[i].sp.n||""))}</small></span>`).join("")}</div>`;
}
function mainGoalLine(s){
  const c={}; s.marks.forEach(m=>{ c[m.mark]=(c[m.mark]||0)+1; });
  const parts=[["done","done"],["partial","partly"],["carried","carried"],["dropped","dropped"],["notdone","not done"]]
    .filter(([k])=>c[k]).map(([k,l])=>`${c[k]} ${l}`);
  return parts.length ? "Main goal: "+parts.join(" · ") : "Main goal not marked yet";
}
function otherGoalsLine(s){ return s.othersTotal ? `Other goals ${s.othersDone} of ${s.othersTotal} done` : ""; }
// Summary column on the Retrospectives grid: one cell per row covering every sprint that has started.
function retroSummaryCells(rows){
  const s=summaryStats(retroItems(rows)), b=summaryBoxes(s);
  const sum=(body,extra="")=>`<div class="rg-c rg-sum${extra}">${body}</div>`;
  return { head:`<div class="rg-c rg-sum rg-h"><span class="rg-sp">Summary</span><small>${s.items.length} sprint${s.items.length===1?"":"s"} so far</small></div>`,
    status:sum(b.status), goals:sum(b.goals),
    hours:sum(`<div class="rs-box">${b.hours}<span class="rs-gap">${hoursBarsSVG(s.items.map(x=>x.sp), s.items.map(x=>x.hours), {w:190, h:60})}</span></div>`," rg-hours"),
    mood:sum(moodLineSVG(s.moods, s.names)) };
}
// Summary view of the Retrospectives page: the figures as tiles, the charts full width.
function retroSummaryViewHTML(rows){
  const s=summaryStats(retroItems(rows)), b=summaryBoxes(s, true), sps=s.items.map(x=>x.sp);
  if(!sps.length) return `<div class="card"><p class="muted">No sprint has started yet.</p></div>`;
  const key=(c,l)=>`<span><i class="rg-key ${c}"></i>${esc(l)}</span>`;
  return `<div class="card sumv">
    <div class="sumv-tiles">
      <section class="sumv-tile"><h3>Status</h3>${b.status}</section>
      <section class="sumv-tile"><h3>Goals</h3>${b.goals}</section>
      <section class="sumv-tile"><h3>Hours</h3><div class="rs-box">${b.hours}</div></section>
    </div>
    <div class="sumv-charts">
      <section class="sumv-chart"><h3>Hours per sprint</h3>
        <div class="sumv-legend">${key("healthy","Met target")}${key("risk","Under target")}${key("run","In progress")}${key("target","Target")}</div>
        ${hoursBarsSVG(sps, s.items.map(x=>x.hours), {w:480, h:200, labels:axisLabels(sps)})}</section>
      <section class="sumv-chart"><h3>Mood per sprint</h3>
        <div class="sumv-legend"><span>How each sprint felt, from your retrospective</span></div>

    </div></div>`;
}
// Column centres for a small per-sprint chart: spread edge to edge when compact, centred in
// equal slots when each sprint is labelled underneath.
function chartCols(n, x0, x1, slots){
  const span=x1-x0;
  return slots ? i=>x0+(i+.5)*span/n : i=>n===1 ? x0+span/2 : x0+i*span/(n-1);
}
function sprintChartSVG(w, h, labels, aria, body){
  return `<svg class="rs-mood${labels?" fluid":""}" viewBox="0 0 ${w} ${h}"${labels?"":` width="${w}" height="${h}"`} role="img" aria-label="${aria}">${body}</svg>`;
}
function chartNames(labels, x, h){
  return labels ? labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${h-4}" text-anchor="middle" class="hb-name">${esc(l)}</text>`).join("") : "";
}
// Mood per sprint as a line, faces on the vertical scale; a sprint with no check-in leaves a gap.
// pts: one mood (2-5, may be fractional for a team average) or null per sprint; names label the dots.
// labels (one per sprint) puts the sprints along the bottom.
function moodLineSVG(pts, names, {w=190, h=100, labels=null}={}){
  if(!pts.some(Boolean)) return `<span class="muted">No check-ins yet</span>`;
  const left=26, right=8, top=10, bot=labels?26:10, n=pts.length;
  const x=chartCols(n, left, w-right, !!labels), y=v=>top+(5-v)*(h-top-bot)/3;
  let path="", pen=false;
  pts.forEach((v,i)=>{ if(!v){ pen=false; return; } path+=`${pen?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen=true; });
  const faces=MOODS.filter(m=>!m.retired).map(m=>`<text x="0" y="${y(m.v)+5}" class="rs-face">${m.e}</text>
    <line x1="${left}" y1="${y(m.v)}" x2="${w-right}" y2="${y(m.v)}" class="rs-grid"/>`).join("");
  const dots=pts.map((v,i)=>v?`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${h<80?3:4}" class="rs-dot"><title>${esc(names[i])}: ${esc(moodOf(Math.round(v)).l)}</title></circle>`:"").join("");
  return sprintChartSVG(w, h, labels, "Mood by sprint", `${faces}<path d="${path}" class="rs-line"/>${dots}${chartNames(labels, x, h)}`);
}
// Hours per sprint as bars on the same columns as the mood line, a dashed tick at each sprint's
// target; finished sprints are green (met) or red (short), the running sprint is grey. With
// labels, each bar also shows its hours on top.
function hoursBarsSVG(sps, hours, {w=190, h=70, labels=null}={}){
  if(!sps.length) return "";
  const left=26, right=8, top=labels?20:8, bot=labels?26:4, n=sps.length, targets=sps.map(targetOf);
  const max=Math.max(...hours, ...targets, 1), fmt=v=>String(Math.round(v*10)/10);
  const x=chartCols(n, left, w-right, !!labels), y=v=>top+(1-v/max)*(h-top-bot);
  const bw=labels ? Math.min(40, (w-left-right)/n*.55) : Math.max(4, Math.min(16, n===1 ? 16 : (w-left-right)/(n-1)*.6));
  const bars=sps.map((sp,i)=>{ const v=hours[i], t=targets[i], cls=!isPast(sp)?"run":v>=t?"ok":"low", cx=x(i);
    return `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="2" class="hb-${cls}">
      <title>${esc(sp.name||("Sprint "+sp.n))}: ${fmt(v)} of ${fmt(t)} h${isPast(sp)?"":" (in progress)"}</title></rect>
      <line x1="${(cx-bw/2-2).toFixed(1)}" y1="${y(t).toFixed(1)}" x2="${(cx+bw/2+2).toFixed(1)}" y2="${y(t).toFixed(1)}" class="hb-target"/>
      ${labels?`<text x="${cx.toFixed(1)}" y="${(Math.min(y(v),y(t))-5).toFixed(1)}" text-anchor="middle" class="hb-val">${fmt(v)}</text>`:""}`; }).join("");
  return sprintChartSVG(w, h, labels, "Hours by sprint", `<text x="0" y="${top+4}" class="hb-axis">${fmt(max)}h</text><text x="0" y="${y(0)}" class="hb-axis">0</text>
    <line x1="${left}" y1="${y(0)}" x2="${w-right}" y2="${y(0)}" class="rs-grid"/>${bars}${chartNames(labels, x, h)}`);
}
/* Sprints | Summary switch at the top of the Retrospectives page and the Course overview.

function viewMode(page){ return VIEW_MODE[page]==="summary" ? "summary" : "sprints"; }

function retroHistoryHTML(tid){

      <span class="rg-gn"><b>${g.done}</b>/${g.total-dr} done</span>
      <span class="rg-gbar">${seg(g.done,"done")}${seg(g.partial,"partial")}${seg(ca,"carried")}${seg(dr,"dropped")}${seg(g.notdone,"notdone")}${seg(open,"open")}</span></div>`); }).join("");
  const hours=rows.map((r,i)=>{ const t=targets[i], h=Math.round((r.hours||0)*10)/10;

  const mood=rows.map((r,i)=>{ const m=r.retro&&moodOf(chartMood(r.retro.mood));

  const key=(c,l)=>`<span><i class="rg-key ${c}"></i>${esc(l)}</span>`;

    ${label("Mood",MOODS.filter(m=>!m.retired).reverse().map(m=>`<span><i class="rg-emo" aria-hidden="true">${m.e}</i>${esc(m.l)}</span>`).join(""))}${mood}${sm.mood}

/* ---------- sprint countdown (student) ----------
   Days left in the current sprint, with what's still to do. Neutral until the last
   URGENT_DAYS days, then amber; the grace day gets its own "last day" banner. The
   retrospective only joins the to-do list once the deadline is close. */
const URGENT_DAYS=2;
function daysLeft(sp){ return Math.round((new Date(sp.end+"T00:00:00Z")-new Date(TODAY+"T00:00:00Z"))/86400000); }
function daysLeftLabel(sp){ const n=daysLeft(sp); return n<=0 ? "Ends today" : n===1 ? "1 day left" : `${n} days left`; }
// x: {hours, goals, submitted} for this student in sprint sp
function countdownBannerHTML(sp, x){
  const ph=sprintPhase(sp);
  if(!sp || !sp.end || !x || x.submitted || (ph!=="current" && ph!=="grace")) return "";
  const grace=ph==="grace", urgent=grace || daysLeft(sp)<=URGENT_DAYS, target=targetOf(sp);
  const todo=[];
  if(!x.goals) todo.push("add your main sprint goal");
  if(x.hours<target){ const more=Math.round((target-x.hours)*10)/10; todo.push(`log ${more} more hour${more===1?"":"s"} to reach ${target}`); }
  if(urgent) todo.push("submit your retrospective");
  const name=esc(sp.name||("Sprint "+sp.n)), ends=`${esc(dowOf(sp.end))} ${esc(fmtD(sp.end))}`;
  const head=grace ? `<b>${name} · last day to submit</b> — it ended ${ends}`
                   : `<b>${name} · ${esc(daysLeftLabel(sp))}</b>${daysLeft(sp)>0?` — ends ${ends}`:""}`;
  return `<div class="countdown${urgent?" urgent":""}"><span class="cd-days">${grace?"!":Math.max(daysLeft(sp),0)}</span>
    <span>${head}${todo.length?`<br><span class="cd-todo">Still to do: ${todo.join(" · ")}</span>`:""}</span></div>`;
}
// Dashboard: banners for the grace-day sprint (if any) and the current one, from SPRINT_STATS.
function dashboardCountdownHTML(t){
  const stats=SPRINT_STATS[t.id]; if(!stats) return "";
  return SPRINTS.filter(sp=>["grace","current"].includes(sprintPhase(sp)))
    .map(sp=>{ const x=stats[sp.id]; return countdownBannerHTML(sp, x && {...x, goals:x.mine}); }).join("");
}
function sprintGridHTML(t){
  if(!SPRINTS.length) return `<p class="muted">Your instructor hasn't started a sprint yet.</p>`;
  const stats=SPRINT_STATS[t.id]||{}, cbd=(t.act&&t.act.ok&&t.act.commits_by_day)||null;
  return `<div class="sprint-grid">${[...SPRINTS].reverse().map(sp=>{
    const x=stats[sp.id], start=sp.start||"", end=sp.end||"", ph=sprintPhase(sp);
    const st=(x&&x.status)||"unrated", cur=ph==="current";
    const commits=cbd?Object.values(sliceCbd(cbd,start,end)).reduce((a,b)=>a+b,0):null;
    // A bar across the top in the rating's colour carries the sprint name and status.
    // The open sprint (current, or on its last day) gets a solid badge bottom-left, and its
    // countdown sits on the dates line.
    const now=cur||ph==="grace", sub=x&&x.submitted;
    const note=!now ? "" : sub ? " · submitted" : ph==="grace" ? " · submit today" : sp.end ? " · "+daysLeftLabel(sp) : "";
    const phaseTag=now ? `<span class="sp-badge">${ph==="grace"?"Last day":"Current"}</span>`
