<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Peek</title>
<link rel="icon" type="image/png" sizes="512x512" href="./project-peek-favicon.png?v=5">
<link rel="apple-touch-icon" href="./project-peek-favicon.png?v=5">
<style>
  :root {
    /* Canonical school palette: use these brand tokens for future design work. */
    --brand-yellow:#ffdd00; --brand-gray-light:#dbdddf; --brand-gray:#3f4444;
    --brand-gray-dark:#222223; --brand-black:#000000; --brand-white:#ffffff;
    --ground:var(--brand-gray-light); --surface:var(--brand-white); --surface-2:rgba(219,221,223,.38);
    --ink:var(--brand-gray-dark); --ink-soft:var(--brand-gray); --ink-faint:rgba(63,68,68,.68);
    --line:var(--brand-gray-light); --line-soft:rgba(63,68,68,.14);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-gray); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.22);
    --healthy:#2f8f4e; --healthy-bg:rgba(47,143,78,.12);
    --watch:#b5720a;  --watch-bg:rgba(181,114,10,.13);
    --risk:#c8402f;   --risk-bg:rgba(200,64,47,.12);
    --noaccess:#6b7688; --noaccess-bg:rgba(107,118,136,.12);
    --unrated:#8b93a3; --unrated-bg:rgba(139,147,163,.10);
    --shadow:0 1px 2px rgba(20,28,45,.04), 0 4px 16px rgba(20,28,45,.06);
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:var(--brand-black); --surface:var(--brand-gray-dark); --surface-2:rgba(63,68,68,.62);
      --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
      --line:var(--brand-gray); --line-soft:rgba(219,221,223,.14);
      --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
      --accent-soft:rgba(255,221,0,.16);
      --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
      --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
      --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
      --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --ground:var(--brand-black); --surface:var(--brand-gray-dark); --surface-2:rgba(63,68,68,.62);
    --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
    --line:var(--brand-gray); --line-soft:rgba(219,221,223,.14);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.16);
    --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
    --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
    --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
    --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }
  :root[data-theme="dark"] input[type="date"],
  :root[data-theme="dark"] input[type="time"] { color-scheme:dark; background-color:var(--surface)!important; color:var(--ink)!important; }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,
  :root[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="date"],
    :root:not([data-theme="light"]) input[type="time"] { color-scheme:dark; background-color:var(--surface)!important; color:var(--ink)!important; }
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  }
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-fields-wrapper,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-hour-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-minute-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-ampm-field {
    background:transparent; color:var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-fields-wrapper,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-hour-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-minute-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-ampm-field {
      background:transparent; color:var(--ink);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display: none !important; }   /* ensure the hidden attribute wins over .app/.signin display rules */
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-sans);
    line-height:1.55; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent-ink); text-underline-offset:2px; }

  /* sign-in */
  .signin { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .signin .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:40px 36px; max-width:400px; text-align:center; }
  .signin .logo { font-family:var(--font-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; }
  .signin h1 { font-size:26px; font-weight:680; letter-spacing:-.02em; margin:8px 0 6px; }
  .signin p { color:var(--ink-soft); font-size:14px; margin:0 0 24px; }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent); color:var(--accent-contrast); font-weight:700; font-size:14.5px; padding:11px 20px; border-radius:10px; }
  .btn:hover { filter:brightness(.92); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--ink-faint); font-size:12px; }

  .app { display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh; }
  .side { position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line); padding:22px 16px;
    display:flex; flex-direction:column; }
  .brand { display:flex; flex-direction:column; gap:2px; padding:0 8px 14px; margin-bottom:6px;
    border-bottom:1px solid var(--line-soft); }
  .brand-title{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{ width:44px; height:auto; flex:0 0 44px; display:block; }
  .brand .code{ min-width:0; color:var(--ink); font-family:"Arial Rounded MT Bold","Trebuchet MS",var(--font-sans);
    font-size:23px; font-weight:900; line-height:1; letter-spacing:0; white-space:nowrap; }
  .brand .code .peek{ color:var(--brand-yellow); -webkit-text-stroke:.45px var(--brand-gray); text-shadow:0 1px 0 rgba(0,0,0,.18); }
  .brand .name { margin-left:54px; font-size:13px; font-weight:650; letter-spacing:0; color:var(--ink-soft); }
  .switcher { margin:12px 4px 4px; }
  .switcher select { width:100%; font-family:var(--font-sans); font-size:13.5px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .nav { display:flex; flex-direction:column; gap:1px; margin-top:8px; }
  .nav-label { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 8px 6px; }
  .nav button { all:unset; cursor:pointer; display:flex; align-items:center; gap:9px;
    padding:7px 8px; border-radius:7px; font-size:13.5px; color:var(--ink-soft); }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  .nav button.active { background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .nav .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nav .home { font-family:var(--font-mono); font-size:13px; }
  .nav .tname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot.healthy{background:var(--healthy);} .dot.watch{background:var(--watch);}
  .dot.risk{background:var(--risk);} .dot.noaccess{background:var(--noaccess);}
  .dot.unrated{background:var(--unrated);}

  .side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft); font-size:12px;
    color:var(--ink-soft); display:flex; flex-direction:column; gap:8px; }
  .side-foot .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-foot button { all:unset; cursor:pointer; color:var(--accent-ink); font-size:12.5px; }
  .side-foot button:hover { text-decoration:underline; }
  .preview-bar{ background:var(--watch-bg); border:1px solid var(--watch); color:var(--ink); border-radius:9px;
    padding:9px 12px; margin-bottom:18px; font-size:12.5px; }

  .main { padding:34px clamp(20px,4vw,56px) 80px; max-width:1040px; }
  .view { display:none; }
  .view.active { display:block; }
  .eyebrow { font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); }
  h1 { font-size:clamp(24px,3.4vw,33px); font-weight:680; letter-spacing:-.02em; margin:6px 0 0; text-wrap:balance; }
  h2 { font-size:13px; font-family:var(--font-mono); letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600; margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--line-soft); }
  .lede { color:var(--ink-soft); font-size:15px; max-width:64ch; margin:14px 0 0; }

  .tiles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:26px 0 30px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .tile.healthy::before{background:var(--healthy);} .tile.watch::before{background:var(--watch);}
  .tile.risk::before{background:var(--risk);} .tile.noaccess::before{background:var(--noaccess);}
  .tile.unrated::before{background:var(--unrated);}
  .tile .n { font-family:var(--font-mono); font-size:30px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .tile.healthy .n{color:var(--healthy);} .tile.watch .n{color:var(--watch);}
  .tile.risk .n{color:var(--risk);} .tile.noaccess .n{color:var(--noaccess);}
  .tile.unrated .n{color:var(--unrated);}
  .tile .l { font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); background:var(--surface); }
  .developer-head{ display:flex; align-items:end; justify-content:space-between; gap:18px; margin:28px 0 12px; }
  .developer-head h2{ margin:0; }
  .dashboard-filters{ display:flex; align-items:end; gap:10px; }
  .dashboard-filters label{ display:flex; flex-direction:column; gap:5px; color:var(--ink-faint); font-family:var(--font-mono);
    font-size:10px; text-transform:uppercase; }
  .dashboard-filters select{ min-width:150px; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:8px 30px 8px 10px; font:13px var(--font-sans); }
  .dashboard-filters select:focus{ outline:2px solid var(--accent); border-color:transparent; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; min-width:720px; }
  thead th { text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:600; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--surface-2); }
  tbody td { padding:12px 16px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--surface-2); }
  td .tm { font-weight:640; } td .pj { color:var(--ink-soft); }
  td.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); }

  .pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
    font-weight:600; letter-spacing:.04em; padding:3px 9px 3px 7px; border-radius:20px; white-space:nowrap; }
  .pill .d{ width:7px; height:7px; border-radius:50%; }
  .pill.healthy{color:var(--healthy); background:var(--healthy-bg);} .pill.healthy .d{background:var(--healthy);}
  .pill.watch{color:var(--watch); background:var(--watch-bg);} .pill.watch .d{background:var(--watch);}
  .pill.risk{color:var(--risk); background:var(--risk-bg);} .pill.risk .d{background:var(--risk);}
  .pill.noaccess{color:var(--noaccess); background:var(--noaccess-bg);} .pill.noaccess .d{background:var(--noaccess);}
  .pill.unrated{color:var(--unrated); background:var(--unrated-bg);} .pill.unrated .d{background:var(--unrated);}

  .thead { display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px 18px; }
  .thead .titles{ flex:1 1 320px; }
  .thead .project { font-family:var(--font-mono); color:var(--accent-ink); font-size:14px; margin-top:8px; }
  .members { color:var(--ink-soft); font-size:13.5px; margin-top:10px; }
  .members b{ color:var(--ink); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:7px; font-size:13px; text-decoration:none; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 12px; box-shadow:var(--shadow); }
  .chip:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .chip .ic{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); letter-spacing:.06em; }
  .chip.disabled{ opacity:.55; pointer-events:none; }

  /* sync reporting */
  .syncbar { display:flex; align-items:flex-start; gap:12px; margin:18px 0 0; padding:14px 16px;
    border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .syncbar.warn { border-color:var(--watch); background:var(--watch-bg); }
  .syncbar .ico { font-size:15px; line-height:1.4; }
  .syncbar .body { flex:1; min-width:0; }
  .syncbar h3 { margin:0 0 4px; font-size:13.5px; font-weight:600; }
  .syncbar ul { margin:6px 0 0; padding-left:18px; }
  .syncbar li { font-size:12.5px; color:var(--ink-soft); margin:3px 0; }
  .syncbar li b { color:var(--ink); font-weight:600; }
  .syncbar .dismiss { background:none; border:0; color:var(--ink-faint); cursor:pointer;
    font-size:16px; line-height:1; padding:2px 4px; }
  .side-foot .syncinfo { font-size:11px; color:var(--ink-faint); line-height:1.5; }
  .side-foot .syncinfo .warn { color:var(--watch); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px;
    box-shadow:var(--shadow); margin-top:22px; }
  .kv { display:grid; grid-template-columns:132px 1fr; gap:8px 18px; font-size:14px; }
  .kv dt{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding-top:2px; }
  .kv dd{ margin:0; color:var(--ink); } .kv dd.soft{ color:var(--ink-soft); }
  .flag { display:flex; gap:10px; margin-top:16px; padding:12px 14px; border-radius:10px;
    background:var(--watch-bg); font-size:13.5px; color:var(--ink); }
  .flag .ic{ color:var(--watch); font-weight:700; font-family:var(--font-mono); }

  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .metric { background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:13px 15px; }
  .metric .n{ font-family:var(--font-mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metric .l{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--font-mono); letter-spacing:.03em; }
  .chart{ margin:2px 0 20px; } .chart svg{ width:100%; height:auto; display:block; }
  .chart-cap{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
  .bar-rect{ fill:var(--accent); }
  .axis-base{ stroke:var(--line); stroke-width:1; }
  .today-line{ stroke:var(--watch); stroke-width:1; stroke-dasharray:2 3; opacity:.8; }
  .axis-label{ fill:var(--ink-faint); font-family:var(--font-mono); font-size:9px; }
  .spark{ display:inline-block; width:132px; height:26px; vertical-align:middle; } .spark svg{ width:132px; height:26px; } .spark .bar-rect{ opacity:.9; }
  .contribs { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .crow .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px; margin-bottom:5px; }
  .crow .who{ font-family:var(--font-mono); } .crow .who .note{ color:var(--ink-faint); font-family:var(--font-sans); font-size:12px; }
  .crow .cnt{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:12.5px; }
  .bar { height:7px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-ink)); border-radius:5px; }
  .obs { font-size:14px; color:var(--ink-soft); }
  .obj { font-size:14.5px; color:var(--ink); white-space:pre-wrap; margin:0; }
  .noaccess-box{ display:flex; gap:12px; align-items:flex-start; font-size:14px; color:var(--ink-soft); } .noaccess-box .ic{ font-size:20px; }
  .tlists{ display:flex; flex-wrap:wrap; gap:10px; }
  .tlist{ flex:1 1 120px; min-width:110px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:11px 13px; }
  .tlist .tn{ font-family:var(--font-mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tlist .tl{ font-size:12px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tsum{ font-size:13px; color:var(--ink-faint); font-family:var(--font-mono); margin-bottom:14px; }
  .tby{ font-size:13px; color:var(--ink-soft); margin:14px 0 4px; }
  .tby-lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-right:8px; }
  .trecent{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .trecent li{ display:grid; grid-template-columns:1.6fr 1.4fr auto; gap:12px; align-items:baseline;
    padding:8px 0; border-top:1px solid var(--line-soft); font-size:13px; }
  .trecent .rcard{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trecent .rmove{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); }
  .trecent .rby{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  @media (max-width:860px){ .trecent li{ grid-template-columns:1fr; gap:2px; } }
  @media (max-width:640px){ .developer-head{ align-items:stretch; flex-direction:column; } .dashboard-filters{ align-items:stretch; flex-direction:column; }
    .dashboard-filters select{ width:100%; } }
  .notes-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .saved{ font-family:var(--font-mono); font-size:11px; color:var(--healthy); opacity:0; transition:opacity .3s; }
  .saved.show{ opacity:1; }
  label.nlbl{ display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin:14px 0 6px; }
  label.nlbl span[title], .kv dt span[title]{ cursor:help; text-decoration:underline dotted; text-underline-offset:3px; }
  .structured-card .notes-head{ margin-bottom:4px; }
  .structured-card .summary-section{ padding:20px 0; }
  .structured-card .summary-section + .summary-section{ border-top:1px solid var(--line); }
  .structured-card .summary-heading{ margin:0 0 11px; color:var(--ink); font-family:var(--font-sans);
    font-size:15px; font-weight:700; letter-spacing:0; text-transform:none; }
  .structured-card .summary-heading span[title]{ text-decoration-color:var(--ink-faint); }
  .structured-card .summary-section:last-child{ padding-bottom:2px; }

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, collectionGroup, query, where, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getFunctions, httpsCallable }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzGJ8x1-Pk9_hil_ebkxmmuKZ9e5QAB6U",
  // Auth runs on firebaseapp.com. Open the app at https://project-peek.firebaseapp.com
  // so the app and the auth handler share one origin (no cross-domain cookie loop).
  authDomain: "project-peek.firebaseapp.com",
  projectId: "project-peek",
  storageBucket: "project-peek.firebasestorage.app",
  messagingSenderId: "876068621064",
  appId: "1:876068621064:web:ba627ae61bc37ec7737abd",
  measurementId: "G-KFFN4R1GM4"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app);

const STATUS_LABEL = { healthy:"On Track", watch:"Slightly Behind", risk:"Off Track", noaccess:"No Progress Demonstrated", unrated:"Pending" };
const STATUS_ORDER = ["unrated","noaccess","risk","watch","healthy"];
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function L(){   // course-level collective labels ("teams" only when the whole course is team)
  const team = ((COURSE && COURSE.type) || "team") === "team";
  return { team, unit: team?"team":"project", Unit: team?"Team":"Project",
    units: team?"teams":"projects", Units: team?"Teams":"Projects" };
}
function Lt(t){  // per-entry labels: each project can be team or solo
  const solo = (t.type || ((COURSE && COURSE.type === "solo") ? "solo" : "team")) === "solo";
  return { solo, who: solo ? "Student" : "Members" };
}

let UID=null, OWNER_UID=null, USER_EMAIL="", IS_ADMIN=false, PREVIEW_STUDENT=false;
let COURSES=[], COURSE=null, TEAMS=[], ASSIGNED_TEAMS=[], NOTES={}, RANGE=[null,null], ALLDAYS=[];
let SPRINTS=[], SPRINT=null, ENTRIES={}, GOALS={}, TIME_ENTRIES={}, UNLOCKED=false, DASH_STATUS_FILTER="all";
let LAST_SYNC=null, SYNC_REPORT=null, SYNC_SCHEDULE={};
const TODAY = new Date().toISOString().slice(0,10);
function instructorView(){ return IS_ADMIN && !PREVIEW_STUDENT; }
function studentView(){ return !IS_ADMIN || PREVIEW_STUDENT; }

/* ---------- auth ---------- */
const $ = id => document.getElementById(id);
const ALLOWED_DOMAIN = "neumont.edu";
function googleProvider(){
  const p = new GoogleAuthProvider();
  // prompt: always show the account chooser; hd: hint the Neumont Google Workspace.
  p.setCustomParameters({ prompt: "select_account", hd: ALLOWED_DOMAIN });
  return p;
}
async function doSignIn(){
  // Popup auth returns the credential directly to the origin that started sign-in,
  // so it works on production, preview-channel, and local Hosting domains.
  $("signinErr").textContent = "";
  try {
    await signInWithPopup(auth, googleProvider());
  } catch (e) {
    console.error("sign-in failed:", e.code, e.message);
    $("signinErr").textContent = e.code + " — " + e.message;
  }
}
$("signInBtn").onclick = doSignIn;
$("signOutBtn").onclick = () => signOut(auth);
getRedirectResult(auth).catch(e => { console.error("redirect result:", e); $("signinErr").textContent = e.code + " — " + e.message; });

onAuthStateChanged(auth, async user => {
  console.log("auth state:", user ? user.uid : "(signed out)");
  if (!user) { $("app").hidden = true; $("signin").hidden = false; return; }

  // Enforce the @neumont.edu domain (rules enforce it too; this is the friendly gate).
  const email = (user.email || "").toLowerCase();
  if (!user.emailVerified || !email.endsWith("@" + ALLOWED_DOMAIN)) {
    await signOut(auth);
    $("app").hidden = true; $("signin").hidden = false;
    $("signinErr").textContent = "Please sign in with your @" + ALLOWED_DOMAIN + " account.";
    return;
  }

  UID = user.uid; USER_EMAIL = email; $("signin").hidden = true; $("app").hidden = false;
  $("who").textContent = user.email || user.uid;
  try { await loadWorkspace(); }
  catch (e) {
    console.error("loadWorkspace failed:", e);
    $("main").innerHTML = `<h1>Couldn't load data</h1><p class="lede">${(e.code||"")+" "+(e.message||e)}</p>`;
  }
});

/* ---------- sync reporting ---------- */
function fmtWhen(d){
  if(!d) return "";
  const now = new Date(), sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (sameDay) return "today " + time;
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (d.toDateString() === yest.toDateString()) return "yesterday " + time;
  return d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + time;
}
function applyModeChrome(){
  $("syncBtn").hidden = !instructorView();
  $("syncInfo").hidden = !instructorView();
  $("modeName").textContent = PREVIEW_STUDENT ? "Student preview" : (IS_ADMIN ? "Instructor" : "Student");
  if(IS_ADMIN){
    $("modeToggle").hidden=false;
    $("modeToggle").textContent=PREVIEW_STUDENT ? "Return to instructor" : "Preview as student";
  }
}
function renderSyncInfo(){
  const el = $("syncInfo"); if(!el) return;
  if(!LAST_SYNC){ el.textContent = "Never synced"; return; }
  const n = SYNC_REPORT && SYNC_REPORT.issues ? SYNC_REPORT.issues.length : 0;
  el.innerHTML = `Last sync ${esc(fmtWhen(LAST_SYNC))}` +
    (n ? `<br><span class="warn">⚠ ${n} need${n===1?"s":""} attention</span>` : "");
}
async function loadLastSync(){
  try{
    const snap = await getDoc(doc(db, `users/${UID}`));
    const userData = snap.exists() ? snap.data() : {};
    const ts = userData.lastSync;
    LAST_SYNC = ts && ts.toDate ? ts.toDate() : null;
    SYNC_SCHEDULE = userData.syncSchedule || {};
  }catch(e){ console.error("lastSync read failed:", e); LAST_SYNC = null; }
  renderSyncInfo();
}
// Banner on the dashboard listing exactly what did not sync cleanly.
function syncBannerHTML(){
  if(!SYNC_REPORT) return "";
  const iss = SYNC_REPORT.issues || [];
  if(!iss.length){
    return `<div class="syncbar"><span class="ico">✓</span><div class="body">
      <h3>Last sync completed cleanly</h3>
      <p class="muted">All ${SYNC_REPORT.teams} ${L().units} refreshed from GitHub and Trello.</p>
    </div><button class="dismiss" data-mact="sync-dismiss" title="Dismiss">×</button></div>`;
  }
  return `<div class="syncbar warn"><span class="ico">⚠</span><div class="body">
    <h3>${iss.length} of ${SYNC_REPORT.teams} did not sync cleanly</h3>
    <p class="muted">Their numbers below are the last good values, not fresh ones.</p>
    <ul>${iss.map(i=>{
      const parts=[];
      if(i.github!=="ok") parts.push("GitHub: "+esc(i.github));
      if(i.trello!=="ok" && i.trello!=="no board link") parts.push("Trello: "+esc(i.trello));
      return `<li><b>${esc(i.team)}</b> — ${parts.join(" · ")}${i.stale?" <i>(kept previous data)</i>":""}</li>`;
    }).join("")}</ul>
  </div><button class="dismiss" data-mact="sync-dismiss" title="Dismiss">×</button></div>`;
}

/* ---------- data ---------- */
async function loadWorkspace(){
  COURSES = [];
  const snap = await getDocs(collection(db, `users/${UID}/courses`));
  snap.forEach(d => COURSES.push({ id:d.id, ...d.data() }));
  IS_ADMIN = COURSES.length > 0;
  OWNER_UID = IS_ADMIN ? UID : null;
  ASSIGNED_TEAMS = [];
  if (!IS_ADMIN) {
    const assigned = await getDocs(query(collectionGroup(db, "teams"), where("studentEmails", "array-contains", USER_EMAIL)));
    assigned.forEach(d => ASSIGNED_TEAMS.push({ id:d.id, ...d.data() }));
    const seen = new Set();
    ASSIGNED_TEAMS.forEach(t => {
      const key = `${t.ownerUid}:${t.courseId}`;
      if (!t.ownerUid || !t.courseId || seen.has(key)) return;
      seen.add(key);
      COURSES.push({ id:t.courseId, ownerUid:t.ownerUid, code:t.courseCode||t.courseId,
        name:t.courseName||t.courseCode||t.courseId, type:t.courseType||"team" });
    });
  }
  COURSES.sort((a,b)=> (a.name||a.id).localeCompare(b.name||b.id));
  const sel = $("courseSel");
  sel.innerHTML = COURSES.map(c=>`<option value="${esc(c.id)}">${esc(c.code||c.id)}</option>`).join("");
  sel.onchange = () => loadCourse(sel.value);
  $("sprintSel").onchange = (e) => setSprint(e.target.value);
  $("modeToggle").hidden = !IS_ADMIN;
  applyModeChrome();
  if (IS_ADMIN) await loadLastSync();
  if (!COURSES.length){ renderNoCourses(); return; }
  const last = lastCourseId();
  await loadCourse(COURSES.some(c=>c.id===last) ? last : COURSES[0].id);
}

function courseKey(){ return "peek:course:" + UID; }
function lastCourseId(){ try { return localStorage.getItem(courseKey()); } catch(e){ return null; } }

async function loadCourse(cid){
  COURSE = COURSES.find(c=>c.id===cid) || COURSES[0];
  DASH_STATUS_FILTER="all";
  OWNER_UID = IS_ADMIN ? UID : COURSE.ownerUid;
  $("courseSel").value = COURSE.id;
  try { localStorage.setItem(courseKey(), COURSE.id); } catch(e){}
  TEAMS = []; NOTES = {};
  if (IS_ADMIN) {
    const tSnap = await getDocs(collection(db, `users/${OWNER_UID}/courses/${cid}/teams`));
    tSnap.forEach(d => TEAMS.push({ id:d.id, ...d.data() }));
    const nSnap = await getDocs(collection(db, `users/${OWNER_UID}/courses/${cid}/notes`));
    nSnap.forEach(d => NOTES[d.id] = d.data());
  } else {
    TEAMS = ASSIGNED_TEAMS.filter(t => t.ownerUid===OWNER_UID && t.courseId===cid);
  }
  await loadSprints();
  computeRange();
  renderNav();
  render();
  renderSyncInfo();
  show(location.hash.slice(1) || "dashboard");
}

/* ---------- sprints ----------
   A sprint is a course-level cadence: every team is on Sprint N together. Each team's
   window inside that sprint can differ, because they're reviewed on different weekdays,
   so an entry may override the sprint's start/end. Per-sprint activity is DERIVED by
   slicing act.commits_by_day (which the sync stores as full history) — nothing extra is
   collected, and a sprint added after the fact still gets a correct chart. */
function cpath(){ return `users/${OWNER_UID}/courses/${COURSE.id}`; }
function sprintKey(){ return "peek:sprint:" + UID + ":" + (COURSE ? COURSE.id : ""); }
function lastSprintId(){ try { return localStorage.getItem(sprintKey()); } catch(e){ return null; } }
function activeSprint(){ return SPRINTS.length ? SPRINTS[SPRINTS.length-1] : null; }
function isPast(sp){ const a=activeSprint(); return !!(sp && a && sp.id !== a.id); }
function frozen(){ return isPast(SPRINT) && !UNLOCKED; }
function entryOf(tid){ return ENTRIES[tid] || {}; }
function winOf(tid){ const e=entryOf(tid);
  return { start: e.start || (SPRINT&&SPRINT.start) || "", end: e.end || (SPRINT&&SPRINT.end) || "" }; }
function statusOf(t){ const e=ENTRIES[t.id]; return (e && e.status) || t.status || "unrated"; }
function sliceCbd(cbd,start,end){ const o={};
  Object.keys(cbd||{}).forEach(d=>{ if((!start||d>=start)&&(!end||d<=end)) o[d]=cbd[d]; }); return o; }
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(iso){ if(!iso) return ""; const p=String(iso).split("-");
  return p.length===3 ? `${MONS[+p[1]-1]} ${+p[2]}` : String(iso); }
function winLabel(tid){ const w=winOf(tid); return w.start&&w.end ? `${fmtD(w.start)} – ${fmtD(w.end)}` : ""; }
function nextDay(iso){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }
// Nearest date to `target` falling on the same weekday as `ref` — keeps each team's
// review day when a new sprint rolls over.
function alignWeekday(target, ref){
  if(!target || !ref) return target || "";
  const t=new Date(target+"T00:00:00Z"), r=new Date(ref+"T00:00:00Z");
  if(isNaN(t)||isNaN(r)) return target;
  let diff=(r.getUTCDay()-t.getUTCDay()+7)%7; if(diff>3) diff-=7;
  t.setUTCDate(t.getUTCDate()+diff); return t.toISOString().slice(0,10);
}

// A team's activity restricted to its window in the selected sprint. Same shape as
// `act`, so every card that renders activity keeps working unchanged.
function sprintAct(t){
  const a = t.act || {ok:false, obs:"No data."};
  if (!SPRINT || !a.ok) return a;
  const w=winOf(t.id), cbd=sliceCbd(a.commits_by_day, w.start, w.end), days=Object.keys(cbd).sort();
  const total=days.reduce((n,d)=>n+cbd[d],0);
  let contribs=a.contribs||[], allTime=true;
  const bda=a.by_day_author;
  if (bda){
    const c={};
    days.forEach(d=>{ const m=bda[d]||{}; Object.keys(m).forEach(n=>c[n]=(c[n]||0)+m[n]); });
    contribs=Object.keys(c).sort((x,y)=>c[y]-c[x]).map(n=>({ n, c:c[n],
      p: total ? Math.round(100*c[n]/total) : 0,
      note: ((a.contribs||[]).find(z=>z.n===n)||{}).note || "" }));
    allTime=false;
  }
  return { ...a, ok:true, total, days:days.length, commits_by_day:cbd, contribs, contribs_all_time:allTime,
    first: days[0]||"", last: days[days.length-1]||"",
    last_fmt: days.length ? fmtD(days[days.length-1]) : "—",
    span: days.length ? `${fmtD(days[0])} – ${fmtD(days[days.length-1])}` : "no commits in window" };
}

async function loadSprints(){
  SPRINTS=[];
  const snap = await getDocs(collection(db, `${cpath()}/sprints`));
  snap.forEach(d => SPRINTS.push({ id:d.id, ...d.data() }));
  SPRINTS.sort((a,b)=>(a.n||0)-(b.n||0));
  const want = lastSprintId();
  SPRINT = SPRINTS.find(sp=>sp.id===want) || activeSprint();
  UNLOCKED = false;
  renderSprintSel();
  await loadEntries();
}
async function loadEntries(){
  ENTRIES={}; GOALS={}; TIME_ENTRIES={};
  if(!SPRINT) return;
  if(IS_ADMIN){
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${SPRINT.id}/entries`));
    snap.forEach(d => ENTRIES[d.id] = d.data());
  }else{
    await Promise.all(TEAMS.map(async t=>{
      const snap=await getDoc(doc(db,`${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`));
      if(snap.exists()) ENTRIES[t.id]=snap.data();
    }));
  }
  await Promise.all(TEAMS.map(async t => {
    const base = `${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`;
    const [goals, time] = await Promise.all([
      getDocs(collection(db, `${base}/goals`)),
      getDocs(collection(db, `${base}/time`))
    ]);
    GOALS[t.id] = goals.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    TIME_ENTRIES[t.id] = time.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  }));
}
function renderSprintSel(){
  const sel=$("sprintSel");
  if(!SPRINTS.length){ sel.innerHTML=`<option>No sprints yet</option>`; sel.disabled=true; return; }
  sel.disabled=false;
  sel.innerHTML = [...SPRINTS].reverse().map(sp=>{
    const tag = isPast(sp) ? " (past)" : " (current)";
    return `<option value="${esc(sp.id)}">${esc(sp.name||("Sprint "+sp.n))}${tag}</option>`;
  }).join("");
  if(SPRINT) sel.value = SPRINT.id;
}
async function setSprint(sid){
  SPRINT = SPRINTS.find(sp=>sp.id===sid) || activeSprint();
  UNLOCKED = false;
  if(SPRINT){ try { localStorage.setItem(sprintKey(), SPRINT.id); } catch(e){} }
  renderSprintSel();
  await loadEntries();
  renderNav(); render();
  show(location.hash.slice(1) || "dashboard");
}

/* ---------- charts ---------- */
function computeRange(){
  let min=null,max=null;
  TEAMS.forEach(t=>{ const cbd=(t.act&&t.act.commits_by_day)||{};
    Object.keys(cbd).forEach(d=>{ if(!min||d<min)min=d; if(!max||d>max)max=d; }); });
  if(!max||TODAY>max) max=TODAY;
  RANGE=[min,max]; ALLDAYS=eachDay(min,max);
}
function eachDay(min,max){ const out=[]; if(!min) return out;
  let d=new Date(min+"T00:00:00Z"); const end=new Date(max+"T00:00:00Z"); let g=0;
  while(d<=end && g<400){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); g++; } return out; }
function chartSVG(cbd,{spark=false,band=null}={}){
  if(!ALLDAYS.length) return "";
  const w=spark?132:680,h=spark?26:96,padX=spark?1:10,padTop=spark?2:8,padBot=spark?2:16;
  const innerW=w-padX*2,innerH=h-padTop-padBot,n=ALLDAYS.length,bw=innerW/n;
  const vals=ALLDAYS.map(d=>cbd[d]||0),maxV=Math.max(1,...vals),baseY=h-padBot;
  let bars="";
  ALLDAYS.forEach((d,i)=>{ const v=cbd[d]||0; if(!v)return;
    const bh=Math.max(spark?1.5:2, v/maxV*innerH), x=padX+i*bw+bw*0.16, y=baseY-bh;
    bars+=`<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="1">`+
          (spark?"":`<title>${d}: ${v} commit${v==1?"":"s"}</title>`)+`</rect>`; });
  let extra="";
  if(!spark && band && band[0] && band[1]){
    const i0=ALLDAYS.findIndex(d=>d>=band[0]);
    let i1=-1; for(let i=ALLDAYS.length-1;i>=0;i--){ if(ALLDAYS[i]<=band[1]){ i1=i; break; } }
    if(i0>=0 && i1>=i0)
      extra+=`<rect class="band" x="${(padX+i0*bw).toFixed(1)}" y="${padTop}" width="${((i1-i0+1)*bw).toFixed(1)}" height="${(baseY-padTop).toFixed(1)}"/>`;
  }
  if(!spark){ const ti=ALLDAYS.indexOf(TODAY), tx=ti>=0?padX+ti*bw+bw*0.5:padX+innerW;
    extra+=`<line class="axis-base" x1="${padX}" y1="${baseY+0.5}" x2="${padX+innerW}" y2="${baseY+0.5}"/>`;
    extra+=`<line class="today-line" x1="${tx.toFixed(1)}" y1="${padTop}" x2="${tx.toFixed(1)}" y2="${baseY}"/>`;
    extra+=`<text class="axis-label" x="${padX}" y="${h-4}">${ALLDAYS[0]}</text>`;
    extra+=`<text class="axis-label" x="${padX+innerW}" y="${h-4}" text-anchor="end">${ALLDAYS[ALLDAYS.length-1]}</text>`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="commits per day">${extra}${bars}</svg>`;
}
function peak(cbd){ return Math.max(0, ...Object.values(cbd||{})); }
function rateStats(cbd){
  const days = Object.keys(cbd||{}).sort(); if (!days.length) return null;
  const total = Object.values(cbd).reduce((a,b)=>a+b,0);
  const first = new Date(days[0]+"T00:00:00Z"), last = new Date(days[days.length-1]+"T00:00:00Z");
  const spanDays = Math.max(1, Math.round((last-first)/86400000) + 1);
  const perWeek = Math.round(total / (spanDays/7) * 10) / 10;
  const cutoff = new Date(Date.now() - 14*86400000).toISOString().slice(0,10);
  const last14 = days.filter(d=>d>=cutoff).reduce((s,d)=>s+cbd[d],0);
  return { perWeek, last14, spanDays };
}

// Sprint-entry fields autosave to sprints/{sid}/entries/{tid}. Status is mirrored onto the
// team doc when the current sprint is the one being edited, so the daily collector and the
// generated .docx keep agreeing with what the app shows.
function wireSprintFields(){
  document.querySelectorAll("[data-sp]").forEach(el=>{
    const [tid, field] = el.dataset.sp.split(":");
    const commit = async () => {
      if(!SPRINT) return;
      const val = el.value;
      ENTRIES[tid] = { ...(ENTRIES[tid]||{}), [field]: val };
      try{
        await setDoc(doc(db, `${cpath()}/sprints/${SPRINT.id}/entries/${tid}`),
          { [field]: val, updatedAt: serverTimestamp() }, { merge:true });
        if(field==="status" && !isPast(SPRINT))
          await setDoc(doc(db, `${cpath()}/teams/${tid}`), { status: val }, { merge:true });
        if(field==="status"){
          const t=TEAMS.find(x=>x.id===tid); if(t && !isPast(SPRINT)) t.status=val;
          // Status shows in the nav dot, the dashboard tiles and the table, so redraw
          // everything rather than leaving those stale until the next load.
          renderNav(); render(); show(location.hash.slice(1)||"dashboard");
        }
        flash("saved-"+tid);
      }catch(e){ console.error(e); }
    };
    if(el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && el.type!=="date")){
      let tmr; el.addEventListener("input", ()=>{ clearTimeout(tmr); tmr=setTimeout(commit,600); });
    } else {
      el.addEventListener("change", commit);   // dates and the status select save immediately
    }
  });
}

function wireScheduleDays(){
  const box=$("schedule_days"), label=$("schedule_days_label"); if(!box||!label) return;
  const names={"0":"Sun","1":"Mon","2":"Tue","3":"Wed","4":"Thu","5":"Fri","6":"Sat"};
  box.querySelectorAll("input").forEach(input=>input.addEventListener("change",()=>{
    const daily=box.querySelector('input[value="daily"]');
    if(input.value==="daily"&&input.checked) box.querySelectorAll('input:not([value="daily"])').forEach(x=>x.checked=false);
    else if(input.checked) daily.checked=false;
    const selected=[...box.querySelectorAll("input:checked")].map(x=>x.value);
    label.textContent=selected.includes("daily")?"Every day":selected.map(x=>names[x]).join(", ")||"Choose days";
  }));
}

async function onMainClick(e){
  const g = e.target.closest("[data-goto]"); if (g) { show(g.dataset.goto); return; }
  const addList=e.target.closest("[data-list-add]"); if(addList){ const [tid,field]=addList.dataset.listAdd.split(":"); await addProjectListItem(tid,field); return; }
  const removeList=e.target.closest("[data-list-remove]"); if(removeList){ const [tid,field,index]=removeList.dataset.listRemove.split(":"); await removeProjectListItem(tid,field,index); return; }
  const addGoalBtn=e.target.closest("[data-goal-add]"); if(addGoalBtn){ await addGoal(addGoalBtn.dataset.goalAdd); return; }
  const removeGoalBtn=e.target.closest("[data-goal-remove]"); if(removeGoalBtn){ const [tid,gid]=removeGoalBtn.dataset.goalRemove.split(":"); await removeGoal(tid,gid); return; }
  const goalCheck=e.target.closest("[data-goal-check]"); if(goalCheck){ const [tid,gid]=goalCheck.dataset.goalCheck.split(":"); await toggleGoal(tid,gid,goalCheck.checked); return; }
  const addTimeBtn=e.target.closest("[data-time-add]"); if(addTimeBtn){ await addTime(addTimeBtn.dataset.timeAdd); return; }
  const removeTimeBtn=e.target.closest("[data-time-remove]"); if(removeTimeBtn){ const [tid,timeId]=removeTimeBtn.dataset.timeRemove.split(":"); await removeTime(tid,timeId); return; }
  const m = e.target.closest("[data-mact]"); if (!m) return;
  const act = m.dataset.mact, tid = m.dataset.tid;
  // team actions
  if (act === "add")         openForm(null);
  else if (act === "edit")   openForm(TEAMS.find(t=>t.id===tid));
  else if (act === "cancel"){ const f=$("teamForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "sync-dismiss"){ SYNC_REPORT=null; render(); renderSyncInfo(); show("dashboard"); }
  else if (act === "save")   await saveTeam(tid);
  else if (act === "remove"){ if (confirm("Remove this team? Its collected activity is deleted too. This can't be undone.")) await removeTeam(tid); }
  // course actions
  // sprint actions
  else if (act === "schedule-save") await saveSchedule();
  else if (act === "sprint-add")    openSprintForm(null);
  else if (act === "sprint-edit")   openSprintForm(SPRINTS.find(sp=>sp.id===m.dataset.sid));
  else if (act === "sprint-cancel"){ const f=$("sprintForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "sprint-save")   await saveSprint(m.dataset.sid);
  else if (act === "sprint-seed")   await seedFirstSprint();
  else if (act === "sprint-unlock"){ UNLOCKED=true; render(); show(location.hash.slice(1)||"dashboard"); }
  else if (act === "sprint-remove"){
    if (confirm("Remove this sprint and every goal, role, status and review note recorded in it? This can't be undone."))
      await removeSprint(m.dataset.sid);
  }
  else if (act === "course-add")    openCourseForm(null);
  else if (act === "course-edit")   openCourseForm(COURSE);
  else if (act === "course-cancel"){ const f=$("courseForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "course-save")   await saveCourse(m.dataset.cid);
  else if (act === "course-remove"){
    if (confirm("Remove this ENTIRE course and all its teams, activity, and notes? This can't be undone.")) await removeCourse(m.dataset.cid);
  }
}

}
function parseStudentEmails(value){
  return [...new Set(String(value||"").split(/[;,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
}
function validStudentEmails(emails){ return emails.every(x=>/^[^@\s]+@neumont\.edu$/.test(x)); }
async function updateCourseStudentEmails(teams){
  const emails=[...new Set((teams||[]).flatMap(t=>t.studentEmails||[]))].sort();
  await setDoc(doc(db,cpath()), {studentEmails:emails}, {merge:true});
  if(COURSE) COURSE.studentEmails=emails;
}
async function saveTeam(tid){
  const studentEmails=parseStudentEmails(fval("f_student_emails"));
  const data = { team:fval("f_team"), project:fval("f_project"), members:fval("f_members"),
                 studentEmails, github:fval("f_github"), trello:fval("f_trello"), type:fval("f_type")||"team",
                 ownerUid:UID, courseId:COURSE.id, courseCode:COURSE.code||COURSE.id,
                 courseName:COURSE.name||COURSE.code||COURSE.id, courseType:COURSE.type||"team" };
  if (!data.team){ $("formErr").textContent = "Name is required."; return; }
  if (!validStudentEmails(studentEmails)){ $("formErr").textContent = "Use only valid @neumont.edu student email addresses."; return; }
  let id = tid, payload = { ...data };
  if (!id){ id = slugId(data.team); payload.prop={concept:"",features:"",tech:"",flag:""}; payload.sprint=null;
            payload.why=""; payload.notes=""; if(!payload.status) payload.status="unrated"; }
  try {
    await setDoc(doc(db, `users/${UID}/courses/${COURSE.id}/teams/${id}`), payload, { merge:true });
    const nextTeams=TEAMS.filter(x=>x.id!==id).concat([{...(TEAMS.find(x=>x.id===id)||{}),id,...payload}]);
    await updateCourseStudentEmails(nextTeams);
    if (!tid && SPRINT)   // a team added mid-course joins the sprint already running
      await setDoc(doc(db, `${cpath()}/sprints/${SPRINT.id}/entries/${id}`),
        { po:"", sm:"", devs:"", hours:"", start:SPRINT.start, end:SPRINT.end,
          status:"unrated", goal:"", review:"", updatedAt: serverTimestamp() }, { merge:true });
    await loadCourse(COURSE.id); show("manage");
  } catch(e){ console.error(e); const fe=$("formErr"); if(fe) fe.textContent = e.code+" — "+e.message; }
}
async function removeTeam(tid){
  try {
    await deleteDoc(doc(db, `users/${UID}/courses/${COURSE.id}/teams/${tid}`));
    await deleteDoc(doc(db, `users/${UID}/courses/${COURSE.id}/notes/${tid}`)).catch(()=>{});
    for (const sp of SPRINTS)
      await deleteDoc(doc(db, `${cpath()}/sprints/${sp.id}/entries/${tid}`)).catch(()=>{});
    await updateCourseStudentEmails(TEAMS.filter(t=>t.id!==tid));
    await loadCourse(COURSE.id); show("manage");
  } catch(e){ console.error(e); alert("Couldn't remove: " + (e.message||e)); }
}

/* ---------- sprint management ---------- */
async function saveSchedule(){
  const enabled=fval("schedule_enabled")==="true",
    weekdays=[...document.querySelectorAll("#schedule_days input:checked")].map(x=>x.value),
    time=fval("schedule_time"), timezone=fval("schedule_timezone");
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){ alert("Choose a valid sync time."); return; }
  if(!weekdays.length){ alert("Choose at least one sync day."); return; }
  try{
    const next={...SYNC_SCHEDULE,enabled,weekdays,time,timezone,updatedAt:serverTimestamp()};
    delete next.weekday;
    await setDoc(doc(db,`users/${UID}`),{syncSchedule:next},{merge:true});
    SYNC_SCHEDULE={...next,updatedAt:null};
    render(); show("manage");
  }catch(e){ console.error(e); alert("Couldn't save the schedule: "+(e.message||e)); }
}

function openSprintForm(sp){ const f=$("sprintForm"); if(!f) return;
  f.hidden=false; f.innerHTML=sprintFormHTML(sp||null); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }

async function saveSprint(sid){
  const name=fval("sp_name"), start=fval("sp_start"), end=fval("sp_end");
  const err=$("sprintErr");
  if(!start || !end){ if(err) err.textContent="Start and end dates are required."; return; }
  if(end < start){ if(err) err.textContent="End date must fall on or after the start date."; return; }
  try{
    if(sid){                                    // editing the current sprint's default window
      const cur = SPRINTS.find(x=>x.id===sid) || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}`), { name: name||cur.name||("Sprint "+(cur.n||"")), start, end }, { merge:true });
    } else {
      const prev = activeSprint();
      const n = SPRINTS.length ? Math.max(...SPRINTS.map(x=>x.n||0))+1 : 1;
      const nsid = "s"+n;
      await setDoc(doc(db, `${cpath()}/sprints/${nsid}`),
        { n, name: name||("Sprint "+n), start, end, createdAt: serverTimestamp() });
      // Carry roles forward and keep each team on its own review weekday.
      let prevEntries={};
      if(prev){
        const snap = await getDocs(collection(db, `${cpath()}/sprints/${prev.id}/entries`));
        snap.forEach(d=>prevEntries[d.id]=d.data());
      }
      for(const t of TEAMS){
        const pe = prevEntries[t.id] || {};
        await setDoc(doc(db, `${cpath()}/sprints/${nsid}/entries/${t.id}`), {
          po:pe.po||"", sm:pe.sm||"", devs:pe.devs||"", hours:pe.hours||"",
          start: pe.end ? nextDay(pe.end) : start,
          end:   pe.end ? alignWeekday(end, pe.end) : end,
          status: pe.status || t.status || "unrated",
          goal:"", review:"", updatedAt: serverTimestamp()
        });
      }
      try { localStorage.setItem(sprintKey(), nsid); } catch(e){}
    }
    const f=$("sprintForm"); if(f){ f.hidden=true; f.innerHTML=""; }
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); if(err) err.textContent = e.code+" — "+e.message; }
}

async function removeSprint(sid){
  try{
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${sid}/entries`));
    for(const d of snap.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(db, `${cpath()}/sprints/${sid}`));
    try { localStorage.removeItem(sprintKey()); } catch(e){}
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); alert("Couldn't remove sprint: " + (e.message||e)); }
}

// One-time fold of the pre-sprint fields (team goal, roles, status, review note) into Sprint 1
// so nothing already written is orphaned when the per-sprint record starts.
async function seedFirstSprint(){
  if(SPRINTS.length) return;
  let first="";
  TEAMS.forEach(t=>{ const days=Object.keys((t.act&&t.act.commits_by_day)||{}); days.sort();
    if(days.length && (!first || days[0]<first)) first=days[0]; });
  const start = first || TODAY, end = TODAY, sid="s1";
  try{
    await setDoc(doc(db, `${cpath()}/sprints/${sid}`),
      { n:1, name:"Sprint 1", start, end, createdAt: serverTimestamp() });
    for(const t of TEAMS){
      const sp = t.sprint || {}, nt = NOTES[t.id] || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}/entries/${t.id}`), {
        po:sp.po||"", sm:sp.sm||"", devs:sp.devs||"", hours:sp.hours||"",
        start, end, status: t.status||"unrated",
        goal: t.objectives || sp.goal || "", review: nt.review || "", updatedAt: serverTimestamp()
      });
    }
    try { localStorage.setItem(sprintKey(), sid); } catch(e){}
    await loadCourse(COURSE.id); show("dashboard");
  }catch(e){ console.error(e); alert("Couldn't create Sprint 1: " + (e.message||e)); }
}

/* ---------- course management ---------- */
function todayLabel(){
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d=new Date(); return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function courseId(code){
  let base = code.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "course";
  const ids = new Set(COURSES.map(c=>c.id)); let id=base, i=2;
  while (ids.has(id)){ id = base+"-"+i; i++; }
  return id;
}
function courseFormHTML(c){
  const v = c || { code:"", name:"", term:"", report_date: todayLabel(), type:"team" };
  const ty = v.type || "team";
  return `<div class="card"><h2>${c?"Edit course":"New course"}</h2>
    <div class="form">
      <label>Course code<input id="c_code" value="${esc(v.code)}" placeholder="e.g. BIT221"></label>
      <label>Course name<input id="c_name" value="${esc(v.name)}" placeholder="e.g. BIT221 – Data Structures"></label>
      <label>Default type<select id="c_type"><option value="team"${ty==="team"?" selected":""}>Team projects</option><option value="solo"${ty==="solo"?" selected":""}>Solo projects</option><option value="mixed"${ty==="mixed"?" selected":""}>Mixed</option></select></label>
      <label>Term<input id="c_term" value="${esc(v.term)}" placeholder="e.g. Fall 2026"></label>
      <label>Report date<input id="c_report" value="${esc(v.report_date)}" placeholder="e.g. ${todayLabel()}"></label>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn" data-mact="course-save"${c?` data-cid="${c.id}"`:""}>Save</button>
      <button class="btn secondary" data-mact="course-cancel">Cancel</button>
    </div>
    <p class="muted" id="courseErr" style="color:var(--risk);margin-top:12px"></p></div>`;
}
function openCourseForm(c){ const f=$("courseForm"); if(!f) return; f.hidden=false; f.innerHTML=courseFormHTML(c); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
async function saveCourse(cid){
  const code=fval("c_code"), name=fval("c_name"), term=fval("c_term"), report=fval("c_report"), type=fval("c_type")||"team";
  if(!code){ const ce=$("courseErr"); if(ce) ce.textContent="Course code is required."; return; }
  const id = cid || courseId(code);
  try {
    await setDoc(doc(db, `users/${UID}/courses/${id}`),
      { code, name: name || code, term, report_date: report || todayLabel(), type,
        studentEmails:(COURSE && COURSE.id===id && COURSE.studentEmails)||[] }, { merge:true });
    await loadWorkspace();    // refresh switcher
    await loadCourse(id);     // switch to the new/edited course
    show("manage");
  } catch(e){ console.error(e); const ce=$("courseErr"); if(ce) ce.textContent = e.code+" — "+e.message; }
}
async function removeCourse(cid){
  try {
    const spSnap = await getDocs(collection(db, `users/${UID}/courses/${cid}/sprints`));
    for (const sp of spSnap.docs){
      const eSnap = await getDocs(collection(sp.ref, "entries"));
      for (const e of eSnap.docs){ await deleteDoc(e.ref); }
      await deleteDoc(sp.ref);
    }
    for (const sub of ["teams","notes"]){
      const snap = await getDocs(collection(db, `users/${UID}/courses/${cid}/${sub}`));
      for (const d of snap.docs){ await deleteDoc(d.ref); }
    }
    await deleteDoc(doc(db, `users/${UID}/courses/${cid}`));
    await loadWorkspace();
    if (COURSES.length){ await loadCourse(COURSES[0].id); show("manage"); }
    else renderNoCourses();
  } catch(e){ console.error(e); alert("Couldn't remove course: " + (e.message||e)); }
}
function renderNoCourses(){
  $("nav").innerHTML=`<div class="nav-label">Overview</div>`; $("courseSel").innerHTML="";
  SPRINTS=[]; SPRINT=null; ENTRIES={}; renderSprintSel();
  $("main").innerHTML = IS_ADMIN
    ? `<span class="eyebrow">Getting started</span><h1>Create your first course</h1>
      <p class="lede">Add a course, then add its teams. The daily sync will fill in each team's commit and Trello activity.</p>
      <div style="margin:18px 0"><button class="btn" data-mact="course-add">+ New course</button></div><div id="courseForm" hidden></div>`
    : `<span class="eyebrow">Student mode</span><h1>No projects assigned</h1>
      <p class="lede">Ask your instructor to add ${esc(USER_EMAIL)} to the project's Student email(s) field.</p>`;
}

/* ---------- routing + theme ---------- */
function show(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  (document.getElementById("view-"+view)||document.getElementById("view-dashboard"))?.classList.add("active");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  window.scrollTo({top:0});
  if(location.hash.slice(1)!==view) history.replaceState(null,"","#"+view);
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"dashboard"));
$("nav").addEventListener("click", e=>{ const b=e.target.closest("button[data-view]"); if(b) show(b.dataset.view); });
$("main").addEventListener("click", onMainClick);   // delegated: team + course actions (works on all views)
const root=document.documentElement;
$("modeToggle").onclick=()=>{
  if(!IS_ADMIN) return;
  PREVIEW_STUDENT=!PREVIEW_STUDENT;
  applyModeChrome(); renderNav(); render(); show("dashboard");
};
$("themeBtn").onclick=()=>{ const cur=root.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark?"light":"dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("peek:theme", next); } catch(e){} };

$("syncBtn").onclick = async () => {
  const b=$("syncBtn"); if(b.disabled) return;
  const label="⟳ Sync now"; b.disabled=true; b.textContent="⟳ Syncing…";
  try{
    const res = await httpsCallable(functions, "sync_now", { timeout: 300000 })();
    const d = res.data || {};
    SYNC_REPORT = d;
    LAST_SYNC = d.syncedAt ? new Date(d.syncedAt) : new Date();
    const bad = (d.issues || []).length;
    // Reload so the table shows the new numbers, then surface the report.
    if (COURSE) await loadCourse(COURSE.id);
    renderSyncInfo();
    show("dashboard");
    b.textContent = bad ? `⚠ ${d.ok}/${d.teams} clean` : `✓ Synced ${d.teams}`;
    setTimeout(()=>{ b.textContent=label; b.disabled=false; }, 3000);
  }catch(e){
    console.error("sync_now failed:", e);
    SYNC_REPORT = null;
    const code = e.code || "", msg = e.message || String(e);
    let hint = "";
    if (/unauthenticated/i.test(code))        hint = "\n\nYour session expired — sign out and back in.";
    else if (/permission-denied/i.test(code)) hint = "\n\nSync requires a verified @neumont.edu account.";
    else if (/deadline-exceeded/i.test(code)) hint = "\n\nThe sync passed its 5-minute limit. Some teams may have updated; run it again.";
    else if (/not-found/i.test(code))         hint = "\n\nThe Cloud Function isn't deployed. Run: firebase deploy --only functions";
    else if (/internal/i.test(code))          hint = "\n\nThe function errored. Check: firebase functions:log --only sync_now";
    alert("Sync failed: " + (code ? code + " — " : "") + msg + hint);
    b.textContent=label; b.disabled=false;
  }
};
</script>
