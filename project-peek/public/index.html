// Hours, goals and rating for every sprint of one project. Reloaded whenever its
// home view is shown, so the panels reflect anything just logged on a sprint page.
async function loadSprintStats(tid){
  const out={};
  await Promise.all(SPRINTS.map(async sp=>{
    const base=`${cpath()}/sprints/${sp.id}/entries/${tid}`;
    const [e, goals, time, retro, seen]=await Promise.all([getDoc(doc(db,base)),
      getDocs(collection(db,`${base}/goals`)), getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/retro`)),
      IS_ADMIN ? null : getDoc(doc(db,`${base}/seen/${USER_EMAIL}`))]);
    const ed=e.exists()?e.data():{};
    const fbAt=feedbackMillis(ed);
    const seenAt=seen&&seen.exists()&&seen.data().at&&seen.data().at.toMillis ? seen.data().at.toMillis() : 0;
    const rs=retro.docs.map(d=>d.data()), mine=rs.find(r=>r.studentEmail===USER_EMAIL)||(IS_ADMIN?rs[0]:null);
    out[sp.id]={ status:ed.status||"unrated", newFeedback: !IS_ADMIN && fbAt>seenAt,
      submitted:!!mine, mood:mine?mine.mood:null,
      mine:goals.docs.filter(d=>d.data().studentEmail===USER_EMAIL).length,
      goals:goals.size, done:goals.docs.filter(d=>d.data().result==="done"||d.data().completed).length,
      hours:time.docs.reduce((n,d)=>n+(Number(d.data().hours)||0),0) };
  }));
  SPRINT_STATS[tid]=out;
  const t=TEAMS.find(x=>x.id===tid), el=$("sprint-grid-"+tid), cd=$("countdown-"+tid);
  if(t && el) el.innerHTML=sprintGridHTML(t);
  if(t && cd) cd.innerHTML=dashboardCountdownHTML(t);
  if(t && studentView()){ renderNav(); }   // sidebar dots for new feedback
}
/* "New feedback": the instructor's rating/review stamps entries/{tid}.feedbackAt; the
   student's entries/{tid}/seen/{email}.at records when they last opened that sprint.
   Opening a sprint with newer feedback marks it seen and clears the badge. */
// When the entry's feedback was given. Ratings/reviews saved before feedbackAt existed
// count as given at time 1, so they show as new until the student first opens the sprint.
function feedbackMillis(e){
  if(e.feedbackAt && e.feedbackAt.toMillis) return e.feedbackAt.toMillis();
  return (e.review || (e.status && e.status!=="unrated")) ? 1 : 0;
}
function hasNewFeedback(tid,sid){ return !!(((SPRINT_STATS[tid]||{})[sid]||{}).newFeedback); }
async function markFeedbackSeen(tid){
  if(IS_ADMIN || !SPRINT) return;
  if(!feedbackMillis(ENTRIES[tid]||{}) || ((SPRINT_STATS[tid]||{})[SPRINT.id]||{}).newFeedback===false) return;
  try{
    await setDoc(doc(db,`${sprintEntryPath(tid)}/seen/${USER_EMAIL}`), { at:serverTimestamp() });
    const x=(SPRINT_STATS[tid]||{})[SPRINT.id]; if(x) x.newFeedback=false;
    renderNav();
  }catch(e){ console.error("mark seen failed:", e); }
}
async function openSprint(tid,sid){
  history.replaceState(null,"","#"+tid+"__sprint");
  if(!SPRINT || SPRINT.id!==sid) await setSprint(sid);   // setSprint re-renders and shows the hash
  else show(tid+"__sprint");
}

// Sprint-entry fields autosave to sprints/{sid}/entries/{tid}. Status is mirrored onto the

function wireSprintFields(){
  document.querySelectorAll("[data-sp]").forEach(el=>{
    const [tid, field] = el.dataset.sp.split(":");
    const commit = async () => {
      if(!SPRINT) return;
      const val = el.value;
      ENTRIES[tid] = { ...(ENTRIES[tid]||{}), [field]: val };
      try{
        // A new rating or review is feedback the student hasn't seen yet.
        const fb = (field==="status" || field==="review") && val ? { feedbackAt: serverTimestamp() } : {};
        await setDoc(doc(db, `${cpath()}/sprints/${SPRINT.id}/entries/${tid}`),

   course.studentEmails is the enrollment list the instructor keeps; a team's
   studentEmails is the subset assigned to it. Membership is instructor-written,
   except that in a solo course a student creates their own one-person project. */
function roster(){ return (COURSE && COURSE.studentEmails) || []; }

async function saveRoster(emails){
  const next=[...new Set(emails)].sort();
  await setDoc(doc(db,cpath()), {studentEmails:next}, {merge:true});
  if(COURSE) COURSE.studentEmails=next;

/* One small doc per enrolled student (enrollments/{email}) carrying just the course
   label. Students can't read the course doc (it holds the whole roster), so this is
   how they find a course they're enrolled in before they have a project. Kept in step
   with course.studentEmails on every save and course load, so it self-heals. */
async function syncEnrollments(){
  if(!IS_ADMIN || !COURSE) return;
  const base=`${cpath()}/enrollments`;
  const want={courseId:COURSE.id, ownerUid:UID, courseCode:COURSE.code||COURSE.id,
    courseName:COURSE.name||COURSE.code||COURSE.id, courseType:COURSE.type||"team",
    // accounts students must share private repos/boards with (from the last sync)
    syncGithub:SYNC_ACCOUNTS.github||"", syncTrello:SYNC_ACCOUNTS.trello||""};
  const have={}; (await getDocs(collection(db,base))).forEach(d=>have[d.id]=d.data());
  const emails=new Set(roster()), ops=[];
  emails.forEach(em=>{
    const h=have[em];
    if(!h || Object.keys(want).some(k=>h[k]!==want[k]) || h.email!==em)
      ops.push(setDoc(doc(db,`${base}/${em}`), {...want, email:em}));
  });
  Object.keys(have).forEach(em=>{ if(!emails.has(em)) ops.push(deleteDoc(doc(db,`${base}/${em}`))); });
  await Promise.all(ops);
}

  try{
    if(sid){                                    // editing the current sprint's default window
      const cur = SPRINTS.find(x=>x.id===sid) || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}`), { name: name||cur.name||("Sprint "+(cur.n||"")), start, end, targetHours }, { merge:true });
    } else {
      const prev = lastSprint();
      const n = SPRINTS.length ? Math.max(...SPRINTS.map(x=>x.n||0))+1 : 1;
      const nsid = "s"+n;
      await setDoc(doc(db, `${cpath()}/sprints/${nsid}`),
        { n, name: name||("Sprint "+n), start, end, targetHours, createdAt: serverTimestamp() });
      // Carry roles forward.
      let prevEntries={};
      if(prev){
        const snap = await getDocs(collection(db, `${cpath()}/sprints/${prev.id}/entries`));
        snap.forEach(d=>prevEntries[d.id]=d.data());
      }
      for(const t of TEAMS){
        const pe = prevEntries[t.id] || {};
        await setDoc(doc(db, `${cpath()}/sprints/${nsid}/entries/${t.id}`), {
          po:pe.po||"", sm:pe.sm||"",
          status: pe.status || t.status || "unrated",
          goal:"", review:"", updatedAt: serverTimestamp()
        });
      }
      try { localStorage.setItem(sprintKey(), nsid); } catch(e){}
    }
    const f=$("sprintForm"); if(f){ f.hidden=true; f.innerHTML=""; }
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); if(err) err.textContent = e.code+" — "+e.message; }
}

async function removeSprint(sid){
  try{
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${sid}/entries`));
    for(const d of snap.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(db, `${cpath()}/sprints/${sid}`));
    try { localStorage.removeItem(sprintKey()); } catch(e){}
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); alert("Couldn't remove sprint: " + (e.message||e)); }
}

// One-time fold of the pre-sprint fields (team goal, roles, status, review note) into Sprint 1
// so nothing already written is orphaned when the per-sprint record starts.
async function seedFirstSprint(){
  if(SPRINTS.length) return;
  let first="";
  TEAMS.forEach(t=>{ const days=Object.keys((t.act&&t.act.commits_by_day)||{}); days.sort();
    if(days.length && (!first || days[0]<first)) first=days[0]; });
  const start = first || TODAY, end = TODAY, sid="s1";
  try{
    await setDoc(doc(db, `${cpath()}/sprints/${sid}`),
      { n:1, name:"Sprint 1", start, end, createdAt: serverTimestamp() });
    for(const t of TEAMS){
      const sp = t.sprint || {}, nt = NOTES[t.id] || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}/entries/${t.id}`), {
        po:sp.po||"", sm:sp.sm||"", devs:sp.devs||"", hours:sp.hours||"",
        start, end, status: t.status||"unrated",
        goal: t.objectives || sp.goal || "", review: nt.review || "", updatedAt: serverTimestamp()
      });
    }
    try { localStorage.setItem(sprintKey(), sid); } catch(e){}
    await loadCourse(COURSE.id); show("dashboard");
  }catch(e){ console.error(e); alert("Couldn't create Sprint 1: " + (e.message||e)); }
}

/* ---------- course management ---------- */
function todayLabel(){
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d=new Date(); return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function courseId(code){
  let base = code.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "course";
  const ids = new Set(COURSES.map(c=>c.id)); let id=base, i=2;
  while (ids.has(id)){ id = base+"-"+i; i++; }
  return id;
}
function courseFormHTML(c){
  const v = c || { code:"", name:"", term:"", report_date: todayLabel(), type:"team" };
  const ty = v.type || "team";
  return `<div class="card"><h2>${c?"Edit course":"New course"}</h2>
    <div class="form">
      <label>Course code<input id="c_code" value="${esc(v.code)}" placeholder="e.g. BIT221"></label>
      <label>Course name<input id="c_name" value="${esc(v.name)}" placeholder="e.g. BIT221 – Data Structures"></label>
      <label>Default type<select id="c_type"><option value="team"${ty==="team"?" selected":""}>Team projects</option><option value="solo"${ty==="solo"?" selected":""}>Solo projects</option><option value="mixed"${ty==="mixed"?" selected":""}>Mixed</option></select></label>
      <label>Term<input id="c_term" value="${esc(v.term)}" placeholder="e.g. Fall 2026"></label>
      <label>Report date<input id="c_report" value="${esc(v.report_date)}" placeholder="e.g. ${todayLabel()}"></label>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn" data-mact="course-save"${c?` data-cid="${c.id}"`:""}>Save</button>
      <button class="btn secondary" data-mact="course-cancel">Cancel</button>
    </div>
    <p class="muted err" id="courseErr"></p></div>`;
}
function openCourseForm(c){ const f=$("courseForm"); if(!f) return; f.hidden=false; f.innerHTML=courseFormHTML(c); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
async function saveCourse(cid){
  const code=fval("c_code"), name=fval("c_name"), term=fval("c_term"), report=fval("c_report"), type=fval("c_type")||"team";
  if(!code){ const ce=$("courseErr"); if(ce) ce.textContent="Course code is required."; return; }
  const id = cid || courseId(code);
  try {
    await setDoc(doc(db, `users/${UID}/courses/${id}`),
      { code, name: name || code, term, report_date: report || todayLabel(), type,
        studentEmails:(COURSE && COURSE.id===id && COURSE.studentEmails)||[] }, { merge:true });
    await loadWorkspace();    // refresh switcher
    await loadCourse(id);     // switch to the new/edited course
    show("manage");
  } catch(e){ console.error(e); const ce=$("courseErr"); if(ce) ce.textContent = e.code+" — "+e.message; }
}
async function removeCourse(cid){
  try {
    const spSnap = await getDocs(collection(db, `users/${UID}/courses/${cid}/sprints`));
    for (const sp of spSnap.docs){
      const eSnap = await getDocs(collection(sp.ref, "entries"));
      for (const e of eSnap.docs){ await deleteDoc(e.ref); }
      await deleteDoc(sp.ref);
    }
    for (const sub of ["teams","notes"]){
      const snap = await getDocs(collection(db, `users/${UID}/courses/${cid}/${sub}`));
      for (const d of snap.docs){ await deleteDoc(d.ref); }
    }
    await deleteDoc(doc(db, `users/${UID}/courses/${cid}`));
    await loadWorkspace();
    if (COURSES.length){ await loadCourse(COURSES[0].id); show("manage"); }
    else renderNoCourses();
  } catch(e){ console.error(e); alert("Couldn't remove course: " + (e.message||e)); }
}
function renderNoCourses(){
  $("nav").innerHTML=`<div class="nav-label">Overview</div>`; $("courseSel").innerHTML="";
  SPRINTS=[]; SPRINT=null; ENTRIES={}; renderSprintSel();
  $("main").innerHTML = IS_ADMIN
    ? `${accountRowHTML()}<span class="eyebrow">Getting started</span><h1>Create your first course</h1>
      <p class="lede">Add a course, then add its teams. The daily sync will fill in each team's commit and Trello activity.</p>
      <div style="margin:18px 0"><button class="btn" data-mact="course-add">+ New course</button></div><div id="courseForm" hidden></div>`
    : `${accountRowHTML()}<span class="eyebrow">Student mode</span><h1>No projects assigned</h1>
      <p class="lede">Ask your instructor to add ${esc(USER_EMAIL)} to the project's Student email(s) field.</p>`;
}

/* ---------- routing + theme ---------- */
// Re-show after an edit: keep the sub-view (sprint page, summary) the user was on.
function stay(tid){ const h=location.hash.slice(1); show(h.split("__")[0]===tid ? h : tid); }
function markNav(view){
  document.querySelectorAll(".icon-circle[data-summary]").forEach(b=>b.classList.toggle("on", view.endsWith("__summary")));
  const navView=studentView() ? view : view.split("__")[0];
  const onSprint=view.endsWith("__sprint") && SPRINT;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",
    b.dataset.sprintNav ? !!onSprint && b.dataset.sprintNav===`${view.split("__")[0]}:${SPRINT.id}`
      : b.dataset.view===navView && !b.dataset.course));
}
function show(view){
  // Students have no course dashboard; anything unknown lands on their first project.
  if(studentView() && TEAMS.length && !document.getElementById("view-"+view)) view=TEAMS[0].id;
  // Switching project (picker or link) rebuilds the student nav for that project.
  if(studentView() && $("projectSel").value!==view.split("__")[0] && TEAMS.some(t=>t.id===view.split("__")[0])){
    history.replaceState(null,"","#"+view); renderNav();
  }
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  (document.getElementById("view-"+view)||document.getElementById("view-dashboard"))?.classList.add("active");
  markNav(view);
  setPageTitle(view);
  if(view==="overview" && instructorView()) ensureOverview();
  if(studentView() && view.endsWith("__sprint")) markFeedbackSeen(view.split("__")[0]);
  if(studentView() && view.endsWith("__retros")) loadRetroHistory(view.split("__")[0]);
  if(studentView() && document.getElementById("sprint-grid-"+view))
    loadSprintStats(view).catch(e=>console.error("sprint stats:", e));
  window.scrollTo({top:0});
  if(location.hash.slice(1)!==view) history.replaceState(null,"","#"+view);
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"dashboard"));
$("nav").addEventListener("click", async e=>{
  const sn=e.target.closest("button[data-sprint-nav]");
  if(sn){ const [tid,sid]=sn.dataset.sprintNav.split(":"); await openSprint(tid,sid); return; }
  const b=e.target.closest("button[data-view]"); if(!b) return;
  if(b.dataset.course){ history.replaceState(null,"","#"+b.dataset.view); await loadCourse(b.dataset.course); return; }
  show(b.dataset.view); });
$("main").addEventListener("click", onMainClick);
$("projectSel").onchange = e => show(e.target.value);
function closeAccountMenus(){ document.querySelectorAll(".account.open").forEach(a=>{ a.classList.remove("open");
  a.querySelector("[data-account-toggle]")?.setAttribute("aria-expanded","false"); }); }
document.addEventListener("click", e=>{ if(!e.target.closest(".account")) closeAccountMenus(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeAccountMenus(); if(e.target.closest && e.target.closest(".time-edit")) cancelTimeEdit(); } });
$("main").addEventListener("keydown", e=>{   // Enter in an add field = click its Add button
  if(e.key!=="Enter" || e.target.tagName!=="INPUT") return;
  const btn=e.target.closest(".add-group, .entry-form")?.querySelector("[data-list-add],[data-goal-add],[data-time-add],[data-time-save]");
  if(btn){ e.preventDefault(); btn.click(); }
});
// Retrospective form: tick each section as it's filled in.
$("main").addEventListener("input", e=>{ const wf=e.target.closest(".wrap-form"); if(wf) markRetroSteps(wf.id.slice("wrap-form-".length)); });
$("main").addEventListener("change", async e=>{   // goal status dropdown (student during the sprint, instructor on review)
  const wf=e.target.closest(".wrap-form");
  if(wf){ if(e.target.matches('input[name^="res-"]')){ const box=$("drop-"+e.target.name.slice(4));
      if(box){ box.hidden=e.target.value!=="dropped"; if(!box.hidden) box.focus(); } }
    markRetroSteps(wf.id.slice("wrap-form-".length)); return; }
  if(e.target.matches("[data-ov-sort]")){ VIEW_MODE.ovSort=e.target.value; saveViewMode(); redrawViewMode("ov"); return; }
  const gr=e.target.closest("[data-grade]");
  if(gr){ try{ await saveGrade(gr.dataset.grade, gr.value); }catch(err){ console.error(err); alert("Couldn't save the score: "+(err.message||err)); } return; }
  const sel=e.target.closest("[data-goal-result]"); if(!sel) return;
  const [tid,gid]=sel.dataset.goalResult.split(":");
  try{ await setGoalResult(tid,gid,sel.value); }catch(err){ console.error(err); alert("Couldn't save: "+(err.message||err)); }
});   // delegated: team + course actions (works on all views)
const root=document.documentElement;
$("modeToggle").onclick=()=>{
  if(!IS_ADMIN) return;
  PREVIEW_STUDENT=!PREVIEW_STUDENT;
  applyModeChrome(); renderNav(); render(); show("dashboard");
};
$("themeBtn").onclick=()=>{ const cur=root.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark?"light":"dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("peek:theme", next); } catch(e){} };

$("syncBtn").onclick = async () => {
  const b=$("syncBtn"); if(b.disabled) return;
  const label="⟳ Sync now"; b.disabled=true; b.textContent="⟳ Syncing…"; SYNCING=true; refreshInstructorBar();
  try{
    const res = await httpsCallable(functions, "sync_now", { timeout: 300000 })();
    const d = res.data || {};
    SYNC_REPORT = d;
    if (d.githubToken) GH_TOKEN = d.githubToken;
    LAST_SYNC = d.syncedAt ? new Date(d.syncedAt) : new Date();
    const bad = (d.issues || []).length;
    // Reload so the table shows the new numbers, then surface the report.
    if (COURSE) await loadCourse(COURSE.id);
    renderSyncInfo();
    show("dashboard");
    b.textContent = bad ? `⚠ ${d.ok}/${d.teams} clean` : `✓ Synced ${d.teams}`;
    SYNCING=false; refreshInstructorBar();
    setTimeout(()=>{ b.textContent=label; b.disabled=false; }, 3000);
  }catch(e){
    console.error("sync_now failed:", e);
    SYNC_REPORT = null;
    const code = e.code || "", msg = e.message || String(e);
    let hint = "";
    if (/unauthenticated/i.test(code))        hint = "\n\nYour session expired — sign out and back in.";
    else if (/permission-denied/i.test(code)) hint = "\n\nSync requires a verified @neumont.edu account.";
    else if (/deadline-exceeded/i.test(code)) hint = "\n\nThe sync passed its 5-minute limit. Some teams may have updated; run it again.";
    else if (/not-found/i.test(code))         hint = "\n\nThe Cloud Function isn't deployed. Run: firebase deploy --only functions";
    else if (/internal/i.test(code))          hint = "\n\nThe function errored. Check: firebase functions:log --only sync_now";
    SYNCING=false; refreshInstructorBar();
    alert("Sync failed: " + (code ? code + " — " : "") + msg + hint);
    b.textContent=label; b.disabled=false;
  }
};
</script>
