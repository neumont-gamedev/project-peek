<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Peek</title>
<style>
  :root {
    --ground:#eaecf1; --surface:#ffffff; --surface-2:#f5f6f9;
    --ink:#1a2130; --ink-soft:#5a6579; --ink-faint:#8b93a3;
    --line:#dde1e9; --line-soft:#e9ecf2;
    --accent:#3b5bd9; --accent-ink:#2f49b0; --accent-soft:rgba(59,91,217,.10);
    --healthy:#2f8f4e; --healthy-bg:rgba(47,143,78,.12);
    --watch:#b5720a;  --watch-bg:rgba(181,114,10,.13);
    --risk:#c8402f;   --risk-bg:rgba(200,64,47,.12);
    --noaccess:#6b7688; --noaccess-bg:rgba(107,118,136,.12);
    --shadow:0 1px 2px rgba(20,28,45,.04), 0 4px 16px rgba(20,28,45,.06);
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0f1219; --surface:#171c26; --surface-2:#1e2430;
      --ink:#e7eaf1; --ink-soft:#9aa3b5; --ink-faint:#6c7688;
      --line:#2b3240; --line-soft:#242b38;
      --accent:#8098f7; --accent-ink:#9fb2ff; --accent-soft:rgba(128,152,247,.14);
      --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
      --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
      --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
      --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0f1219; --surface:#171c26; --surface-2:#1e2430;
    --ink:#e7eaf1; --ink-soft:#9aa3b5; --ink-faint:#6c7688;
    --line:#2b3240; --line-soft:#242b38;
    --accent:#8098f7; --accent-ink:#9fb2ff; --accent-soft:rgba(128,152,247,.14);
    --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
    --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
    --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
    --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }
  * { box-sizing:border-box; }
  [hidden] { display: none !important; }   /* ensure the hidden attribute wins over .app/.signin display rules */
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-sans);
    line-height:1.55; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent-ink); text-underline-offset:2px; }

  /* sign-in */
  .signin { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .signin .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:40px 36px; max-width:400px; text-align:center; }
  .signin .logo { font-family:var(--font-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; }
  .signin h1 { font-size:26px; font-weight:680; letter-spacing:-.02em; margin:8px 0 6px; }
  .signin p { color:var(--ink-soft); font-size:14px; margin:0 0 24px; }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent); color:#fff; font-weight:600; font-size:14.5px; padding:11px 20px; border-radius:10px; }
  .btn:hover { background:var(--accent-ink); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--ink-faint); font-size:12px; }

  .app { display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh; }
  .side { position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line); padding:22px 16px;
    display:flex; flex-direction:column; }
  .brand { display:flex; flex-direction:column; gap:2px; padding:0 8px 14px; margin-bottom:6px;
    border-bottom:1px solid var(--line-soft); }
  .brand .code { font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; }
  .brand .name { font-size:16px; font-weight:650; letter-spacing:-.01em; }
  .switcher { margin:12px 4px 4px; }
  .switcher select { width:100%; font-family:var(--font-sans); font-size:13.5px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .nav { display:flex; flex-direction:column; gap:1px; margin-top:8px; }
  .nav-label { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 8px 6px; }
  .nav button { all:unset; cursor:pointer; display:flex; align-items:center; gap:9px;
    padding:7px 8px; border-radius:7px; font-size:13.5px; color:var(--ink-soft); }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  .nav button.active { background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .nav .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nav .home { font-family:var(--font-mono); font-size:13px; }
  .nav .tname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot.healthy{background:var(--healthy);} .dot.watch{background:var(--watch);}
  .dot.risk{background:var(--risk);} .dot.noaccess{background:var(--noaccess);}

  .side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft); font-size:12px;
    color:var(--ink-soft); display:flex; flex-direction:column; gap:8px; }
  .side-foot .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-foot button { all:unset; cursor:pointer; color:var(--accent-ink); font-size:12.5px; }
  .side-foot button:hover { text-decoration:underline; }

  .main { padding:34px clamp(20px,4vw,56px) 80px; max-width:1040px; }
  .view { display:none; }
  .view.active { display:block; }
  .eyebrow { font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); }
  h1 { font-size:clamp(24px,3.4vw,33px); font-weight:680; letter-spacing:-.02em; margin:6px 0 0; text-wrap:balance; }
  h2 { font-size:13px; font-family:var(--font-mono); letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600; margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--line-soft); }
  .lede { color:var(--ink-soft); font-size:15px; max-width:64ch; margin:14px 0 0; }

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 30px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .tile.healthy::before{background:var(--healthy);} .tile.watch::before{background:var(--watch);}
  .tile.risk::before{background:var(--risk);} .tile.noaccess::before{background:var(--noaccess);}
  .tile .n { font-family:var(--font-mono); font-size:30px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .tile.healthy .n{color:var(--healthy);} .tile.watch .n{color:var(--watch);}
  .tile.risk .n{color:var(--risk);} .tile.noaccess .n{color:var(--noaccess);}
  .tile .l { font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  .prio { display:flex; flex-direction:column; gap:10px; margin-bottom:34px; }
  .prio-item { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-left-width:3px; border-radius:10px;
    padding:13px 16px; box-shadow:var(--shadow); cursor:pointer; text-align:left; all:unset; box-sizing:border-box; }
  .prio-item:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .prio-item.risk{border-left-color:var(--risk);} .prio-item.watch{border-left-color:var(--watch);}
  .prio-item:hover{ background:var(--surface-2); }
  .prio-item .team { font-weight:640; font-size:14.5px; }
  .prio-item .why { color:var(--ink-soft); font-size:13px; }
  .prio-item .go { font-family:var(--font-mono); font-size:12px; color:var(--accent-ink); }

  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); background:var(--surface); }
  table { border-collapse:collapse; width:100%; font-size:13.5px; min-width:720px; }
  thead th { text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:600; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--surface-2); }
  tbody td { padding:12px 16px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--surface-2); }
  td .tm { font-weight:640; } td .pj { color:var(--ink-soft); }
  td.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); }

  .pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px;
    font-weight:600; letter-spacing:.04em; padding:3px 9px 3px 7px; border-radius:20px; white-space:nowrap; }
  .pill .d{ width:7px; height:7px; border-radius:50%; }
  .pill.healthy{color:var(--healthy); background:var(--healthy-bg);} .pill.healthy .d{background:var(--healthy);}
  .pill.watch{color:var(--watch); background:var(--watch-bg);} .pill.watch .d{background:var(--watch);}
  .pill.risk{color:var(--risk); background:var(--risk-bg);} .pill.risk .d{background:var(--risk);}
  .pill.noaccess{color:var(--noaccess); background:var(--noaccess-bg);} .pill.noaccess .d{background:var(--noaccess);}

  .legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:16px; font-size:12.5px; color:var(--ink-soft); }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .footnote { font-size:12px; color:var(--ink-faint); margin-top:22px; max-width:74ch; }

  .thead { display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px 18px; }
  .thead .titles{ flex:1 1 320px; }
  .thead .project { font-family:var(--font-mono); color:var(--accent-ink); font-size:14px; margin-top:8px; }
  .members { color:var(--ink-soft); font-size:13.5px; margin-top:10px; }
  .members b{ color:var(--ink); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:7px; font-size:13px; text-decoration:none; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 12px; box-shadow:var(--shadow); }
  .chip:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .chip .ic{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); letter-spacing:.06em; }
  .chip.disabled{ opacity:.55; pointer-events:none; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px;
    box-shadow:var(--shadow); margin-top:22px; }
  .kv { display:grid; grid-template-columns:132px 1fr; gap:8px 18px; font-size:14px; }
  .kv dt{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); padding-top:2px; }
  .kv dd{ margin:0; color:var(--ink); } .kv dd.soft{ color:var(--ink-soft); }
  .flag { display:flex; gap:10px; margin-top:16px; padding:12px 14px; border-radius:10px;
    background:var(--watch-bg); font-size:13.5px; color:var(--ink); }
  .flag .ic{ color:var(--watch); font-weight:700; font-family:var(--font-mono); }

  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .metric { background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:13px 15px; }
  .metric .n{ font-family:var(--font-mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metric .l{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--font-mono); letter-spacing:.03em; }
  .chart{ margin:2px 0 20px; } .chart svg{ width:100%; height:auto; display:block; }
  .chart-cap{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
  .bar-rect{ fill:var(--accent); }
  .axis-base{ stroke:var(--line); stroke-width:1; }
  .today-line{ stroke:var(--watch); stroke-width:1; stroke-dasharray:2 3; opacity:.8; }
  .axis-label{ fill:var(--ink-faint); font-family:var(--font-mono); font-size:9px; }
  .spark{ display:inline-block; width:132px; height:26px; vertical-align:middle; } .spark svg{ width:132px; height:26px; } .spark .bar-rect{ opacity:.9; }
  .contribs { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .crow .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px; margin-bottom:5px; }
  .crow .who{ font-family:var(--font-mono); } .crow .who .note{ color:var(--ink-faint); font-family:var(--font-sans); font-size:12px; }
  .crow .cnt{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:12.5px; }
  .bar { height:7px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-ink)); border-radius:5px; }
  .obs { font-size:14px; color:var(--ink-soft); }
  .obj { font-size:14.5px; color:var(--ink); white-space:pre-wrap; margin:0; }
  .noaccess-box{ display:flex; gap:12px; align-items:flex-start; font-size:14px; color:var(--ink-soft); } .noaccess-box .ic{ font-size:20px; }
  .tlists{ display:flex; flex-wrap:wrap; gap:10px; }
  .tlist{ flex:1 1 120px; min-width:110px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; padding:11px 13px; }
  .tlist .tn{ font-family:var(--font-mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tlist .tl{ font-size:12px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tsum{ font-size:13px; color:var(--ink-faint); font-family:var(--font-mono); margin-bottom:14px; }
  .tby{ font-size:13px; color:var(--ink-soft); margin:14px 0 4px; }
  .tby-lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-right:8px; }
  .trecent{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .trecent li{ display:grid; grid-template-columns:1.6fr 1.4fr auto; gap:12px; align-items:baseline;
    padding:8px 0; border-top:1px solid var(--line-soft); font-size:13px; }
  .trecent .rcard{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trecent .rmove{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); }
  .trecent .rby{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  @media (max-width:860px){ .trecent li{ grid-template-columns:1fr; gap:2px; } }
  .notes-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .saved{ font-family:var(--font-mono); font-size:11px; color:var(--healthy); opacity:0; transition:opacity .3s; }
  .saved.show{ opacity:1; }
  label.nlbl{ display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin:14px 0 6px; }
  textarea{ width:100%; min-height:96px; resize:vertical; font-family:var(--font-sans); font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; line-height:1.5; }
  textarea:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  textarea::placeholder{ color:var(--ink-faint); }
  .btn.secondary { background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn.secondary:hover { background:var(--surface-2); color:var(--ink); }
  .mgr-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 18px;
    box-shadow:var(--shadow); margin-top:18px; }
  .mgr-lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
  .mgr-course { font-weight:640; font-size:15px; margin-top:3px; }
  .mgr-head-btns { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .mgr { display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:var(--shadow); background:var(--surface); }
  .mrow { display:grid; grid-template-columns:auto 1.4fr 2fr auto; align-items:center; gap:14px;
    padding:12px 16px; border-bottom:1px solid var(--line-soft); }
  .mrow:last-child { border-bottom:none; }
  .mname { font-weight:640; font-size:14px; }
  .mproj { color:var(--ink-soft); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mbtns { display:flex; gap:12px; }
  .linkbtn { all:unset; cursor:pointer; font-size:13px; color:var(--accent-ink); }
  .linkbtn:hover { text-decoration:underline; }
  .linkbtn.danger { color:var(--risk); }
  .linkbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .form { display:grid; grid-template-columns:repeat(2,1fr); gap:14px 18px; }
  .form label { display:flex; flex-direction:column; gap:6px; font-family:var(--font-mono);
    font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); }
  .form input, .form select { font-family:var(--font-sans); font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; text-transform:none; letter-spacing:normal; }
  .form input:focus, .form select:focus { outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  @media (max-width:860px){ .mrow{ grid-template-columns:1fr auto; } .mproj{ display:none; } .form{ grid-template-columns:1fr; } }
  .empty { background:var(--surface); border:1px dashed var(--line); border-radius:14px; padding:26px; margin-top:24px; }
  .empty code { font-family:var(--font-mono); font-size:12.5px; background:var(--surface-2); padding:2px 6px; border-radius:5px; }
  .theme-btn{ all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); padding:6px 8px; border-radius:7px; }
  .theme-btn:hover{ background:var(--surface-2); color:var(--ink); }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .side{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); }
    .nav{ flex-flow:row wrap; } .nav-label{ width:100%; } .nav .tname{ max-width:130px; }
    .tiles{ grid-template-columns:repeat(2,1fr); } .metrics{ grid-template-columns:1fr; }
    .kv{ grid-template-columns:1fr; gap:2px 0; } .kv dt{ padding-top:12px; }
    .main{ padding:26px 20px 70px; } .side-foot{ margin-top:16px; }
  }
</style>
</head>
<body>

<div class="signin" id="signin" hidden>
  <div class="card">
    <div class="logo">Project Peek</div>
    <h1>Team Tracker</h1>
    <p>Sign in to see your courses, team activity, and review notes.</p>
    <button class="btn" id="signInBtn">Sign in with Google</button>
    <p class="muted" id="signinErr" style="margin-top:16px;color:var(--risk)"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <span class="code">Project Peek</span>
      <span class="name">Team Tracker</span>
    </div>
    <div class="switcher"><select id="courseSel" aria-label="Course"></select></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn" id="syncBtn" style="justify-content:center">⟳ Sync now</button>
      <button class="theme-btn" id="themeBtn">◐ Theme</button>
      <span class="who" id="who"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script type="module">

async function loadCourse(cid){

/* ---------- charts ---------- */
function computeRange(){
  let min=null,max=null;
  TEAMS.forEach(t=>{ const cbd=(t.act&&t.act.commits_by_day)||{};
    Object.keys(cbd).forEach(d=>{ if(!min||d<min)min=d; if(!max||d>max)max=d; }); });
  if(!max||TODAY>max) max=TODAY;
  RANGE=[min,max]; ALLDAYS=eachDay(min,max);
}
function eachDay(min,max){ const out=[]; if(!min) return out;
  let d=new Date(min+"T00:00:00Z"); const end=new Date(max+"T00:00:00Z"); let g=0;
  while(d<=end && g<400){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); g++; } return out; }
function chartSVG(cbd,{spark=false}={}){
  if(!ALLDAYS.length) return "";
  const w=spark?132:680,h=spark?26:96,padX=spark?1:10,padTop=spark?2:8,padBot=spark?2:16;
  const innerW=w-padX*2,innerH=h-padTop-padBot,n=ALLDAYS.length,bw=innerW/n;
  const vals=ALLDAYS.map(d=>cbd[d]||0),maxV=Math.max(1,...vals),baseY=h-padBot;
  let bars="";
  ALLDAYS.forEach((d,i)=>{ const v=cbd[d]||0; if(!v)return;
    const bh=Math.max(spark?1.5:2, v/maxV*innerH), x=padX+i*bw+bw*0.16, y=baseY-bh;
    bars+=`<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="1">`+
          (spark?"":`<title>${d}: ${v} commit${v==1?"":"s"}</title>`)+`</rect>`; });
  let extra="";
  if(!spark){ const ti=ALLDAYS.indexOf(TODAY), tx=ti>=0?padX+ti*bw+bw*0.5:padX+innerW;
    extra+=`<line class="axis-base" x1="${padX}" y1="${baseY+0.5}" x2="${padX+innerW}" y2="${baseY+0.5}"/>`;
    extra+=`<line class="today-line" x1="${tx.toFixed(1)}" y1="${padTop}" x2="${tx.toFixed(1)}" y2="${baseY}"/>`;
    extra+=`<text class="axis-label" x="${padX}" y="${h-4}">${ALLDAYS[0]}</text>`;
    extra+=`<text class="axis-label" x="${padX+innerW}" y="${h-4}" text-anchor="end">${ALLDAYS[ALLDAYS.length-1]}</text>`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="commits per day">${extra}${bars}</svg>`;
}
function peak(cbd){ return Math.max(0, ...Object.values(cbd||{})); }
function rateStats(cbd){
  const days = Object.keys(cbd||{}).sort(); if (!days.length) return null;
  const total = Object.values(cbd).reduce((a,b)=>a+b,0);
  const first = new Date(days[0]+"T00:00:00Z"), last = new Date(days[days.length-1]+"T00:00:00Z");
  const spanDays = Math.max(1, Math.round((last-first)/86400000) + 1);
  const perWeek = Math.round(total / (spanDays/7) * 10) / 10;
  const cutoff = new Date(Date.now() - 14*86400000).toISOString().slice(0,10);
  const last14 = days.filter(d=>d>=cutoff).reduce((s,d)=>s+cbd[d],0);
  return { perWeek, last14, spanDays };
}

  // team actions
  if (act === "add")         openForm(null);
  else if (act === "edit")   openForm(TEAMS.find(t=>t.id===tid));
  else if (act === "cancel"){ const f=$("teamForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "save")   await saveTeam(tid);
  else if (act === "remove"){ if (confirm("Remove this team? Its collected activity is deleted too. This can't be undone.")) await removeTeam(tid); }
  // course actions
  else if (act === "course-add")    openCourseForm(null);
  else if (act === "course-edit")   openCourseForm(COURSE);
  else if (act === "course-cancel"){ const f=$("courseForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "course-save")   await saveCourse(m.dataset.cid);
  else if (act === "course-remove"){
    if (confirm("Remove this ENTIRE course and all its teams, activity, and notes? This can't be undone.")) await removeCourse(m.dataset.cid);
  }
}
function openForm(t){ const f=$("teamForm"); f.hidden=false; f.innerHTML=teamFormHTML(t); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
function fval(id){ const el=$(id); return el ? el.value.trim() : ""; }
function slugId(name){
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "team";
  return base + "-" + Date.now().toString(36).slice(-4);
}
async function saveTeam(tid){
  const data = { team:fval("f_team"), project:fval("f_project"), members:fval("f_members"),
                 github:fval("f_github"), trello:fval("f_trello"), status:fval("f_status"),
                 objectives:fval("f_objectives"), type:fval("f_type")||"team" };
  if (!data.team){ $("formErr").textContent = "Name is required."; return; }
  let id = tid, payload = { ...data };
  if (!id){ id = slugId(data.team); payload.prop={concept:"",features:"",tech:"",flag:""}; payload.sprint=null; payload.why=""; payload.notes=""; }
  try {
    await setDoc(doc(db, `users/${UID}/courses/${COURSE.id}/teams/${id}`), payload, { merge:true });
    await loadCourse(COURSE.id); show("manage");
  } catch(e){ console.error(e); const fe=$("formErr"); if(fe) fe.textContent = e.code+" — "+e.message; }
}
async function removeTeam(tid){
  try {
    await deleteDoc(doc(db, `users/${UID}/courses/${COURSE.id}/teams/${tid}`));
    await deleteDoc(doc(db, `users/${UID}/courses/${COURSE.id}/notes/${tid}`)).catch(()=>{});
    await loadCourse(COURSE.id); show("manage");
  } catch(e){ console.error(e); alert("Couldn't remove: " + (e.message||e)); }
}

/* ---------- course management ---------- */
function todayLabel(){
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d=new Date(); return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function courseId(code){
  let base = code.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "course";
  const ids = new Set(COURSES.map(c=>c.id)); let id=base, i=2;
  while (ids.has(id)){ id = base+"-"+i; i++; }
  return id;
}
function courseFormHTML(c){
  const v = c || { code:"", name:"", term:"", report_date: todayLabel(), type:"team" };
  const ty = v.type || "team";
  return `<div class="card"><h2>${c?"Edit course":"New course"}</h2>
    <div class="form">
      <label>Course code<input id="c_code" value="${esc(v.code)}" placeholder="e.g. BIT221"></label>
      <label>Course name<input id="c_name" value="${esc(v.name)}" placeholder="e.g. BIT221 – Data Structures"></label>
      <label>Default type<select id="c_type"><option value="team"${ty==="team"?" selected":""}>Team projects</option><option value="solo"${ty==="solo"?" selected":""}>Solo projects</option><option value="mixed"${ty==="mixed"?" selected":""}>Mixed</option></select></label>
      <label>Term<input id="c_term" value="${esc(v.term)}" placeholder="e.g. Fall 2026"></label>
      <label>Report date<input id="c_report" value="${esc(v.report_date)}" placeholder="e.g. ${todayLabel()}"></label>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn" data-mact="course-save"${c?` data-cid="${c.id}"`:""}>Save</button>
      <button class="btn secondary" data-mact="course-cancel">Cancel</button>
    </div>
    <p class="muted" id="courseErr" style="color:var(--risk);margin-top:12px"></p></div>`;
}
function openCourseForm(c){ const f=$("courseForm"); if(!f) return; f.hidden=false; f.innerHTML=courseFormHTML(c); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
async function saveCourse(cid){
  const code=fval("c_code"), name=fval("c_name"), term=fval("c_term"), report=fval("c_report"), type=fval("c_type")||"team";
  if(!code){ const ce=$("courseErr"); if(ce) ce.textContent="Course code is required."; return; }
  const id = cid || courseId(code);
  try {
    await setDoc(doc(db, `users/${UID}/courses/${id}`),
      { code, name: name || code, term, report_date: report || todayLabel(), type }, { merge:true });
    await loadCourses();      // refresh switcher
    await loadCourse(id);     // switch to the new/edited course
    show("manage");
  } catch(e){ console.error(e); const ce=$("courseErr"); if(ce) ce.textContent = e.code+" — "+e.message; }
}
async function removeCourse(cid){
  try {
    for (const sub of ["teams","notes"]){
      const snap = await getDocs(collection(db, `users/${UID}/courses/${cid}/${sub}`));
      for (const d of snap.docs){ await deleteDoc(d.ref); }
    }
    await deleteDoc(doc(db, `users/${UID}/courses/${cid}`));
    await loadCourses();
    if (COURSES.length){ await loadCourse(COURSES[0].id); show("manage"); }
    else renderNoCourses();
  } catch(e){ console.error(e); alert("Couldn't remove course: " + (e.message||e)); }
}
function renderNoCourses(){
  $("nav").innerHTML=`<div class="nav-label">Overview</div>`; $("courseSel").innerHTML="";
  $("main").innerHTML = `<span class="eyebrow">Getting started</span><h1>Create your first course</h1>
    <p class="lede">Add a course, then add its teams. The daily sync will fill in each team's commit and Trello activity.</p>
    <div style="margin:18px 0"><button class="btn" data-mact="course-add">+ New course</button></div>
    <div id="courseForm" hidden></div>
    <div class="empty">
      <p style="color:var(--ink-soft)">Prefer to seed from local files instead? Your account UID (for the collector) is:</p>
      <p><code>${esc(UID)}</code></p>
    </div>`;
}

/* ---------- routing + theme ---------- */
function show(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  (document.getElementById("view-"+view)||document.getElementById("view-dashboard"))?.classList.add("active");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  window.scrollTo({top:0});
  if(location.hash.slice(1)!==view) history.replaceState(null,"","#"+view);
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"dashboard"));
$("nav").addEventListener("click", e=>{ const b=e.target.closest("button[data-view]"); if(b) show(b.dataset.view); });
$("main").addEventListener("click", onMainClick);   // delegated: team + course actions (works on all views)
const root=document.documentElement;
$("themeBtn").onclick=()=>{ const cur=root.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark?"light":"dark"); };

$("syncBtn").onclick = async () => {
  const b=$("syncBtn"); if(b.disabled) return;
  const label=b.textContent; b.disabled=true; b.textContent="⟳ Syncing…";
  try{
    const res = await httpsCallable(functions, "sync_now", { timeout: 300000 })();
    const d = res.data || {};
    if (COURSE) await loadCourse(COURSE.id);
    b.textContent = `✓ Synced ${d.teams!=null?d.teams:""}`.trim();
    setTimeout(()=>{ b.textContent=label; b.disabled=false; }, 2500);
  }catch(e){
    console.error("sync_now failed:", e);
    alert("Sync failed: " + (e.message||e) + "\n\n(If this says the function isn't found, the Cloud Function may not be deployed yet.)");
    b.textContent=label; b.disabled=false;
  }
};
</script>
