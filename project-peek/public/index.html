<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Peek</title>
<link rel="icon" type="image/png" sizes="512x512" href="./project-peek-favicon.png?v=5">
<link rel="apple-touch-icon" href="./project-peek-favicon.png?v=5">
<style>
  :root {
    /* Canonical school palette: use these brand tokens for future design work. */
    --brand-yellow:#ffdd00; --brand-gray-light:#dbdddf; --brand-gray:#3f4444;
    --brand-gray-dark:#222223; --brand-black:#000000; --brand-white:#ffffff;
    --ground:var(--brand-gray-light); --surface:var(--brand-white); --surface-2:rgba(219,221,223,.38);
    --ink:var(--brand-gray-dark); --ink-soft:var(--brand-gray); --ink-faint:rgba(63,68,68,.68);
    --line:var(--brand-gray-light); --line-soft:rgba(63,68,68,.14);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-gray); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.22);
    --healthy:#2f8f4e; --healthy-bg:rgba(47,143,78,.12);
    --watch:#b5720a;  --watch-bg:rgba(181,114,10,.13);
    --risk:#c8402f;   --risk-bg:rgba(200,64,47,.12);
    --noaccess:#6b7688; --noaccess-bg:rgba(107,118,136,.12);
    --unrated:#8b93a3; --unrated-bg:rgba(139,147,163,.10);
    --shadow:0 1px 2px rgba(20,28,45,.04), 0 4px 16px rgba(20,28,45,.06);
    --ground-grad:linear-gradient(155deg, #eef3fa 0%, #e6edf8 48%, #dde7f5 100%);
    --field:var(--surface-2);   /* data-entry fields */
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.07) 0%, transparent 55%),
      linear-gradient(160deg, #ffffff 0%, #f7f9fc 60%, #eef2f8 100%);
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#000; --surface:#141416; --surface-2:#1e1e21;
      --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
      --line:#2a2a2e; --line-soft:rgba(219,221,223,.10);
      --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
      --accent-soft:rgba(255,221,0,.16);
      --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
      --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
      --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
      --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --ground-grad:none;
    --field:#000;
    color-scheme:dark;
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.06) 0%, transparent 55%),
      linear-gradient(160deg, #222226 0%, #161618 55%, #0f0f11 100%);
    }
  }
  :root[data-theme="dark"] {
    --ground:#000; --surface:#141416; --surface-2:#1e1e21;
    --ink:var(--brand-white); --ink-soft:var(--brand-gray-light); --ink-faint:rgba(219,221,223,.62);
    --line:#2a2a2e; --line-soft:rgba(219,221,223,.10);
    --accent:var(--brand-yellow); --accent-ink:var(--brand-yellow); --accent-contrast:var(--brand-black);
    --accent-soft:rgba(255,221,0,.16);
    --healthy:#5ec27f; --healthy-bg:rgba(94,194,127,.14);
    --watch:#e0a341;  --watch-bg:rgba(224,163,65,.15);
    --risk:#ef6d5c;   --risk-bg:rgba(239,109,92,.15);
    --noaccess:#8a94a6; --noaccess-bg:rgba(138,148,166,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --ground-grad:none;
    --field:#000;
    color-scheme:dark;
    --panel-grad:radial-gradient(120% 90% at 0% 0%, rgba(255,221,0,.06) 0%, transparent 55%),
      linear-gradient(160deg, #222226 0%, #161618 55%, #0f0f11 100%);
  }
  :root[data-theme="dark"] input[type="date"],
  :root[data-theme="dark"] input[type="time"] { color-scheme:dark; background-color:var(--field)!important; color:var(--ink)!important; }
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,
  :root[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="date"],
    :root:not([data-theme="light"]) input[type="time"] { color-scheme:dark; background-color:var(--field)!important; color:var(--ink)!important; }
    :root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-calendar-picker-indicator { filter:none; opacity:.9; }
  }
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-fields-wrapper,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-hour-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-minute-field,
  :root[data-theme="dark"] input[type="time"]::-webkit-datetime-edit-ampm-field {
    background:transparent; color:var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-fields-wrapper,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-hour-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-minute-field,
    :root:not([data-theme="light"]) input[type="time"]::-webkit-datetime-edit-ampm-field {
      background:transparent; color:var(--ink);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display: none !important; }   /* ensure the hidden attribute wins over .app/.signin display rules */
  body { margin:0; background:var(--ground); background-image:var(--ground-grad); background-attachment:fixed;
    min-height:100vh; color:var(--ink); font-family:var(--font-sans);
    line-height:1.55; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent-ink); text-underline-offset:2px; }

  /* sign-in */
  .signin { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .signin .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:40px 36px; max-width:400px; text-align:center; }
  .signin .logo { font-family:var(--font-mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600; }
  .signin h1 { font-size:26px; font-weight:680; letter-spacing:-.02em; margin:8px 0 6px; }
  .signin p { color:var(--ink-soft); font-size:14px; margin:0 0 24px; }
  .signin-or{ display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--ink-faint); font-size:12.5px; }
  .signin-or::before, .signin-or::after{ content:""; flex:1; border-top:1px solid var(--line); }
  .link-form .add-group{ max-width:none; }
  .link-form input{ text-align:left; }
  .signin .link-msg{ margin:14px 0 0; padding:10px 12px; border-radius:8px; background:var(--surface-2);
    color:var(--ink); font-size:13.5px; text-align:left; }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent); color:var(--accent-contrast); font-weight:700; font-size:14.5px; padding:11px 20px; border-radius:10px; }
  .btn:hover { filter:brightness(.92); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .muted { color:var(--ink-faint); font-size:12px; }

  .app { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100vh; }
  /* Left column: the logo pill, then the sidebar as its own rounded panel filling the rest. */
  .side-col { position:sticky; top:16px; align-self:start; height:calc(100vh - 32px); margin:16px 0 16px 16px;
    display:flex; flex-direction:column; gap:20px; min-height:0; }
  .side { flex:1 1 auto; min-height:0; overflow-y:auto;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:16px 14px 18px; display:flex; flex-direction:column; }
  .brand { display:flex; flex-direction:column; gap:6px; }
  /* Logo + name in a pill. */
  .brand-title{ display:flex; align-self:stretch; align-items:center; gap:10px; min-width:0;
    height:54px; padding:0 18px 0 10px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); }
  .brand-mark{ width:38px; height:auto; flex:0 0 38px; display:block; }
  .brand .code{ min-width:0; color:var(--ink); font-family:"Arial Rounded MT Bold","Trebuchet MS",var(--font-sans);
    font-size:20px; font-weight:900; line-height:1; letter-spacing:0; white-space:nowrap; }
  .brand .code .peek{ color:var(--brand-yellow); -webkit-text-stroke:.45px var(--brand-gray); text-shadow:0 1px 0 rgba(0,0,0,.18); }
  .brand .name { margin-left:16px; font-size:13px; font-weight:650; letter-spacing:0; color:var(--ink-soft); }
  /* Course / project / sprint pickers, with a rule under the group. */
  .switchers { display:flex; flex-direction:column; gap:8px; padding-bottom:16px; margin-bottom:6px;
    border-bottom:1px solid var(--line-soft); }
  .switcher select { width:100%; appearance:none; -webkit-appearance:none; cursor:pointer;
    font-family:var(--font-sans); font-size:15px; color:var(--ink);
    background-color:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:13px 38px 13px 16px;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size:5px 5px; background-repeat:no-repeat; }
  .switcher select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .switcher select:disabled { cursor:default; color:var(--ink-soft); }
  .nav { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .nav-label { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 8px 6px; }
  .nav button { all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:12px; font-size:14px; color:var(--ink-soft); }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  /* Selected item: solid brand yellow with a chevron on the right. */
  .nav button.active { background:var(--accent); color:var(--accent-contrast); font-weight:600; }
  .nav button.active::after { content:""; margin-left:auto; width:7px; height:7px; flex:0 0 auto;
    border-right:2px solid currentColor; border-top:2px solid currentColor; transform:rotate(45deg); margin-right:4px; }
  .nav button.active .nav-ic { color:var(--accent-contrast); }
  .nav button.active .dot { box-shadow:0 0 0 2px rgba(0,0,0,.25); }
  .nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .nav .nav-ic { width:8px; display:inline-flex; justify-content:center; font-size:12px; color:var(--ink-faint); }
  .nav .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .nav .tname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot.healthy{background:var(--healthy);} .dot.watch{background:var(--watch);}
  .dot.risk{background:var(--risk);} .dot.noaccess{background:var(--noaccess);}
  .dot.unrated{background:var(--unrated);}

  .side-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft); font-size:12px;
    color:var(--ink-soft); display:flex; flex-direction:column; gap:8px; }
  .side-foot .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-foot button { all:unset; cursor:pointer; color:var(--accent-ink); font-size:12.5px; }
  .side-foot button:hover { text-decoration:underline; }
  .sprint-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:18px; }
  .sprint-panel{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:19px 20px 18px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .12s, border-color .12s; }
  .sprint-panel::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--unrated); }
  .sprint-panel.healthy::before{background:var(--healthy);} .sprint-panel.watch::before{background:var(--watch);}
  .sprint-panel.risk::before{background:var(--risk);} .sprint-panel.noaccess::before{background:var(--noaccess);}
  .sprint-panel:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .sprint-panel:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sprint-panel .pill{ align-self:flex-start; font-size:13.5px; padding:5px 11px; }
  .sp-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:19px; color:var(--ink); }
  .sp-tag{ font-family:var(--font-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .sp-tag.cur{ color:var(--accent-ink); }
  .sp-dates{ font-size:15.5px; color:var(--ink-soft); }
  .sp-body{ display:flex; align-items:center; gap:20px; margin:5px 0; }
  .sp-stats{ display:flex; flex-direction:column; gap:10px; font-size:15px; color:var(--ink-soft); white-space:nowrap; }
  .hours-ring{ width:120px; height:120px; flex:0 0 120px; }
  .hours-ring circle{ fill:none; stroke-width:12; }
  .hours-ring .track{ stroke:var(--surface-2); }
  .hours-ring .arc{ stroke:var(--ink-faint); stroke-linecap:round; transition:stroke-dasharray .4s ease; }
  .hours-ring.low .arc{ stroke:var(--risk); }
  .hours-ring.ok .arc{ stroke:var(--healthy); }
  .hours-ring text{ text-anchor:middle; fill:var(--ink-soft); }
  .hours-ring .ring-n{ font-family:var(--font-mono); font-size:21px; font-weight:600; fill:var(--ink); dominant-baseline:middle; }
  .hours-ring .ring-l{ font-size:9.5px; }
  .hours-ring.low .ring-n{ fill:var(--risk); }
  .hours-ring.ok .ring-n{ fill:var(--healthy); }
  .sp-stats b{ font-family:var(--font-mono); font-size:19px; color:var(--ink); margin-right:5px; font-variant-numeric:tabular-nums; }
  .chip-btn{ cursor:pointer; font:inherit; }
  .sp-foot{ display:flex; justify-content:space-between; align-items:center; }
  .sp-mood{ font-size:28px; line-height:1; }
  .sp-nudge{ font-size:15px; font-weight:600; color:var(--accent-ink); }
  .callout{ background:var(--accent-soft); border:1px solid var(--accent); border-radius:9px; padding:11px 13px;
    font-size:13.5px; color:var(--ink); margin-bottom:12px; }
  /* Mirrors the left column (16px from the top, 54px logo box, 20px gap) so the first
     panel on each side starts at the same height. .main has 34px top padding. */
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; height:54px; margin:-18px 0 20px; }
  .icon-bar{ display:inline-flex; gap:8px; padding:6px; border-radius:12px; background:var(--surface);
    border:1px solid var(--line); box-shadow:var(--shadow); }
  .icon-circle{ all:unset; box-sizing:border-box; cursor:pointer; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; background:var(--surface-2); color:var(--ink-soft);
    transition:transform .12s, box-shadow .12s; }
  .icon-circle svg{ width:22px; height:22px; display:block; }
  .icon-circle:hover{ transform:translateY(-1px); box-shadow:0 0 0 2px var(--accent); color:var(--ink); }
  .icon-circle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .icon-circle.pen, .icon-circle.sync, .icon-circle.mode{ color:var(--ink); }
  .icon-circle.mode.on{ box-shadow:0 0 0 2px var(--accent); color:var(--accent-ink); }
  .icon-circle.sync{ position:relative; }
  .icon-circle.sync.warn::after{ content:""; position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%;
    background:var(--watch); box-shadow:0 0 0 2px var(--surface-2); }
  .icon-circle.sync.spinning svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .icon-circle.sync.spinning svg{ animation:none; } .icon-circle.sync.spinning{ opacity:.6; } }
  .icon-circle.pen.on{ box-shadow:0 0 0 2px var(--accent); color:var(--accent-ink); }
  .icon-circle.off{ cursor:default; opacity:.35; filter:grayscale(1); }
  .icon-circle.off:hover{ transform:none; box-shadow:none; }
  .icon-circle .i-sun{ display:none; }
  :root[data-theme="dark"] .icon-circle .i-sun{ display:block; }
  :root[data-theme="dark"] .icon-circle .i-moon{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .icon-circle .i-sun{ display:block; }
    :root:not([data-theme="light"]) .icon-circle .i-moon{ display:none; }
  }
  .card.project-head{ margin-top:0; margin-bottom:8px; }
  .view-flush > .top-row + .card{ margin-top:0; }   /* first panel lines up with the sidebar */   /* the top row supplies the gap above */
  .project-overview{ color:var(--ink-soft); font-size:15px; line-height:1.6; max-width:72ch; margin:12px 0 0; }
  .top-right{ display:inline-flex; align-items:center; gap:12px; }
  .account{ position:relative; }
  .account-btn{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:14px;
    height:54px; padding:0 16px 0 22px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); max-width:280px; }
  .account-btn:hover{ border-color:var(--accent); }
  .account-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .acct-text{ display:flex; flex-direction:column; min-width:0; line-height:1.25; }
  .acct-name{ font-size:14px; font-weight:650; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-email{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-chev{ width:18px; height:18px; flex:0 0 18px; color:var(--ink-soft); transition:transform .15s; }
  .account.open .acct-chev{ transform:rotate(180deg); }
  .account-menu{ display:none; position:absolute; right:0; top:calc(100% + 8px); min-width:180px; z-index:20;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; }
  .account.open .account-menu{ display:block; }
  .account-menu button{ all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%;
    padding:9px 12px; border-radius:8px; font-size:13.5px; color:var(--ink); }
  .account-menu button:hover, .account-menu button:focus-visible{ background:var(--surface-2); }
  @media (max-width:720px){ .acct-email{ display:none; } .account-btn{ height:46px; padding:0 12px 0 16px; } }
  .locked-note{ margin-top:12px; padding:10px 12px; border:1px dashed var(--line); border-radius:9px;
    font-size:13px; color:var(--ink-soft); background:var(--surface-2); }
  .goal-row .goal-mark{ width:18px; text-align:center; color:var(--ink-faint); }
  .goal-row.done .goal-mark{ color:var(--healthy); font-weight:700; }
  .goal-end{ display:flex; align-items:center; gap:8px; }
  .result{ font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap;
    background:var(--surface-2); color:var(--ink-soft); }
  .result.done{ background:var(--healthy-bg); color:var(--healthy); }
  .result.partial{ background:var(--watch-bg); color:var(--ink); }
  .result.notdone{ color:var(--risk); }
  .result-sel{ font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--ink); }
  .result-sel.done{ border-color:var(--healthy); color:var(--healthy); background:var(--healthy-bg); }
  .result-sel.partial{ border-color:var(--watch); background:var(--watch-bg); }
  .result-sel.notdone{ border-color:var(--risk); color:var(--risk); }
  .entry-form.with-student{ grid-template-columns:minmax(160px,1fr) 150px 100px minmax(160px,1fr) auto; max-width:960px; }
  .wrap-form{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .wrap-form textarea{ min-height:70px; }
  .wrap-goal{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg label{ cursor:pointer; }
  .seg input{ position:absolute; opacity:0; pointer-events:none; }
  .seg span{ display:block; padding:5px 10px; font-size:12.5px; color:var(--ink-soft); border-left:1px solid var(--line); }
  .seg label:first-child span{ border-left:0; }
  .seg input:checked + span{ background:var(--accent-soft); color:var(--ink); font-weight:600; }
  .seg input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:-2px; }
  .mood-picker{ display:flex; gap:8px; flex-wrap:wrap; }

function fmtWhen(d){
  if(!d) return "";
  const now = new Date(), sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (sameDay) return "today " + time;
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (d.toDateString() === yest.toDateString()) return "yesterday " + time;
  return d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + time;
}

async function loadWorkspace(){
  COURSES = [];
  // The domain decides the role, matching the rules: staff own courses, students
  // only see the teams they're assigned to.
  IS_ADMIN = USER_EMAIL.endsWith("@" + ALLOWED_DOMAIN);
  if (IS_ADMIN) {
    const snap = await getDocs(collection(db, `users/${UID}/courses`));
    snap.forEach(d => COURSES.push({ id:d.id, ...d.data() }));
  }
  OWNER_UID = IS_ADMIN ? UID : null;
  ASSIGNED_TEAMS = [];
  if (!IS_ADMIN) {
    // A student's courses come from their enrollment docs (so a solo student can
    // open a course before they have a project), plus any course they have a team in.
    const [enrolled, assigned] = await Promise.all([
      getDocs(query(collectionGroup(db, "enrollments"), where("email", "==", USER_EMAIL))),
      getDocs(query(collectionGroup(db, "teams"), where("studentEmails", "array-contains", USER_EMAIL)))]);
    assigned.forEach(d => ASSIGNED_TEAMS.push({ id:d.id, ...d.data() }));
    const seen = new Set();
    const addCourse = (ownerUid, courseId, code, name, type) => {
      const key = `${ownerUid}:${courseId}`;
      if (!ownerUid || !courseId || seen.has(key)) return;
      seen.add(key);
      COURSES.push({ id:courseId, ownerUid, code:code||courseId, name:name||code||courseId, type:type||"team" });
    };
    enrolled.forEach(d => { const e=d.data(); addCourse(e.ownerUid, e.courseId, e.courseCode, e.courseName, e.courseType); });
    ASSIGNED_TEAMS.forEach(t => addCourse(t.ownerUid, t.courseId, t.courseCode, t.courseName, t.courseType));
  }
  COURSES.sort((a,b)=> (a.name||a.id).localeCompare(b.name||b.id));
  const sel = $("courseSel");
  sel.innerHTML = COURSES.map(c=>`<option value="${esc(c.id)}">${esc(c.code||c.id)}</option>`).join("");
  sel.onchange = () => loadCourse(sel.value);
  $("sprintSel").onchange = (e) => setSprint(e.target.value);
  $("modeToggle").hidden = !IS_ADMIN;
  applyModeChrome();
  if (IS_ADMIN) await loadLastSync();
  if (!COURSES.length){ renderNoCourses(); return; }
  const last = lastCourseId();
  await loadCourse(COURSES.some(c=>c.id===last) ? last : COURSES[0].id);
}

function courseKey(){ return "peek:course:" + UID; }
function lastCourseId(){ try { return localStorage.getItem(courseKey()); } catch(e){ return null; } }

/* ---------- sprints ----------
   A sprint is a course-level cadence: every team is on Sprint N together. Each team's
   window inside that sprint can differ, because they're reviewed on different weekdays,
   so an entry may override the sprint's start/end. Per-sprint activity is DERIVED by
   slicing act.commits_by_day (which the sync stores as full history) — nothing extra is
   collected, and a sprint added after the fact still gets a correct chart. */
function cpath(){ return `users/${OWNER_UID}/courses/${COURSE.id}`; }
function sprintKey(){ return "peek:sprint:" + UID + ":" + (COURSE ? COURSE.id : ""); }
function lastSprintId(){ try { return localStorage.getItem(sprintKey()); } catch(e){ return null; } }
/* Sprint phase comes from the calendar. Every project shares the sprint's dates; a
   sprint stays open for students through one grace day after it ends (to log the
   last hours and submit the retrospective), then closes. The rules enforce the same
   cut-off. Sprints without dates fall back to "newest is current". */
const GRACE_DAYS=1;
function addDays(iso,n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function lastSprint(){ return SPRINTS.length ? SPRINTS[SPRINTS.length-1] : null; }
function sprintPhase(sp){
  if(!sp) return "closed";
  if(!sp.start || !sp.end) return sp===lastSprint() ? "current" : "closed";
  if(TODAY < sp.start) return "upcoming";
  if(TODAY <= sp.end) return "current";
  if(TODAY <= addDays(sp.end, GRACE_DAYS)) return "grace";
  return "closed";
}
function activeSprint(){
  return SPRINTS.find(sp=>sprintPhase(sp)==="current")
    || [...SPRINTS].reverse().find(sp=>sp.start && sp.start<=TODAY) || lastSprint();
}
function isPast(sp){ const ph=sprintPhase(sp); return ph==="grace" || ph==="closed"; }   // the sprint has ended
function isClosed(sp){ return sprintPhase(sp)==="closed"; }                             // grace day over too
function frozen(){ return isClosed(SPRINT) && !(instructorView() && UNLOCKED); }
function entryOf(tid){ return ENTRIES[tid] || {}; }
function winOf(tid){ return { start:(SPRINT&&SPRINT.start)||"", end:(SPRINT&&SPRINT.end)||"" }; }
function statusOf(t){ const e=ENTRIES[t.id]; return (e && e.status) || t.status || "unrated"; }
function sliceCbd(cbd,start,end){ const o={};
  Object.keys(cbd||{}).forEach(d=>{ if((!start||d>=start)&&(!end||d<=end)) o[d]=cbd[d]; }); return o; }
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "Mon" for a YYYY-MM-DD date (read as UTC so the weekday never shifts by timezone).
function dowOf(iso){ const d=new Date(String(iso)+"T00:00:00Z");
  return isNaN(d) ? "" : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]; }
function fmtD(iso){ if(!iso) return ""; const p=String(iso).split("-");
  return p.length===3 ? `${MONS[+p[1]-1]} ${+p[2]}` : String(iso); }
function winLabel(tid){ const w=winOf(tid); return w.start&&w.end ? `${fmtD(w.start)} – ${fmtD(w.end)}` : ""; }
function nextDay(iso){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }

// A team's activity restricted to its window in the selected sprint. Same shape as
// `act`, so every card that renders activity keeps working unchanged.
function sprintAct(t){
  const a = t.act || {ok:false, obs:"No data."};
  if (!SPRINT || !a.ok) return a;
  const w=winOf(t.id), cbd=sliceCbd(a.commits_by_day, w.start, w.end), days=Object.keys(cbd).sort();
  const total=days.reduce((n,d)=>n+cbd[d],0);
  let contribs=a.contribs||[], allTime=true;
  const bda=a.by_day_author;
  if (bda){
    const c={};
    days.forEach(d=>{ const m=bda[d]||{}; Object.keys(m).forEach(n=>c[n]=(c[n]||0)+m[n]); });
    contribs=Object.keys(c).sort((x,y)=>c[y]-c[x]).map(n=>({ n, c:c[n],
      p: total ? Math.round(100*c[n]/total) : 0,
      note: ((a.contribs||[]).find(z=>z.n===n)||{}).note || "" }));
    allTime=false;
  }
  return { ...a, ok:true, total, days:days.length, commits_by_day:cbd, contribs, contribs_all_time:allTime,
    first: days[0]||"", last: days[days.length-1]||"",
    last_fmt: days.length ? fmtD(days[days.length-1]) : "—",
    span: days.length ? `${fmtD(days[0])} – ${fmtD(days[days.length-1])}` : "no commits in window" };
}

async function loadSprints(){
  SPRINTS=[];
  const snap = await getDocs(collection(db, `${cpath()}/sprints`));
  snap.forEach(d => SPRINTS.push({ id:d.id, ...d.data() }));
  SPRINTS.sort((a,b)=>(a.n||0)-(b.n||0));
  if(IS_ADMIN) await rollSprints().catch(e=>console.error("sprint rollover failed:", e));
  const want = lastSprintId();
  SPRINT = SPRINTS.find(sp=>sp.id===want) || activeSprint();
  UNLOCKED = false;
  renderSprintSel();
  await loadEntries();
}
// When the newest sprint has ended, add the next one(s) with the same length so
// students always have a current sprint. A course whose last sprint ended more than
// one sprint-length ago is treated as finished and left alone (no backfilling last
// term). Mirrors roll_sprints in functions/main.py.
async function rollSprints(){
  let cur=lastSprint();
  if(!cur || !cur.start || !cur.end || cur.end>=TODAY) return;
  const len=Math.round((new Date(cur.end+"T00:00:00Z")-new Date(cur.start+"T00:00:00Z"))/86400000)+1;
  if(addDays(cur.end, len) < TODAY) return;
  for(let guard=0; cur.end<TODAY && guard<52; guard++){
    const n=(cur.n||SPRINTS.length)+1, start=nextDay(cur.end);
    let sid="s"+n; while(SPRINTS.some(x=>x.id===sid)) sid+="b";
    const data={ n, name:"Sprint "+n, start, end:addDays(start,len-1), targetHours:targetOf(cur), auto:true };
    await setDoc(doc(db, `${cpath()}/sprints/${sid}`), { ...data, createdAt:serverTimestamp() });
    cur={ id:sid, ...data }; SPRINTS.push(cur);
  }
}
async function loadEntries(){
  ENTRIES={}; GOALS={}; TIME_ENTRIES={}; RETROS={}; EDITING_TIME="";
  if(!SPRINT) return;
  if(IS_ADMIN){
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${SPRINT.id}/entries`));
    snap.forEach(d => ENTRIES[d.id] = d.data());
  }else{
    await Promise.all(TEAMS.map(async t=>{
      const snap=await getDoc(doc(db,`${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`));
      if(snap.exists()) ENTRIES[t.id]=snap.data();
    }));
  }
  await Promise.all(TEAMS.map(async t => {
    const base = `${cpath()}/sprints/${SPRINT.id}/entries/${t.id}`;
    const [goals, time, retro] = await Promise.all([
      getDocs(collection(db, `${base}/goals`)),
      getDocs(collection(db, `${base}/time`)),
      getDocs(collection(db, `${base}/retro`))
    ]);
    RETROS[t.id] = retro.docs.map(d=>({id:d.id,...d.data()}));
    GOALS[t.id] = goals.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    TIME_ENTRIES[t.id] = time.docs.map(d=>({id:d.id,...d.data()}))   // oldest first; same day by entry order
      .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  }));
}
function renderSprintSel(){
  const sel=$("sprintSel");
  if(!SPRINTS.length){ sel.innerHTML=`<option>No sprints yet</option>`; sel.disabled=true; return; }
  sel.disabled=false;
  sel.innerHTML = [...SPRINTS].reverse().map(sp=>{
    const tag = {current:" (current)", grace:" (grace day)", upcoming:" (upcoming)", closed:" (past)"}[sprintPhase(sp)];
    return `<option value="${esc(sp.id)}">${esc(sp.name||("Sprint "+sp.n))}${tag}</option>`;
  }).join("");
  if(SPRINT) sel.value = SPRINT.id;
}
async function setSprint(sid){
  SPRINT = SPRINTS.find(sp=>sp.id===sid) || activeSprint();
  UNLOCKED = false;
  if(SPRINT){ try { localStorage.setItem(sprintKey(), SPRINT.id); } catch(e){} }
  renderSprintSel();
  await loadEntries();
  renderNav(); render();
  show(location.hash.slice(1) || "dashboard");
}

/* ---------- charts ---------- */
function computeRange(){
  let min=null,max=null;
  TEAMS.forEach(t=>{ const cbd=(t.act&&t.act.commits_by_day)||{};
    Object.keys(cbd).forEach(d=>{ if(!min||d<min)min=d; if(!max||d>max)max=d; }); });
  if(!max||TODAY>max) max=TODAY;
  RANGE=[min,max]; ALLDAYS=eachDay(min,max);
}
function eachDay(min,max){ const out=[]; if(!min) return out;
  let d=new Date(min+"T00:00:00Z"); const end=new Date(max+"T00:00:00Z"); let g=0;
  while(d<=end && g<400){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); g++; } return out; }
function chartSVG(cbd,{spark=false,band=null}={}){
  if(!ALLDAYS.length) return "";
  const w=spark?132:680,h=spark?26:96,padX=spark?1:10,padTop=spark?2:8,padBot=spark?2:16;
  const innerW=w-padX*2,innerH=h-padTop-padBot,n=ALLDAYS.length,bw=innerW/n;
  const vals=ALLDAYS.map(d=>cbd[d]||0),maxV=Math.max(1,...vals),baseY=h-padBot;
  let bars="";
  ALLDAYS.forEach((d,i)=>{ const v=cbd[d]||0; if(!v)return;
    const bh=Math.max(spark?1.5:2, v/maxV*innerH), x=padX+i*bw+bw*0.16, y=baseY-bh;
    bars+=`<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${bh.toFixed(1)}" rx="1">`+
          (spark?"":`<title>${d}: ${v} commit${v==1?"":"s"}</title>`)+`</rect>`; });
  let extra="";
  if(!spark && band && band[0] && band[1]){
    const i0=ALLDAYS.findIndex(d=>d>=band[0]);
    let i1=-1; for(let i=ALLDAYS.length-1;i>=0;i--){ if(ALLDAYS[i]<=band[1]){ i1=i; break; } }
    if(i0>=0 && i1>=i0)
      extra+=`<rect class="band" x="${(padX+i0*bw).toFixed(1)}" y="${padTop}" width="${((i1-i0+1)*bw).toFixed(1)}" height="${(baseY-padTop).toFixed(1)}"/>`;
  }
  if(!spark){ const ti=ALLDAYS.indexOf(TODAY), tx=ti>=0?padX+ti*bw+bw*0.5:padX+innerW;
    extra+=`<line class="axis-base" x1="${padX}" y1="${baseY+0.5}" x2="${padX+innerW}" y2="${baseY+0.5}"/>`;
    extra+=`<line class="today-line" x1="${tx.toFixed(1)}" y1="${padTop}" x2="${tx.toFixed(1)}" y2="${baseY}"/>`;
    extra+=`<text class="axis-label" x="${padX}" y="${h-4}">${ALLDAYS[0]}</text>`;
    extra+=`<text class="axis-label" x="${padX+innerW}" y="${h-4}" text-anchor="end">${ALLDAYS[ALLDAYS.length-1]}</text>`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="commits per day">${extra}${bars}</svg>`;
}
function peak(cbd){ return Math.max(0, ...Object.values(cbd||{})); }
function rateStats(cbd){
  const days = Object.keys(cbd||{}).sort(); if (!days.length) return null;
  const total = Object.values(cbd).reduce((a,b)=>a+b,0);
  const first = new Date(days[0]+"T00:00:00Z"), last = new Date(days[days.length-1]+"T00:00:00Z");
  const spanDays = Math.max(1, Math.round((last-first)/86400000) + 1);
  const perWeek = Math.round(total / (spanDays/7) * 10) / 10;
  const cutoff = new Date(Date.now() - 14*86400000).toISOString().slice(0,10);
  const last14 = days.filter(d=>d>=cutoff).reduce((s,d)=>s+cbd[d],0);
  return { perWeek, last14, spanDays };
}

/* ---------- course overview (instructor) ----------
   One row per project, one column per sprint (oldest → newest). Each cell: hours
   against the sprint's target, goals done, the student's mood, and whether the
   retrospective is in; the cell is tinted by the instructor's rating. Loaded on
   demand (4 small reads per project per sprint) and cached until Refresh or a
   course change. */
function overviewViewHTML(){
  return `<div class="view" id="view-overview">
    <div id="overview-body">${overviewBodyHTML()}</div></div>`;
}
async function ensureOverview(){
  if(!COURSE || (OVERVIEW && OVERVIEW.course===COURSE.id)) return;
  const course=COURSE.id, cells={};
  const body=$("overview-body"); if(body) body.innerHTML=`<p class="muted">Loading the course overview…</p>`;
  try{
    await Promise.all(SPRINTS.map(async sp=>{
      const entries={};
      (await getDocs(collection(db,`${cpath()}/sprints/${sp.id}/entries`))).forEach(d=>entries[d.id]=d.data());
      await Promise.all(TEAMS.map(async t=>{
        const base=`${cpath()}/sprints/${sp.id}/entries/${t.id}`;
        const [goals,time,retro]=await Promise.all([getDocs(collection(db,`${base}/goals`)),
          getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/retro`))]);
        const rs=retro.docs.map(d=>d.data()), e=entries[t.id]||{};
        (cells[t.id] ||= {})[sp.id]={
          hours: time.docs.reduce((n,d)=>n+(Number(d.data().hours)||0),0),
          goals: goals.size, done: goals.docs.filter(d=>d.data().result==="done"||d.data().completed).length,
          partial: goals.docs.filter(d=>d.data().result==="partial").length,
          notdone: goals.docs.filter(d=>d.data().result==="notdone").length,
          submitted: rs.length>0, mood: rs.length ? rs[0].mood : null,
          wentWell: rs.length ? rs[0].wentWell||"" : "", improve: rs.length ? rs[0].improve||"" : "",
          status: e.status||"unrated", review: e.review||"", reviewDate: e.reviewDate||"" };
      }));
    }));
    if(!COURSE || COURSE.id!==course) return;   // switched course while loading
    OVERVIEW={ course, loadedAt:new Date(), cells };
  }catch(err){ console.error("overview load failed:", err); if(body) body.innerHTML=`<p class="muted">Couldn't load the overview: ${esc(err.message||err)}</p>`; return; }
  const el=$("overview-body"); if(el) el.innerHTML=overviewBodyHTML();
}
function overviewBodyHTML(){
  if(!SPRINTS.length) return `<p class="muted">No sprints yet.</p>`;
  if(!TEAMS.length) return `<p class="muted">No ${L().units} yet.</p>`;
  if(!OVERVIEW || OVERVIEW.course!==COURSE.id) return `<p class="muted">Loading the course overview…</p>`;
  const fmtH=n=>String(Math.round(n*10)/10);
  const teams=[...TEAMS].sort((a,b)=>(a.team||"").localeCompare(b.team||""));
  const head=SPRINTS.map(sp=>{ const ph=sprintPhase(sp);
    return `<th class="ov-sprint ${ph}"><span>${esc(sp.name||("Sprint "+sp.n))}</span>
      <small>${sp.start&&sp.end?`${esc(fmtD(sp.start))} – ${esc(fmtD(sp.end))}`:""}${ph==="current"?" · current":ph==="grace"?" · grace day":""}</small>
      <small>${esc(String(targetOf(sp)))} hr target</small></th>`; }).join("");
  const rows=teams.map(t=>{
    const row=OVERVIEW.cells[t.id]||{}, total=SPRINTS.reduce((n,sp)=>n+((row[sp.id]||{}).hours||0),0);
    return `<tr><th class="ov-name" scope="row"><span class="tm">${esc(t.team)}</span>
        ${t.project&&t.project!==t.team?`<span class="pj">${esc(t.project)}</span>`:""}
        <span class="ov-total">${fmtH(total)} hrs total</span></th>
      ${SPRINTS.map(sp=>{ const c=row[sp.id], ph=sprintPhase(sp);
        if(!c || ph==="upcoming") return `<td class="ov-cell empty"><span class="muted">—</span></td>`;
        const target=targetOf(sp), ok=c.hours>=target, m=moodOf(c.mood);
        const sub=c.submitted?`<span class="ov-sub yes" title="Retrospective submitted">✓ Submitted</span>`
          : ph==="closed"?`<span class="ov-sub missed" title="Sprint closed without a retrospective">Not submitted</span>`
          : ph==="grace"?`<span class="ov-sub due" title="Grace day — retrospective still open">Due today</span>`
          : `<span class="ov-sub open">In progress</span>`;
        return `<td class="ov-cell ${c.status}"><button class="ov-btn" data-ov-open="${t.id}:${sp.id}" title="Open ${esc(t.team)} · ${esc(sp.name||"")}">
          <span class="ov-hours ${ok?"ok":"low"}"><b>${fmtH(c.hours)}</b>/${esc(String(target))} h</span>
          <span class="ov-goals">${c.goals?`${c.done}/${c.goals} goals`:`<span class="muted">no goals</span>`}</span>
          <span class="ov-foot">${sub}${m?`<span class="ov-mood" title="Felt: ${esc(m.l)}">${m.e}</span>`:""}</span>
          ${c.reviewDate?`<span class="ov-review">Review ${esc(dowOf(c.reviewDate))} ${esc(fmtD(c.reviewDate))}</span>`:""}
        </button></td>`; }).join("")}</tr>`;
  }).join("");
  return `<div class="tablewrap ov-wrap"><table class="ov-table"><thead><tr><th class="ov-name">${L().Unit}</th>${head}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="muted ov-legend">${["healthy","watch","risk","noaccess"].map(k=>`<span class="ov-key ${k}"></span>${esc(STATUS_LABEL[k])}`).join(" · ")}
      · Updated ${esc(fmtWhen(OVERVIEW.loadedAt))}</p>`;
}
// CSV of the overview for grading: one row per project per sprint (upcoming sprints
// left out). UTF-8 with a BOM so Excel keeps emoji and accented names intact.
async function exportOverviewCSV(){
  await ensureOverview();
  if(!OVERVIEW || OVERVIEW.course!==COURSE.id){ alert("The overview hasn't loaded yet. Try again in a moment."); return; }
  const cols=["Course","Student","Email","Project","Sprint","Start","End","Target hours","Hours logged","Met target",
    "Goals","Goals done","Goals partly done","Goals not done","Retrospective submitted","Mood (1-5)","Mood",
    "What went well","Could be improved","Rating","Review","Review date","Commits in sprint","Commits after sprint end"];
  const cell=v=>{ const t=v==null?"":String(v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const lines=[cols.map(cell).join(",")];
  const teams=[...TEAMS].sort((a,b)=>(a.team||"").localeCompare(b.team||""));
  for(const t of teams){
    const cbd=(t.act&&t.act.ok&&t.act.commits_by_day)||null;
    for(const sp of SPRINTS){
      if(sprintPhase(sp)==="upcoming") continue;
      const c=(OVERVIEW.cells[t.id]||{})[sp.id]; if(!c) continue;
      const target=targetOf(sp), m=moodOf(c.mood);
      const inSprint=cbd&&sp.start&&sp.end ? Object.values(sliceCbd(cbd,sp.start,sp.end)).reduce((a,b)=>a+b,0) : "";
      const after=cbd&&sp.end ? Object.keys(cbd).filter(d=>d>sp.end).reduce((a,d)=>a+cbd[d],0) : "";
      lines.push([COURSE.code||COURSE.id, t.team||"", (t.studentEmails||[]).join("; "), t.project||"",
        sp.name||("Sprint "+sp.n), sp.start||"", sp.end||"", target, Math.round(c.hours*100)/100, c.hours>=target?"Yes":"No",
        c.goals, c.done, c.partial, c.notdone, c.submitted?"Yes":"No", c.mood||"", m?m.l:"",
        c.wentWell, c.improve, c.status==="unrated"?"":STATUS_LABEL[c.status], c.review, c.reviewDate,
        inSprint, after].map(cell).join(","));
    }
  }
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${(COURSE.code||COURSE.id).replace(/[^\w-]+/g,"_")}-sprints-${TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- sprint flow (student) ----------
   Not started → (add a goal) → In progress → (submit wrap-up) → Submitted.
   Time logging unlocks with the first goal; submitting locks the sprint for the
   student until the instructor reopens it. A past sprint is closed either way. */
const MOODS=[{v:1,e:"😞",l:"Rough"},{v:2,e:"😕",l:"Not great"},{v:3,e:"😐",l:"Okay"},{v:4,e:"🙂",l:"Good"},{v:5,e:"😄",l:"Great"}];
const RESULTS={done:"Done",partial:"Partly done",notdone:"Not done"};
function moodOf(v){ return MOODS.find(m=>m.v===Number(v)); }
function myGoals(tid){ return (GOALS[tid]||[]).filter(g=>g.studentEmail===USER_EMAIL); }
function myRetro(tid){ return (RETROS[tid]||[]).find(r=>r.studentEmail===USER_EMAIL); }
function canEdit(tid){ return studentView() && !frozen() && !myRetro(tid); }
function sprintStage(tid){
  if(myRetro(tid)) return "Submitted";
  if(frozen()) return "Closed";
  return myGoals(tid).length ? "In progress" : "Not started";
}
function resultPill(r){ return r?`<span class="result ${r}">${RESULTS[r]}</span>`:""; }
function goalsHTML(t){
  const goals=GOALS[t.id]||[], edit=canEdit(t.id);

  return `<div class="card structured-card" id="goals-${t.id}"><div class="notes-head"><h2 style="border:0;margin:0;padding:0">Sprint Goals</h2></div>

async function submitSprint(tid){
  const err=$("wrapErr-"+tid), goals=myGoals(tid);
  const results=goals.map(g=>({g, v:(document.querySelector(`input[name="res-${g.id}"]:checked`)||{}).value}));
  const mood=Number((document.querySelector(`input[name="mood-${tid}"]:checked`)||{}).value||0);
  const wentWell=fval("well-"+tid), improve=fval("improve-"+tid);
  const miss=[];
  if(results.some(x=>!x.v)) miss.push("a result for every goal");
  if(!mood) miss.push("how the sprint felt");
  if(!wentWell) miss.push("what went well");
  if(!improve) miss.push("what could be improved");
  if(miss.length){ if(err) err.textContent="Still needed: "+miss.join(", ")+"."; return; }
  try{
    // Goal results first: once the wrap-up exists the rules lock the goals.
    await Promise.all(results.filter(x=>x.g.result!==x.v).map(x=>
      setDoc(doc(db,`${sprintEntryPath(tid)}/goals/${x.g.id}`), {result:x.v, updatedAt:serverTimestamp()}, {merge:true})));
    await setDoc(doc(db,`${sprintEntryPath(tid)}/retro/${USER_EMAIL}`),
      {studentEmail:USER_EMAIL, mood, wentWell, improve, submittedAt:serverTimestamp()});
    await loadEntries(); render(); stay(tid);
  }catch(e){ console.error(e); if(err) err.textContent=e.code+" — "+e.message; }
}
async function reopenSprint(tid,email){
  await deleteDoc(doc(db,`${sprintEntryPath(tid)}/retro/${email}`));
  await loadEntries(); render(); stay(tid);
}
async function setGoalResult(tid,gid,result){
  await setDoc(doc(db,`${sprintEntryPath(tid)}/goals/${gid}`), {result, updatedAt:serverTimestamp()}, {merge:true});
  const goal=(GOALS[tid]||[]).find(x=>x.id===gid); if(goal) goal.result=result;
  render(); stay(tid);
}

// Hours ring on a sprint panel: fills toward the sprint's target hours (set when the
// sprint is created; DEFAULT_TARGET_HOURS if not), red below it, green at or above.
const DEFAULT_TARGET_HOURS=20;
function targetOf(sp){ const n=Number(sp&&sp.targetHours); return n>0 ? n : DEFAULT_TARGET_HOURS; }
function hoursRingSVG(hours, target){
  const HOURS_TARGET=target||DEFAULT_TARGET_HOURS;
  const r=36, c=2*Math.PI*r, known=hours!=null, f=known?Math.min(hours/HOURS_TARGET,1):0;
  const cls=!known?"":hours>=HOURS_TARGET?"ok":"low";
  const label=known?String(Math.round(hours*10)/10):"…";
  return `<svg class="hours-ring ${cls}" viewBox="0 0 96 96" role="img" aria-label="${known?`${label} of ${HOURS_TARGET} hours`:"Loading hours"}">
    <circle class="track" cx="48" cy="48" r="${r}"/>
    ${f>0?`<circle class="arc" cx="48" cy="48" r="${r}" stroke-dasharray="${(c*f).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 48 48)"/>`:""}
    <text class="ring-n" x="48" y="45">${label}</text>
    <text class="ring-l" x="48" y="64">of ${HOURS_TARGET} hrs</text></svg>`;
}
/* ---------- retrospective history (student) ----------

   instructor's rating and review. Reloaded each time the page is opened. */
async function loadRetroHistory(tid){

      getDocs(collection(db,`${base}/goals`)), getDocs(collection(db,`${base}/retro`)), getDocs(collection(db,`${base}/time`))]);
    const rs=retro.docs.map(d=>d.data());

      goals: goals.docs.map(d=>d.data()).filter(g=>IS_ADMIN || g.studentEmail===USER_EMAIL)
        .sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)) };

/* Trends across sprints as small multiples: Mood, Hours and Status each get their own
   chart and y-scale (never a shared dual axis), stacked on the same sprint columns.
   Toggles choose which are shown (remembered per browser). Hovering a column
   highlights it in every chart and shows all three values. */
const TREND_KEYS=["mood","hours","status"];
const STATUS_LEVEL={noaccess:1, risk:2, watch:3, healthy:4};
function trendsOn(){
  try{ const v=JSON.parse(localStorage.getItem("peek:trends")||"null");
    if(Array.isArray(v) && v.some(k=>TREND_KEYS.includes(k))) return v.filter(k=>TREND_KEYS.includes(k)); }catch(e){}
  return [...TREND_KEYS];
}
function toggleTrend(key){
  const on=trendsOn(), next=on.includes(key) ? on.filter(k=>k!==key) : [...on,key];
  if(!next.length) return;   // keep at least one chart
  try{ localStorage.setItem("peek:trends", JSON.stringify(TREND_KEYS.filter(k=>next.includes(k)))); }catch(e){}
  document.querySelectorAll(".rh-trend").forEach(el=>{ const tid=el.dataset.tid; if(RETRO_HISTORY[tid]) el.outerHTML=trendsCardHTML(tid); });
}
const TREND_COL=120;
function trendX(i){ return TREND_COL/2+i*TREND_COL; }
// One small chart. pts: [{v:number|null}] per column; y maps a value to a pixel row.
function trendChartSVG(key, rows, h, y, body, axis, showLabels){
  const w=Math.max(rows.length*TREND_COL, TREND_COL*3), labelH=showLabels?26:0;
  const cols=rows.map((r,i)=>`<rect class="tc-col" data-col="${i}" x="${i*TREND_COL}" y="0" width="${TREND_COL}" height="${h+labelH}"/>`).join("");
  const labels=showLabels ? rows.map((r,i)=>`<text class="tc-x" x="${trendX(i)}" y="${h+18}">${esc(r.sprint.name||("Sprint "+r.sprint.n))}</text>`).join("") : "";
  return `<div class="tc"><div class="tc-axis">${axis}</div>
    <svg class="tc-svg tc-${key}" viewBox="0 0 ${w} ${h+labelH}" style="max-width:${w}px">${cols}${body}${labels}</svg></div>`;
}
function linePath(pts, y){
  let d="", pen=false;
  pts.forEach((v,i)=>{ if(v==null){ pen=false; return; } d+=`${pen?"L":"M"}${trendX(i)} ${y(v).toFixed(1)} `; pen=true; });
  return d;
}
function moodChart(rows, last){
  const h=140, top=34, bot=14, y=m=>top+(h-top-bot)-(m-1)/4*(h-top-bot);
  const vals=rows.map(r=>r.retro&&Number(r.retro.mood)||null);
  const grid=[1,2,3,4,5].map(m=>`<line class="tc-grid" x1="0" x2="100%" y1="${y(m)}" y2="${y(m)}"/>`).join("");
  const d=linePath(vals,y);
  const pts=vals.map((v,i)=>{ if(!v) return ""; const m=moodOf(v);
    return `<circle class="tc-dot mood" cx="${trendX(i)}" cy="${y(v)}" r="5"/><text class="tc-emoji" x="${trendX(i)}" y="${y(v)-11}">${m.e}</text>`; }).join("");
  return trendChartSVG("mood", rows, h, y, `${grid}${d?`<path class="tc-line mood" d="${d}"/>`:""}${pts}`,
    `<b>Mood</b><span>😄 Great</span><span>😞 Rough</span>`, last);
}
function hoursChart(rows, last){
  const h=150, top=22, bot=14;
  const max=Math.max(...rows.map(r=>Math.max(r.hours||0, targetOf(r.sprint))), 1)*1.1;
  const y=v=>top+(h-top-bot)-(v/max)*(h-top-bot);
  const live=rows.map(r=>sprintPhase(r.sprint)==="upcoming"?null:r.hours);
  const grid=[0,0.5,1].map(f=>`<line class="tc-grid" x1="0" x2="100%" y1="${y(max/1.1*f)}" y2="${y(max/1.1*f)}"/>`).join("");
  const target=rows.map((r,i)=>`<line class="tc-target" x1="${i*TREND_COL+14}" x2="${(i+1)*TREND_COL-14}" y1="${y(targetOf(r.sprint))}" y2="${y(targetOf(r.sprint))}"/>`).join("");
  const d=linePath(live,y);
  const lastIdx=live.reduce((a,v,i)=>v==null?a:i,-1);
  const pts=live.map((v,i)=>{ if(v==null) return ""; const ok=v>=targetOf(rows[i].sprint);
    return `<circle class="tc-dot ${ok?"ok":"low"}" cx="${trendX(i)}" cy="${y(v)}" r="5"/>`
      + (i===lastIdx?`<text class="tc-val" x="${trendX(i)}" y="${y(v)-11}">${Math.round(v*10)/10} h</text>`:""); }).join("");
  return trendChartSVG("hours", rows, h, y, `${grid}${target}${d?`<path class="tc-line hours" d="${d}"/>`:""}${pts}`,
    `<b>Hours</b><span><i class="tc-key-target"></i>target</span><span><i class="tc-key ok"></i>met</span><span><i class="tc-key low"></i>under</span>`, last);
}
function statusChart(rows, last){
  const h=120, top=16, bot=16, y=l=>top+(h-top-bot)-(l-1)/3*(h-top-bot);
  const lv=rows.map(r=>STATUS_LEVEL[r.entry.status]||null);
  const grid=[1,2,3,4].map(l=>`<line class="tc-grid" x1="0" x2="100%" y1="${y(l)}" y2="${y(l)}"/>`).join("");
  const d=linePath(lv,y);
  const keyOf=l=>Object.keys(STATUS_LEVEL).find(k=>STATUS_LEVEL[k]===l);
  const pts=lv.map((l,i)=>l?`<circle class="tc-dot st ${keyOf(l)}" cx="${trendX(i)}" cy="${y(l)}" r="6"/>`:"").join("");
  return trendChartSVG("status", rows, h, y, `${grid}${d?`<path class="tc-line status" d="${d}"/>`:""}${pts}`,
    `<b>Status</b>${["healthy","watch","risk","noaccess"].map(k=>`<span><i class="tc-key ${k}"></i>${esc(STATUS_LABEL[k])}</span>`).join("")}`, last);
}
function trendsCardHTML(tid){
  const rows=(RETRO_HISTORY[tid]||[]).filter(r=>sprintPhase(r.sprint)!=="upcoming");
  const on=trendsOn(), names={mood:"Mood", hours:"Hours", status:"Status"};

function retroHistoryHTML(tid){

/* ---------- sprint countdown (student) ----------
   Days left in the current sprint, with what's still to do. Neutral until the last
   URGENT_DAYS days, then amber; the grace day gets its own "last day" banner. The
   retrospective only joins the to-do list once the deadline is close. */
const URGENT_DAYS=2;
function daysLeft(sp){ return Math.round((new Date(sp.end+"T00:00:00Z")-new Date(TODAY+"T00:00:00Z"))/86400000); }
function daysLeftLabel(sp){ const n=daysLeft(sp); return n<=0 ? "Ends today" : n===1 ? "1 day left" : `${n} days left`; }
// x: {hours, goals, submitted} for this student in sprint sp
function countdownBannerHTML(sp, x){
  const ph=sprintPhase(sp);
  if(!sp || !sp.end || !x || x.submitted || (ph!=="current" && ph!=="grace")) return "";
  const grace=ph==="grace", urgent=grace || daysLeft(sp)<=URGENT_DAYS, target=targetOf(sp);
  const todo=[];
  if(!x.goals) todo.push("add your sprint goals");
  if(x.hours<target){ const more=Math.round((target-x.hours)*10)/10; todo.push(`log ${more} more hour${more===1?"":"s"} to reach ${target}`); }
  if(urgent) todo.push("submit your retrospective");
  const name=esc(sp.name||("Sprint "+sp.n)), ends=`${esc(dowOf(sp.end))} ${esc(fmtD(sp.end))}`;
  const head=grace ? `<b>${name} · last day to submit</b> — it ended ${ends}`
                   : `<b>${name} · ${esc(daysLeftLabel(sp))}</b>${daysLeft(sp)>0?` — ends ${ends}`:""}`;
  return `<div class="countdown${urgent?" urgent":""}"><span class="cd-days">${grace?"!":Math.max(daysLeft(sp),0)}</span>
    <span>${head}${todo.length?`<br><span class="cd-todo">Still to do: ${todo.join(" · ")}</span>`:""}</span></div>`;
}
// Dashboard: banners for the grace-day sprint (if any) and the current one, from SPRINT_STATS.
function dashboardCountdownHTML(t){
  const stats=SPRINT_STATS[t.id]; if(!stats) return "";
  return SPRINTS.filter(sp=>["grace","current"].includes(sprintPhase(sp)))
    .map(sp=>{ const x=stats[sp.id]; return countdownBannerHTML(sp, x && {...x, goals:x.mine}); }).join("");
}
function sprintGridHTML(t){

          <span><b>${x?`${x.done}/${x.goals}`:"…"}</b>goals done</span>
          <span><b>${commits==null?"—":commits}</b>commits</span></span></span>
      <span class="sp-foot"><span class="sp-foot-l"><span class="pill ${st}"><span class="d"></span>${STATUS_LABEL[st]}</span>
        ${x&&x.newFeedback?`<span class="sp-new">New feedback</span>`:""}</span>
        ${x&&moodOf(x.mood)?`<span class="sp-mood" title="Felt: ${esc(moodOf(x.mood).l)}">${moodOf(x.mood).e}</span>`:""}</span>
      ${(cur||ph==="grace")&&x&&!x.goals&&!x.submitted?`<span class="sp-nudge">Enter goals to get started →</span>`:""}
    </button>`;}).join("")}</div>`;

// Hours, goals and rating for every sprint of one project. Reloaded whenever its
// home view is shown, so the panels reflect anything just logged on a sprint page.
async function loadSprintStats(tid){
  const out={};
  await Promise.all(SPRINTS.map(async sp=>{
    const base=`${cpath()}/sprints/${sp.id}/entries/${tid}`;
    const [e, goals, time, retro, seen]=await Promise.all([getDoc(doc(db,base)),
      getDocs(collection(db,`${base}/goals`)), getDocs(collection(db,`${base}/time`)), getDocs(collection(db,`${base}/retro`)),
      IS_ADMIN ? null : getDoc(doc(db,`${base}/seen/${USER_EMAIL}`))]);
    const ed=e.exists()?e.data():{};
    const fbAt=feedbackMillis(ed);
    const seenAt=seen&&seen.exists()&&seen.data().at&&seen.data().at.toMillis ? seen.data().at.toMillis() : 0;
    const rs=retro.docs.map(d=>d.data()), mine=rs.find(r=>r.studentEmail===USER_EMAIL)||(IS_ADMIN?rs[0]:null);
    out[sp.id]={ status:ed.status||"unrated", newFeedback: !IS_ADMIN && fbAt>seenAt,
      submitted:!!mine, mood:mine?mine.mood:null,
      mine:goals.docs.filter(d=>d.data().studentEmail===USER_EMAIL).length,
      goals:goals.size, done:goals.docs.filter(d=>d.data().result==="done"||d.data().completed).length,
      hours:time.docs.reduce((n,d)=>n+(Number(d.data().hours)||0),0) };
  }));
  SPRINT_STATS[tid]=out;
  const t=TEAMS.find(x=>x.id===tid), el=$("sprint-grid-"+tid), cd=$("countdown-"+tid);
  if(t && el) el.innerHTML=sprintGridHTML(t);
  if(t && cd) cd.innerHTML=dashboardCountdownHTML(t);
  if(t && studentView()){ renderNav(); }   // sidebar dots for new feedback
}
/* "New feedback": the instructor's rating/review stamps entries/{tid}.feedbackAt; the
   student's entries/{tid}/seen/{email}.at records when they last opened that sprint.
   Opening a sprint with newer feedback marks it seen and clears the badge. */
// When the entry's feedback was given. Ratings/reviews saved before feedbackAt existed
// count as given at time 1, so they show as new until the student first opens the sprint.
function feedbackMillis(e){
  if(e.feedbackAt && e.feedbackAt.toMillis) return e.feedbackAt.toMillis();
  return (e.review || (e.status && e.status!=="unrated")) ? 1 : 0;
}
function hasNewFeedback(tid,sid){ return !!(((SPRINT_STATS[tid]||{})[sid]||{}).newFeedback); }
async function markFeedbackSeen(tid){
  if(IS_ADMIN || !SPRINT) return;
  if(!feedbackMillis(ENTRIES[tid]||{}) || ((SPRINT_STATS[tid]||{})[SPRINT.id]||{}).newFeedback===false) return;
  try{
    await setDoc(doc(db,`${sprintEntryPath(tid)}/seen/${USER_EMAIL}`), { at:serverTimestamp() });
    const x=(SPRINT_STATS[tid]||{})[SPRINT.id]; if(x) x.newFeedback=false;
    renderNav();
  }catch(e){ console.error("mark seen failed:", e); }

// Sprint-entry fields autosave to sprints/{sid}/entries/{tid}. Status is mirrored onto the
// team doc when the current sprint is the one being edited, so the daily collector and the
// generated .docx keep agreeing with what the app shows.
function wireSprintFields(){
  document.querySelectorAll("[data-sp]").forEach(el=>{
    const [tid, field] = el.dataset.sp.split(":");
    const commit = async () => {
      if(!SPRINT) return;
      const val = el.value;
      ENTRIES[tid] = { ...(ENTRIES[tid]||{}), [field]: val };
      try{
        // A new rating or review is feedback the student hasn't seen yet.
        const fb = (field==="status" || field==="review") && val ? { feedbackAt: serverTimestamp() } : {};
        await setDoc(doc(db, `${cpath()}/sprints/${SPRINT.id}/entries/${tid}`),
          { [field]: val, ...fb, updatedAt: serverTimestamp() }, { merge:true });
        if(field==="status" && !isPast(SPRINT))
          await setDoc(doc(db, `${cpath()}/teams/${tid}`), { status: val }, { merge:true });
        if(field==="status"){
          const t=TEAMS.find(x=>x.id===tid); if(t && !isPast(SPRINT)) t.status=val;
          // Status shows in the nav dot, the dashboard tiles and the table, so redraw
          // everything rather than leaving those stale until the next load.
          renderNav(); render(); show(location.hash.slice(1)||"dashboard");
        }
        flash("saved-"+tid);
      }catch(e){ console.error(e); }
    };
    if(el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && el.type!=="date")){
      let tmr; el.addEventListener("input", ()=>{ clearTimeout(tmr); tmr=setTimeout(commit,600); });
    } else {
      el.addEventListener("change", commit);   // dates and the status select save immediately
    }
  });
}

function wireScheduleDays(){
  const box=$("schedule_days"), label=$("schedule_days_label"); if(!box||!label) return;
  const names={"0":"Sun","1":"Mon","2":"Tue","3":"Wed","4":"Thu","5":"Fri","6":"Sat"};
  box.querySelectorAll("input").forEach(input=>input.addEventListener("change",()=>{
    const daily=box.querySelector('input[value="daily"]');
    if(input.value==="daily"&&input.checked) box.querySelectorAll('input:not([value="daily"])').forEach(x=>x.checked=false);

    label.textContent=selected.includes("daily")?"Every day":selected.map(x=>names[x]).join(", ")||"Choose days";
  }));

  const ro = e.target.closest("[data-reopen]"); if (ro) { const [tid,...em]=ro.dataset.reopen.split(":"); await reopenSprint(tid,em.join(":")); return; }
  if (e.target.closest("[data-theme-toggle]")) { $("themeBtn").click(); return; }
  if (e.target.closest("[data-sync]")) { $("syncBtn").click(); return; }
  if (e.target.closest("[data-mode-toggle]")) { $("modeToggle").click(); return; }
  const acct = e.target.closest("[data-account-toggle]");
  if (acct) { const box=acct.closest(".account"), open=!box.classList.contains("open");
    closeAccountMenus(); box.classList.toggle("open",open); acct.setAttribute("aria-expanded",open); return; }

  const ov = e.target.closest("[data-ov-open]"); if (ov) { const [tid,sid]=ov.dataset.ovOpen.split(":"); await openTeamSprint(tid,sid); return; }
  if (e.target.closest("[data-ov-refresh]")) { OVERVIEW=null; await ensureOverview(); return; }
  if (e.target.closest("[data-ov-export]")) { await exportOverviewCSV(); return; }
  const tg = e.target.closest("[data-trend]"); if (tg) { toggleTrend(tg.dataset.trend); return; }
  const sp = e.target.closest("[data-sprint-open]"); if (sp) { const [tid,sid]=sp.dataset.sprintOpen.split(":"); await openSprint(tid,sid); return; }
  const addList=e.target.closest("[data-list-add]"); if(addList){ const [tid,field]=addList.dataset.listAdd.split(":"); await addProjectListItem(tid,field); return; }
  const removeList=e.target.closest("[data-list-remove]"); if(removeList){ const [tid,field,index]=removeList.dataset.listRemove.split(":"); await removeProjectListItem(tid,field,index); return; }
  const addGoalBtn=e.target.closest("[data-goal-add]"); if(addGoalBtn){ await addGoal(addGoalBtn.dataset.goalAdd); return; }
  const removeGoalBtn=e.target.closest("[data-goal-remove]"); if(removeGoalBtn){ const [tid,gid]=removeGoalBtn.dataset.goalRemove.split(":"); await removeGoal(tid,gid); return; }
  const addTimeBtn=e.target.closest("[data-time-add]"); if(addTimeBtn){ await addTime(addTimeBtn.dataset.timeAdd); return; }
  const editTimeBtn=e.target.closest("[data-time-edit]"); if(editTimeBtn){ openTimeEdit(editTimeBtn.dataset.timeEdit); return; }
  const saveTimeBtn=e.target.closest("[data-time-save]"); if(saveTimeBtn){ const [tid,timeId]=saveTimeBtn.dataset.timeSave.split(":"); await saveTimeEdit(tid,timeId); return; }
  if(e.target.closest("[data-time-cancel]")){ cancelTimeEdit(); return; }
  const removeTimeBtn=e.target.closest("[data-time-remove]"); if(removeTimeBtn){ const [tid,timeId]=removeTimeBtn.dataset.timeRemove.split(":"); await removeTime(tid,timeId); return; }
  const m = e.target.closest("[data-mact]"); if (!m) return;
  const act = m.dataset.mact, tid = m.dataset.tid;
  // team actions
  if (act === "add")         openForm(null);
  else if (act === "edit")   openForm(TEAMS.find(t=>t.id===tid));
  else if (act === "cancel"){ const f=$("teamForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "sync-dismiss"){ SYNC_REPORT=null; render(); renderSyncInfo(); show("dashboard"); }
  else if (act === "save")   await saveTeam(tid);
  else if (act === "remove"){ if (confirm("Remove this team? Its collected activity is deleted too. This can't be undone.")) await removeTeam(tid); }
  // course actions
  // sprint actions
  else if (act === "schedule-save") await saveSchedule();
  else if (act === "roster-add")    await addToRoster();
  else if (act === "roster-remove") await removeFromRoster(m.dataset.email);
  else if (act === "setup-done")    await finishSetup(m.dataset.tid);
  else if (act === "own-project-add") await createOwnProject();
  else if (act === "sprint-add")    openSprintForm(null);
  else if (act === "sprint-edit")   openSprintForm(SPRINTS.find(sp=>sp.id===m.dataset.sid));
  else if (act === "sprint-cancel"){ const f=$("sprintForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "sprint-save")   await saveSprint(m.dataset.sid);
  else if (act === "sprint-seed")   await seedFirstSprint();
  else if (act === "sprint-unlock"){ UNLOCKED=true; render(); show(location.hash.slice(1)||"dashboard"); }
  else if (act === "sprint-remove"){
    if (confirm("Remove this sprint and every goal, role, status and review note recorded in it? This can't be undone."))
      await removeSprint(m.dataset.sid);
  }
  else if (act === "course-add")    openCourseForm(null);
  else if (act === "course-edit")   openCourseForm(COURSE);
  else if (act === "course-cancel"){ const f=$("courseForm"); if(f){f.hidden=true; f.innerHTML="";} }
  else if (act === "course-save")   await saveCourse(m.dataset.cid);
  else if (act === "course-remove"){
    if (confirm("Remove this ENTIRE course and all its teams, activity, and notes? This can't be undone.")) await removeCourse(m.dataset.cid);
  }
}
function openForm(t){ const f=$("teamForm"); f.hidden=false; f.innerHTML=teamFormHTML(t); wireProjectTypeFields(); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }
function wireProjectTypeFields(){
  const type=$("f_type"), name=$("f_team"), members=$("f_members"); if(!type||!name||!members) return;
  const apply=()=>{
    const solo=type.value==="solo";
    if(solo) members.value=name.value;
    members.disabled=solo;
    members.title=solo?"Solo projects use the project name as the member name.":"";
  };
  type.addEventListener("change",apply);
  name.addEventListener("input",()=>{ if(type.value==="solo") members.value=name.value; });
  apply();

function fval(id){ const el=$(id); return el ? el.value.trim() : ""; }
function slugId(name){
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "team";
  return base + "-" + Date.now().toString(36).slice(-4);
}
/* ---------- roster ----------
   course.studentEmails is the enrollment list the instructor keeps; a team's
   studentEmails is the subset assigned to it. Membership is instructor-written,
   except that in a solo course a student creates their own one-person project. */
function roster(){ return (COURSE && COURSE.studentEmails) || []; }
function teamOfEmail(em){ return TEAMS.find(t=>(t.studentEmails||[]).includes(em)) || null; }
// Projects created before setup tracking existed are judged by what they already have,
// so nobody is sent back through setup for work they already did.
function isSetUp(t){
  if(t.setupComplete===true) return true;
  if(t.setupComplete===false) return false;
  return !!(t.github && projectInfo(t).concept);
}
async function saveRoster(emails){
  const next=[...new Set(emails)].sort();
  await setDoc(doc(db,cpath()), {studentEmails:next}, {merge:true});
  if(COURSE) COURSE.studentEmails=next;
  await syncEnrollments();
}
/* One small doc per enrolled student (enrollments/{email}) carrying just the course
   label. Students can't read the course doc (it holds the whole roster), so this is
   how they find a course they're enrolled in before they have a project. Kept in step
   with course.studentEmails on every save and course load, so it self-heals. */
async function syncEnrollments(){
  if(!IS_ADMIN || !COURSE) return;
  const base=`${cpath()}/enrollments`;
  const want={courseId:COURSE.id, ownerUid:UID, courseCode:COURSE.code||COURSE.id,
    courseName:COURSE.name||COURSE.code||COURSE.id, courseType:COURSE.type||"team"};
  const have={}; (await getDocs(collection(db,base))).forEach(d=>have[d.id]=d.data());
  const emails=new Set(roster()), ops=[];
  emails.forEach(em=>{
    const h=have[em];
    if(!h || Object.keys(want).some(k=>h[k]!==want[k]) || h.email!==em)
      ops.push(setDoc(doc(db,`${base}/${em}`), {...want, email:em}));
  });
  Object.keys(have).forEach(em=>{ if(!emails.has(em)) ops.push(deleteDoc(doc(db,`${base}/${em}`))); });
  await Promise.all(ops);
}
async function addToRoster(){
  const err=$("rosterErr"); if(err) err.textContent="";
  const added=parseStudentEmails(fval("rosterAdd"));
  if(!added.length){ if(err) err.textContent="Enter at least one email address."; return; }
  if(!validStudentEmails(added)){ if(err) err.textContent="Use only valid @student.neumont.edu addresses."; return; }
  try{ await saveRoster([...roster(),...added]); await loadCourse(COURSE.id); show("manage"); }
  catch(e){ console.error(e); if(err) err.textContent = e.code+" — "+e.message; }
}
async function removeFromRoster(em){
  const t=teamOfEmail(em);
  if(t && !confirm(`${em} is assigned to ${t.team}. Remove them from the course and from that ${L().unit}?`)) return;
  try{
    if(t){
      const next=(t.studentEmails||[]).filter(x=>x!==em);
      await setDoc(doc(db,`${cpath()}/teams/${t.id}`), {studentEmails:next, updatedAt:serverTimestamp()}, {merge:true});
    }
    await saveRoster(roster().filter(x=>x!==em));
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); alert("Couldn't remove: " + (e.message||e)); }
}

function validStudentEmails(emails){ return emails.every(x=>/^[^@\s]+@student\.neumont\.edu$/.test(x)); }
async function saveTeam(tid){

async function saveSchedule(){
  const enabled=fval("schedule_enabled")==="true",
    weekdays=[...document.querySelectorAll("#schedule_days input:checked")].map(x=>x.value),
    time=fval("schedule_time"), timezone=fval("schedule_timezone");
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){ alert("Choose a valid sync time."); return; }
  if(!weekdays.length){ alert("Choose at least one sync day."); return; }
  try{
    const next={...SYNC_SCHEDULE,enabled,weekdays,time,timezone,updatedAt:serverTimestamp()};
    delete next.weekday;
    await setDoc(doc(db,`users/${UID}`),{syncSchedule:next},{merge:true});
    SYNC_SCHEDULE={...next,updatedAt:null};
    render(); show("manage");
  }catch(e){ console.error(e); alert("Couldn't save the schedule: "+(e.message||e)); }

function openSprintForm(sp){ const f=$("sprintForm"); if(!f) return;
  f.hidden=false; f.innerHTML=sprintFormHTML(sp||null); f.scrollIntoView({behavior:"smooth", block:"nearest"}); }

async function saveSprint(sid){
  const name=fval("sp_name"), start=fval("sp_start"), end=fval("sp_end"), targetHours=Number(fval("sp_target"));
  const err=$("sprintErr");
  if(!start || !end){ if(err) err.textContent="Start and end dates are required."; return; }
  if(!(targetHours>0)){ if(err) err.textContent="Target hours must be a number greater than zero."; return; }
  if(end < start){ if(err) err.textContent="End date must fall on or after the start date."; return; }
  try{
    if(sid){                                    // editing the current sprint's default window
      const cur = SPRINTS.find(x=>x.id===sid) || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}`), { name: name||cur.name||("Sprint "+(cur.n||"")), start, end, targetHours }, { merge:true });
    } else {
      const prev = lastSprint();
      const n = SPRINTS.length ? Math.max(...SPRINTS.map(x=>x.n||0))+1 : 1;
      const nsid = "s"+n;
      await setDoc(doc(db, `${cpath()}/sprints/${nsid}`),
        { n, name: name||("Sprint "+n), start, end, targetHours, createdAt: serverTimestamp() });
      // Carry roles forward.
      let prevEntries={};
      if(prev){
        const snap = await getDocs(collection(db, `${cpath()}/sprints/${prev.id}/entries`));
        snap.forEach(d=>prevEntries[d.id]=d.data());
      }
      for(const t of TEAMS){
        const pe = prevEntries[t.id] || {};
        await setDoc(doc(db, `${cpath()}/sprints/${nsid}/entries/${t.id}`), {
          po:pe.po||"", sm:pe.sm||"",
          status: pe.status || t.status || "unrated",
          goal:"", review:"", updatedAt: serverTimestamp()
        });
      }
      try { localStorage.setItem(sprintKey(), nsid); } catch(e){}
    }
    const f=$("sprintForm"); if(f){ f.hidden=true; f.innerHTML=""; }
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); if(err) err.textContent = e.code+" — "+e.message; }
}

async function removeSprint(sid){
  try{
    const snap = await getDocs(collection(db, `${cpath()}/sprints/${sid}/entries`));
    for(const d of snap.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(db, `${cpath()}/sprints/${sid}`));
    try { localStorage.removeItem(sprintKey()); } catch(e){}
    await loadCourse(COURSE.id); show("manage");
  }catch(e){ console.error(e); alert("Couldn't remove sprint: " + (e.message||e)); }
}

// One-time fold of the pre-sprint fields (team goal, roles, status, review note) into Sprint 1
// so nothing already written is orphaned when the per-sprint record starts.
async function seedFirstSprint(){
  if(SPRINTS.length) return;
  let first="";
  TEAMS.forEach(t=>{ const days=Object.keys((t.act&&t.act.commits_by_day)||{}); days.sort();
    if(days.length && (!first || days[0]<first)) first=days[0]; });
  const start = first || TODAY, end = TODAY, sid="s1";
  try{
    await setDoc(doc(db, `${cpath()}/sprints/${sid}`),
      { n:1, name:"Sprint 1", start, end, createdAt: serverTimestamp() });
    for(const t of TEAMS){
      const sp = t.sprint || {}, nt = NOTES[t.id] || {};
      await setDoc(doc(db, `${cpath()}/sprints/${sid}/entries/${t.id}`), {
        po:sp.po||"", sm:sp.sm||"", devs:sp.devs||"", hours:sp.hours||"",
        start, end, status: t.status||"unrated",
        goal: t.objectives || sp.goal || "", review: nt.review || "", updatedAt: serverTimestamp()
      });
    }
    try { localStorage.setItem(sprintKey(), sid); } catch(e){}
    await loadCourse(COURSE.id); show("dashboard");
  }catch(e){ console.error(e); alert("Couldn't create Sprint 1: " + (e.message||e)); }
}

function todayLabel(){
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d=new Date(); return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

function courseId(code){
  let base = code.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "course";
  const ids = new Set(COURSES.map(c=>c.id)); let id=base, i=2;
  while (ids.has(id)){ id = base+"-"+i; i++; }
  return id;

  const code=fval("c_code"), name=fval("c_name"), term=fval("c_term"), report=fval("c_report"), type=fval("c_type")||"team";

async function removeCourse(cid){
  try {
    const spSnap = await getDocs(collection(db, `users/${UID}/courses/${cid}/sprints`));
    for (const sp of spSnap.docs){
      const eSnap = await getDocs(collection(sp.ref, "entries"));
      for (const e of eSnap.docs){ await deleteDoc(e.ref); }
      await deleteDoc(sp.ref);
    }
    for (const sub of ["teams","notes"]){
      const snap = await getDocs(collection(db, `users/${UID}/courses/${cid}/${sub}`));
      for (const d of snap.docs){ await deleteDoc(d.ref); }
    }
    await deleteDoc(doc(db, `users/${UID}/courses/${cid}`));
    await loadWorkspace();
    if (COURSES.length){ await loadCourse(COURSES[0].id); show("manage"); }
    else renderNoCourses();
  } catch(e){ console.error(e); alert("Couldn't remove course: " + (e.message||e)); }
}
