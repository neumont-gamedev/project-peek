/* ---------- routing + theme ---------- */
// Re-show after an edit: keep the sub-view (sprint page, summary) the user was on.
function stay(tid){ const h=location.hash.slice(1); show(h.split("__")[0]===tid ? h : tid); }
function markNav(view){
  document.querySelectorAll(".icon-circle[data-summary]").forEach(b=>b.classList.toggle("on", view.endsWith("__summary")));
  const navView=studentView() ? view : view.split("__")[0];
  const onSprint=view.endsWith("__sprint") && SPRINT;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",
    b.dataset.sprintNav ? !!onSprint && b.dataset.sprintNav===`${view.split("__")[0]}:${SPRINT.id}`
      : b.dataset.view===navView && !b.dataset.course));
}
function show(view){
  // Students have no course dashboard; anything unknown lands on their first project.
  if(studentView() && TEAMS.length && !document.getElementById("view-"+view)) view=TEAMS[0].id;
  // Switching project (picker or link) rebuilds the student nav for that project.
  if(studentView() && $("projectSel").value!==view.split("__")[0] && TEAMS.some(t=>t.id===view.split("__")[0])){
    history.replaceState(null,"","#"+view); renderNav();
  }
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  (document.getElementById("view-"+view)||document.getElementById("view-dashboard"))?.classList.add("active");
  markNav(view);
  setPageTitle(view);
  if(view==="overview" && instructorView()) ensureOverview();
  if(studentView() && view.endsWith("__sprint")) markFeedbackSeen(view.split("__")[0]);
  if(studentView() && view.endsWith("__retros")) loadRetroHistory(view.split("__")[0]);
  if(studentView() && document.getElementById("sprint-grid-"+view))
    loadSprintStats(view).catch(e=>console.error("sprint stats:", e));
  window.scrollTo({top:0});
  if(location.hash.slice(1)!==view) history.replaceState(null,"","#"+view);
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)||"dashboard"));
$("nav").addEventListener("click", async e=>{
  const sn=e.target.closest("button[data-sprint-nav]");
  if(sn){ const [tid,sid]=sn.dataset.sprintNav.split(":"); await openSprint(tid,sid); return; }
  const b=e.target.closest("button[data-view]"); if(!b) return;
  if(b.dataset.course){ history.replaceState(null,"","#"+b.dataset.view); await loadCourse(b.dataset.course); return; }
  show(b.dataset.view); });
$("main").addEventListener("click", onMainClick);
$("main").addEventListener("pointerover", e=>{ const col=e.target.closest(".tc-col"); const card=e.target.closest(".rh-trend");
  if(card) trendHover(card, col ? Number(col.dataset.col) : null); });
$("main").addEventListener("pointerout", e=>{ const card=e.target.closest(".rh-trend");
  if(card && !card.contains(e.relatedTarget)) trendHover(card, null); });
$("projectSel").onchange = e => show(e.target.value);
function closeAccountMenus(){ document.querySelectorAll(".account.open").forEach(a=>{ a.classList.remove("open");
  a.querySelector("[data-account-toggle]")?.setAttribute("aria-expanded","false"); }); }
document.addEventListener("click", e=>{ if(!e.target.closest(".account")) closeAccountMenus(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeAccountMenus(); if(e.target.closest && e.target.closest(".time-edit")) cancelTimeEdit(); } });
$("main").addEventListener("keydown", e=>{   // Enter in an add field = click its Add button
  if(e.key!=="Enter" || e.target.tagName!=="INPUT") return;
  const btn=e.target.closest(".add-group, .entry-form")?.querySelector("[data-list-add],[data-goal-add],[data-time-add],[data-time-save]");
  if(btn){ e.preventDefault(); btn.click(); }
});
$("main").addEventListener("change", async e=>{   // goal status dropdown (student during the sprint, instructor on review)
  const sel=e.target.closest("[data-goal-result]"); if(!sel) return;
  const [tid,gid]=sel.dataset.goalResult.split(":");
  try{ await setGoalResult(tid,gid,sel.value); }catch(err){ console.error(err); alert("Couldn't save: "+(err.message||err)); }
});   // delegated: team + course actions (works on all views)
const root=document.documentElement;
$("modeToggle").onclick=()=>{
  if(!IS_ADMIN) return;
  PREVIEW_STUDENT=!PREVIEW_STUDENT;
  applyModeChrome(); renderNav(); render(); show("dashboard");
};
$("themeBtn").onclick=()=>{ const cur=root.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark?"light":"dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("peek:theme", next); } catch(e){} };

$("syncBtn").onclick = async () => {
  const b=$("syncBtn"); if(b.disabled) return;
  const label="⟳ Sync now"; b.disabled=true; b.textContent="⟳ Syncing…"; SYNCING=true; refreshInstructorBar();
  try{
    const res = await httpsCallable(functions, "sync_now", { timeout: 300000 })();
    const d = res.data || {};
    SYNC_REPORT = d;
    LAST_SYNC = d.syncedAt ? new Date(d.syncedAt) : new Date();
    const bad = (d.issues || []).length;
    // Reload so the table shows the new numbers, then surface the report.
    if (COURSE) await loadCourse(COURSE.id);
    renderSyncInfo();
    show("dashboard");
    b.textContent = bad ? `⚠ ${d.ok}/${d.teams} clean` : `✓ Synced ${d.teams}`;
    SYNCING=false; refreshInstructorBar();
    setTimeout(()=>{ b.textContent=label; b.disabled=false; }, 3000);
  }catch(e){
    console.error("sync_now failed:", e);
    SYNC_REPORT = null;
    const code = e.code || "", msg = e.message || String(e);
    let hint = "";
    if (/unauthenticated/i.test(code))        hint = "\n\nYour session expired — sign out and back in.";
    else if (/permission-denied/i.test(code)) hint = "\n\nSync requires a verified @neumont.edu account.";
    else if (/deadline-exceeded/i.test(code)) hint = "\n\nThe sync passed its 5-minute limit. Some teams may have updated; run it again.";
    else if (/not-found/i.test(code))         hint = "\n\nThe Cloud Function isn't deployed. Run: firebase deploy --only functions";
    else if (/internal/i.test(code))          hint = "\n\nThe function errored. Check: firebase functions:log --only sync_now";
    SYNCING=false; refreshInstructorBar();
    alert("Sync failed: " + (code ? code + " — " : "") + msg + hint);
    b.textContent=label; b.disabled=false;
  }
};
</script>
</body>
</html>
